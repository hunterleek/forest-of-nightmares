<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="description" content="Forest of Nightmares — Cinematic 3D Horror Survival Game">
<link rel="manifest" href="manifest.json">

<title>🌲 Forest of Nightmares</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Georgia',serif;cursor:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;top:0;left:0}
#blood{position:fixed;inset:0;pointer-events:none;z-index:8;background:radial-gradient(ellipse at center,transparent 70%,rgba(139,0,0,.55) 100%);opacity:0;transition:opacity .15s}
#blood.splat{opacity:1;transition:opacity 0s}
#blood.splat::after{content:'';position:absolute;top:10%;left:15%;width:70%;height:80%;background:radial-gradient(ellipse at 30% 40%,rgba(180,0,0,.3) 0%,transparent 60%),radial-gradient(ellipse at 70% 30%,rgba(140,0,0,.25) 0%,transparent 50%),radial-gradient(ellipse at 50% 60%,rgba(160,0,0,.2) 0%,transparent 55%);border-radius:40%}
#grain{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:.06;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:128px;animation:grain .15s steps(5) infinite}
@keyframes grain{0%,100%{transform:translate(0,0)}10%{transform:translate(-1%,-2%)}20%{transform:translate(-2%,1%)}30%{transform:translate(1%,-1%)}40%{transform:translate(-1%,2%)}50%{transform:translate(2%,1%)}60%{transform:translate(1%,1%)}70%{transform:translate(-2%,-1%)}80%{transform:translate(-1%,1%)}90%{transform:translate(1%,-2%)}}
#overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse at center,#0a0000 0%,#000 100%);transition:opacity .8s;cursor:pointer}
#overlay.hidden{opacity:0;pointer-events:none}
#overlay h1{font-size:clamp(2em,8vw,5em);color:#8b0000;text-shadow:0 0 80px #ff0000,0 0 160px #8b0000,0 0 30px #ff6600;letter-spacing:6px;margin:0;animation:titleGlow 2s ease-in-out infinite;font-family:'Times New Roman',serif}
#overlay h1.sub{font-size:clamp(1.5em,4vw,2.5em);color:#a0522d;text-shadow:0 0 40px #cd853f,0 0 80px #8b4513;animation:glow2 3s ease-in-out infinite}
@keyframes titleGlow{0%,100%{text-shadow:0 0 60px #ff0000,0 0 120px #8b0000}50%{text-shadow:0 0 120px #ff3300,0 0 200px #990000}}
@keyframes glow2{0%,100%{text-shadow:0 0 30px #cd853f}50%{text-shadow:0 0 70px #8b4513}}
#overlay .tagline{color:#654321;font-size:1em;margin:12px 0 30px;letter-spacing:3px}
#overlay .blink{color:#8b0000;font-size:1.3em;animation:blink 1.8s infinite;margin-top:30px;font-weight:bold}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
#overlay .controls{color:#3a2a1a;font-size:.75em;margin-top:20px;max-width:500px;text-align:center;line-height:2}
#hud{position:fixed;bottom:50px;left:50%;transform:translateX(-50%);z-index:10;pointer-events:none;display:none}
#hp-bar{width:300px;height:12px;background:rgba(0,0,0,.8);border:1px solid #333;border-radius:4px;overflow:hidden;margin:0 auto;box-shadow:0 0 10px rgba(0,0,0,.5)}
#hp-fill{height:100%;background:linear-gradient(90deg,#8b0000 0%,#dc143c 35%,#ff6347 60%,#ff4500 100%);transition:width .3s;width:100%;box-shadow:inset 0 1px 2px rgba(255,255,255,.1)}
#hp-text{color:#bbb;font-size:10px;text-align:center;margin:5px 0;text-shadow:0 0 5px #000;font-family:'Courier New',monospace}
#boss-bar{width:300px;height:10px;background:rgba(0,0,0,.8);border:1px solid #400;border-radius:3px;overflow:hidden;margin:10px auto 0;display:none;box-shadow:0 0 15px rgba(255,0,0,.2)}
#boss-fill{height:100%;background:linear-gradient(90deg,#8b0000,#ff0000);transition:width .3s;width:100%}
#boss-text{color:#ff4444;font-size:9px;text-align:center;margin:3px 0;text-shadow:0 0 8px #f00;font-family:'Courier New',monospace}
#msg{position:fixed;top:12%;left:50%;transform:translateX(-50%);color:#cd853f;font-size:1.1em;text-align:center;pointer-events:none;z-index:10;text-shadow:0 0 15px #000,0 0 5px #000;opacity:0;transition:opacity .6s;max-width:90vw;font-style:italic}
#msg.on{opacity:1}
#story{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);color:#d2b48c;font-size:1.2em;text-align:center;pointer-events:none;z-index:10;text-shadow:0 0 20px #000,0 0 10px #000;opacity:0;transition:opacity 1s;max-width:85vw;line-height:2.2;font-style:italic;letter-spacing:1px}
#story.on{opacity:1}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.82) 100%)}
#mobile-ctrl{display:none;position:fixed;bottom:20px;left:0;right:0;z-index:15;pointer-events:none}
@media(max-width:768px),(hover:none){
  #mobile-ctrl{display:flex;justify-content:space-between;align-items:flex-end;padding:0 15px;gap:5px}
  #mobile-ctrl button{pointer-events:all;width:50px;height:50px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:22px;touch-action:manipulation}
}
</style>
</head>
<body>
<div id="blood"></div>
<div id="grain"></div>
<div id="vignette"></div>
<div id="overlay">
  <h1>FOREST OF</h1>
  <h1 class="sub">NIGHTMARES</h1>
  <p class="tagline">ULTRA-REALISTIC HORROR SURVIVAL</p>
  <p class="blink">▶ CLICK TO ENTER THE BLACKWOOD ◀</p>
  <p class="controls">WASD Move · Mouse Look · Click Attack · SPACE Jump<br>SHIFT Sprint · F Flashlight · R Reload · ESC Pause</p>
</div>
<div id="hud">
  <div id="hp-bar"><div id="hp-fill"></div></div>
  <div id="hp-text">♥ 100 / 100</div>
  <div id="boss-bar"><div id="boss-fill"></div></div>
  <div id="boss-text"></div>
</div>
<div id="msg"></div>
<div id="story"></div>

<script type="importmap">

<script type="module">
import * as THREE from 'three';
// ═══════════════════════════════════════════════════════════
//  FOREST OF NIGHTMARES — ULTRA REALISTIC EDITION
//  SSAO · Bloom · Rain · Wind · Blood · Gore · PBR · God Rays
// ═══════════════════════════════════════════════════════════

// ─── AUDIO ENGINE (Procedural) ───
const AC = new (window.AudioContext||window.webkitAudioContext)();
const sfx=(f,t,d,v=.08,g=0)=>{try{const o=AC.createOscillator(),gn=AC.createGain(),tm=AC.currentTime;o.type=t;o.frequency.setValueAtTime(f,tm);if(g)o.frequency.linearRampToValueAtTime(f+g,tm+d);gn.gain.setValueAtTime(v,tm);gn.gain.exponentialRampToValueAtTime(.001,tm+d);o.connect(gn);gn.connect(AC.destination);o.start(tm);o.stop(tm+d)}catch(e){}};
const sHit=()=>{sfx(55,'sawtooth',.1,.18);sfx(30,'square',.06,.12);sfx(90,'triangle',.04,.1)};
const sPower=()=>{for(let i=0;i<8;i++)setTimeout(()=>sfx(200+i*180,'sine',.05,.04),i*50);sfx(70,'square',.12,.25,50)};
const sStretch=()=>{sfx(40,'sawtooth',.1,.4,15);sfx(55,'square',.06,.25)};
const sRoar=()=>{sfx(20,'sawtooth',.18,.55,8);sfx(35,'square',.1,.35);sfx(50,'triangle',.08,.3)};
const sSSJ=()=>{for(let i=0;i<12;i++)setTimeout(()=>sfx(250+i*130,'sine',.05,.05),i*40);sfx(50,'sawtooth',.15,.35,60);sfx(80,'square',.1,.25)};
const sWin=()=>{for(let i=0;i<16;i++)setTimeout(()=>sfx(240+i*90,'triangle',.04,.07),i*65)};
const sDance=()=>{sfx(523,'square',.05,.1);setTimeout(()=>sfx(659,'square',.05,.1),120);setTimeout(()=>sfx(784,'square',.05,.1),240);setTimeout(()=>sfx(1047,'square',.07,.15),360)};
const sAmbient=()=>{sfx(80+Math.random()*40,'triangle',.04,2.5);setTimeout(()=>sfx(120+Math.random()*50,'triangle',.03,2),600+Math.random()*600);setTimeout(()=>sfx(40+Math.random()*30,'sawtooth',.02,3),1200+Math.random()*800)};
const sSplat=()=>{for(let i=0;i<4;i++)sfx(30+Math.random()*40,'square',.04,.15)};
const sCreak=()=>{sfx(40+Math.random()*30,'sawtooth',.03,.8,5);setTimeout(()=>sfx(50+Math.random()*40,'sawtooth',.02,.6,8),300)};
const sThunder=()=>{sfx(15,'sawtooth',.25,1.5,3);sfx(25,'square',.15,1);setTimeout(()=>sfx(35,'sawtooth',.1,.8),200)};
const sRain_hit=()=>{sfx(200+Math.random()*300,'sine',.01,.08)};
let ambLoop;const startAmbient=()=>{ambLoop=setInterval(sAmbient,2500+Math.random()*2000)};

// ─── RENDERER ───
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance',alpha:false,stencil:false,depth:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.6;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2('#010006',.000035);
scene.background=new THREE.Color('#010008');

const camera=new THREE.PerspectiveCamera(82,window.innerWidth/window.innerHeight,.2,220);
camera.position.set(0,1.7,12);camera.lookAt(0,1.5,-10);

// ─── LIGHTING ───
scene.add(new THREE.AmbientLight('#151030',.15));
const moonLight=new THREE.DirectionalLight('#8899cc',.55);
moonLight.position.set(55,65,-45);moonLight.castShadow=true;
moonLight.shadow.mapSize.set(2048,2048);moonLight.shadow.camera.near=.5;moonLight.shadow.camera.far=220;
moonLight.shadow.camera.left=-55;moonLight.shadow.camera.right=55;
moonLight.shadow.camera.top=55;moonLight.shadow.camera.bottom=-55;
moonLight.shadow.bias=-.0003;moonLight.shadow.normalBias=.03;
scene.add(moonLight);

const moonGeo=new THREE.SphereGeometry(5,32,16);
const moonMat=new THREE.MeshBasicMaterial({color:'#ffe8cc'});
const moonObj=new THREE.Mesh(moonGeo,moonMat);
moonObj.position.set(50,55,-80);scene.add(moonObj);
const moonGlow=new THREE.PointLight('#ffe8cc',8,120);
moonGlow.position.copy(moonObj.position);scene.add(moonGlow);

// God rays sprite
const godRayGeo=new THREE.PlaneGeometry(60,60);
const godRayCanvas=document.createElement('canvas');godRayCanvas.width=256;godRayCanvas.height=256;
const grCtx=godRayCanvas.getContext('2d');
const grGrad=grCtx.createRadialGradient(128,128,0,128,128,128);
grGrad.addColorStop(0,'rgba(200,200,255,.15)');grGrad.addColorStop(.3,'rgba(150,170,220,.06)');grGrad.addColorStop(.7,'rgba(50,60,100,.01)');grGrad.addColorStop(1,'rgba(0,0,0,0)');
grCtx.fillStyle=grGrad;grCtx.fillRect(0,0,256,256);
const godRayTex=new THREE.CanvasTexture(godRayCanvas);
const godRayMat=new THREE.MeshBasicMaterial({map:godRayTex,transparent:true,opacity:.4,blending:THREE.AdditiveBlending,depthWrite:false});
const godRayPlane=new THREE.Mesh(godRayGeo,godRayMat);
godRayPlane.position.set(50,50,-70);scene.add(godRayPlane);

// Flashlight
const flashLight=new THREE.SpotLight('#ffe8c8',3,40,Math.PI/6,.3,.8);
flashLight.position.copy(camera.position);flashLight.castShadow=true;
flashLight.shadow.mapSize.set(1024,1024);flashLight.shadow.bias=-.0001;
scene.add(flashLight);
const flashTarget=new THREE.Object3D();flashTarget.position.set(0,0,-15);
scene.add(flashTarget);flashLight.target=flashTarget;

// ─── STARS ───
const starsGeo=new THREE.BufferGeometry();
const starsArr=[];for(let i=0;i<4000;i++)starsArr.push((Math.random()-.5)*350,25+Math.random()*100,-(Math.random()*.8+.2)*180);
starsGeo.setAttribute('position',new THREE.Float32BufferAttribute(starsArr,3));
const stars=new THREE.Points(starsGeo,new THREE.PointsMaterial({color:'#fff',size:.22,transparent:true,opacity:.75,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(stars);

// ─── PROCEDURAL TEXTURES ───
function createGroundTex(){
  const c=document.createElement('canvas');c.width=c.height=512;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#140a03';ctx.fillRect(0,0,512,512);
  for(let i=0;i<5000;i++){ctx.fillStyle=`rgba(${12+Math.random()*28},${6+Math.random()*15},${1+Math.random()*7},.55)`;ctx.fillRect(Math.random()*512,Math.random()*512,2+Math.random()*6,2+Math.random()*6)}
  for(let i=0;i<300;i++){ctx.strokeStyle=`rgba(18,${8+Math.random()*10},3,.35)`;ctx.lineWidth=.5+Math.random()*.8;ctx.beginPath();ctx.moveTo(Math.random()*512,Math.random()*512);ctx.lineTo(Math.random()*512,Math.random()*512);ctx.stroke()}
  // Dark wet patches
  for(let i=0;i<15;i++){const g=ctx.createRadialGradient(Math.random()*512,Math.random()*512,0,Math.random()*512,Math.random()*512,30+Math.random()*40);g.addColorStop(0,'rgba(5,2,0,.4)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,512,512)}
  const tex=new THREE.CanvasTexture(c);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(22,22);
  tex.colorSpace=THREE.SRGBColorSpace;
  return tex;
}
function createBarkTex(){
  const c=document.createElement('canvas');c.width=256;c.height=512;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#1a0f05';ctx.fillRect(0,0,256,512);
  for(let i=0;i<200;i++){ctx.strokeStyle=`rgba(${15+Math.random()*20},${6+Math.random()*10},${2+Math.random()*5},.7)`;ctx.lineWidth=1+Math.random()*3;ctx.beginPath();ctx.moveTo(Math.random()*256,Math.random()*512);ctx.lineTo(Math.random()*256,Math.random()*512);ctx.stroke()}
  for(let i=0;i<40;i++){ctx.strokeStyle=`rgba(10,4,1,.6)`;ctx.lineWidth=2+Math.random()*4;ctx.beginPath();let y=i*13+Math.random()*5;ctx.moveTo(0,y);for(let x=0;x<256;x+=20)ctx.lineTo(x+Math.random()*15,y+Math.random()*8-Math.random()*8);ctx.stroke()}
  const tex=new THREE.CanvasTexture(c);tex.wrapS=THREE.RepeatWrapping;tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(2,3);
  tex.colorSpace=THREE.SRGBColorSpace;
  return tex;
}
const groundTex=createGroundTex();
const barkTex=createBarkTex();

// ─── TERRAIN (Realistic Hills) ───
const groundGeo=new THREE.PlaneGeometry(320,320,80,80);
const pos=groundGeo.attributes.position;
for(let i=0;i<pos.count;i++){
  const x=pos.getX(i),y=pos.getY(i);
  const h=Math.sin(x*.025)*Math.cos(y*.035)*3+Math.sin(x*.07+y*.05)*1.5+Math.cos(x*.04)*Math.sin(y*.06)*1+Math.sin(x*.12+y*.08)*.5;
  if(Math.abs(x)<5&&Math.abs(y)<5)pos.setZ(i,Math.max(h,-.1));else pos.setZ(i,h);
}
groundGeo.computeVertexNormals();
const groundMat=new THREE.MeshStandardMaterial({map:groundTex,roughness:.82,metalness:.02,color:'#140c04'});
const ground=new THREE.Mesh(groundGeo,groundMat);
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;ground.position.y=-.4;
scene.add(ground);

// Path
const pathGeo=new THREE.PlaneGeometry(3.5,320,2,60);
const pathCanvas=document.createElement('canvas');pathCanvas.width=256;pathCanvas.height=64;
const pCtx=pathCanvas.getContext('2d');pCtx.fillStyle='#1a1008';pCtx.fillRect(0,0,256,64);
for(let i=0;i<500;i++){pCtx.fillStyle=`rgba(${20+Math.random()*15},${10+Math.random()*10},${3+Math.random()*5},.5)`;pCtx.fillRect(Math.random()*256,Math.random()*64,2+Math.random()*4,1+Math.random()*2)}
const pathTex=new THREE.CanvasTexture(pathCanvas);pathTex.wrapS=THREE.RepeatWrapping;pathTex.repeat.set(18,1);
const pathMat=new THREE.MeshStandardMaterial({map:pathTex,roughness:.88,transparent:true,opacity:.5,color:'#1a0f06'});
const path=new THREE.Mesh(pathGeo,pathMat);
path.rotation.x=-Math.PI/2;path.position.y=.03;path.position.z=-65;path.receiveShadow=true;scene.add(path);

// ─── WATER PUDDLES ───
for(let i=0;i<30;i++){
  const px=(Math.random()-.5)*100,pz=-(Math.random()*.5+.03)*110;
  if(Math.abs(px)<3&&pz>-5)continue;
  const puddleGeo=new THREE.CircleGeometry(.3+Math.random()*.8,8);
  const puddleTex=new THREE.CanvasTexture((()=>{const cc=document.createElement('canvas');cc.width=64;cc.height=64;const cx=cc.getContext('2d');cx.fillStyle='#0a0a18';cx.fillRect(0,0,64,64);cx.fillStyle='rgba(30,30,50,.3)';cx.beginPath();cx.arc(32,32,28,0,Math.PI*2);cx.fill();return cc})());
  const puddle=new THREE.Mesh(puddleGeo,new THREE.MeshStandardMaterial({map:puddleTex,roughness:.1,metalness:.8,color:'#1a2a3a',transparent:true,opacity:.7}));
  puddle.rotation.x=-Math.PI/2;puddle.position.set(px,.02,pz);puddle.receiveShadow=true;scene.add(puddle);
}

// ─── TREES (Ultra-detailed with bark texture) ───
const treeGroup=new THREE.Group();
const treeData=[];
for(let i=0;i<200;i++){
  const tx=(Math.random()-.5)*270,tz=-(Math.random()*.65+.04)*170;
  if(Math.abs(tx)<2.5&&tz>-8&&tz<0)continue;
  const h=2.2+Math.random()*16,variant=Math.floor(Math.random()*3);
  const trunkGeo=new THREE.CylinderGeometry(.1+Math.random()*.35,.2+Math.random()*.45,h,12,8);
  const trunk=new THREE.Mesh(trunkGeo,new THREE.MeshStandardMaterial({map:barkTex,roughness:.9,metalness:0,color:`rgb(${25+Math.random()*25},${12+Math.random()*15},${4+Math.random()*8})`}));
  trunk.position.set(tx,h/2,tz);trunk.castShadow=true;trunk.receiveShadow=true;trunk.userData={baseX:tx,baseZ:tz,swayOffset:Math.random()*Math.PI*2};treeGroup.add(trunk);
  const layers=2+Math.floor(Math.random()*3);
  for(let l=0;l<layers;l++){
    const cy=h*.35+l*2,cr=1+l*.8+(Math.random()-.5)*.5;
    if(variant===0){const cone=new THREE.Mesh(new THREE.ConeGeometry(cr,2+Math.random()*3,10,6),new THREE.MeshStandardMaterial({color:`rgb(${4+Math.random()*10},${8+Math.random()*20},${1+Math.random()*6})`,roughness:.85}));cone.position.set(tx,cy,tz);cone.castShadow=true;cone.receiveShadow=true;cone.userData={baseX:tx,baseZ:tz,swayOffset:Math.random()*Math.PI*2};treeGroup.add(cone)}
    else if(variant===1){const sph=new THREE.Mesh(new THREE.SphereGeometry(cr,8,6),new THREE.MeshStandardMaterial({color:`rgb(${6+Math.random()*8},${10+Math.random()*16},${2+Math.random()*5})`,roughness:.8}));sph.position.set(tx+(Math.random()-.5)*.6,cy,tz+(Math.random()-.5)*.6);sph.castShadow=true;sph.userData={baseX:tx,baseZ:tz,swayOffset:Math.random()*Math.PI*2};treeGroup.add(sph)}
    else{for(let s=-1;s<=1;s+=2){const ic=new THREE.Mesh(new THREE.IcosahedronGeometry(cr*.55,1),new THREE.MeshStandardMaterial({color:`rgb(${5+Math.random()*8},${7+Math.random()*12},${1+Math.random()*5})`,roughness:.75}));ic.position.set(tx+s*(.7+l*.3),cy+(Math.random()-.5)*.8,tz+(Math.random()-.5)*.8);ic.castShadow=true;ic.userData={baseX:tx,baseZ:tz,swayOffset:Math.random()*Math.PI*2};treeGroup.add(ic)}}
  }
  if(Math.random()<.4){const brGeo=new THREE.CylinderGeometry(.03,.07,1+Math.random()*3,6);const br=new THREE.Mesh(brGeo,new THREE.MeshStandardMaterial({color:'#3a1a08',roughness:.9}));br.position.set(tx+(Math.random()-.5)*1.2,h*.55,tz);br.rotation.z=(Math.random()-.5)*1.6;br.rotation.x=(Math.random()-.5)*.8;br.castShadow=true;treeGroup.add(br)}
  treeData.push({x:tx,h,z:tz});
}
scene.add(treeGroup);

// ─── ROCKS ───
for(let i=0;i<90;i++){
  const rx=(Math.random()-.5)*240,rz=-(Math.random()*.55+.1)*160,s=.12+Math.random()*2.5;
  const rock=new THREE.Mesh(new THREE.IcosahedronGeometry(s,Math.floor(Math.random()*2)+1),new THREE.MeshStandardMaterial({color:`rgb(${30+Math.random()*50},${25+Math.random()*35},${18+Math.random()*30})`,roughness:.65}));
  rock.position.set(rx,s*.25,rz);rock.rotation.set(Math.random()*Math.PI,Math.random()*Math.PI,Math.random()*Math.PI);rock.castShadow=true;rock.receiveShadow=true;scene.add(rock);
}

// ─── GRASS & PLANTS ───
const grassGroup=new THREE.Group();
for(let i=0;i<500;i++){
  const gx=(Math.random()-.5)*110,gz=-(Math.random()*.45+.02)*130;
  if(Math.abs(gx)<2.5&&gz>-6)continue;

function spawnParts(pos,color,n=25,spd=4,life=55,blood=false){

    const size=blood?.06+.15*Math.random():.05+.12*Math.random();

  }

  let t=0;const iv=setInterval(()=>{t+=16;let alive=false;g.children.forEach(p=>{p.userData.life-=16;p.position.x+=p.userData.vx*.016;p.position.y+=p.userData.vy*.016;p.position.z+=p.userData.vz*.016;p.userData.vy-=3*.016;p.material.opacity=Math.max(0,p.userData.life/life);if(p.userData.life>0)alive=true;if(p.userData.blood&&p.position.y<.1&&p.userData.life>life*.3){addBloodDecal(p.position);p.userData.life=0}});if(!alive){clearInterval(iv);scene.remove(g);g.children.forEach(c=>{c.material.dispose();c.geometry.dispose()})}},16);

}

const raycaster=new THREE.Raycaster();raycaster.far=9;

  for(let s=-1;s<=1;s+=2){const horn=new THREE.Mesh(new THREE.ConeGeometry(.2,.65,6),new THREE.MeshStandardMaterial({color:'#1a1a1a'}));horn.position.set(s*.32,3.85,0);horn.rotation.z=s*.2;bendy.add(horn);const eye=new THREE.Mesh(new THREE.SphereGeometry(.22,8),new THREE.MeshBasicMaterial({color:'#fff'}));eye.position.set(s*.28,3.4,-.7);bendy.add(eye)}

  // Mr Krabs
  const krabs=new THREE.Group();
  const kBody=new THREE.Mesh(new THREE.SphereGeometry(1.25,1,.95,14,8),new THREE.MeshStandardMaterial({color:'#e82020',roughness:.2}));kBody.scale.set(1.18,1,1);kBody.position.y=1.3;kBody.castShadow=true;krabs.add(kBody);
  for(let s=-1;s<=1;s+=2){const claw=new THREE.Mesh(new THREE.SphereGeometry(.6,8),new THREE.MeshStandardMaterial({color:'#ff3030'}));claw.position.set(s*1.9,1,.5);krabs.add(claw);const eyeStalk=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,.5,6),new THREE.MeshStandardMaterial({color:'#d42020'}));eyeStalk.position.set(s*.5,2.1,.5);krabs.add(eyeStalk);const eye=new THREE.Mesh(new THREE.SphereGeometry(.24,8),new THREE.MeshBasicMaterial({color:'#fff'}));eye.position.set(s*.5,2.5,.6);krabs.add(eye)}
  krabs.position.set(7,0,-70);scene.add(krabs);
  // Victory portal
  const portal=new THREE.Mesh(new THREE.TorusGeometry(4.5,.35,16,48),new THREE.MeshBasicMaterial({color:'#ffd700',transparent:true,opacity:.65,blending:THREE.AdditiveBlending}));
  portal.position.set(0,4.5,-70);portal.rotation.x=Math.PI/2;scene.add(portal);
  const portalLight=new THREE.PointLight('#ffd700',4,30);portalLight.position.copy(portal.position);scene.add(portalLight);
  // Cuphead pizza glow
  const pizzaGlow=new THREE.PointLight('#ff8c00',2,10);pizzaGlow.position.set(0,1.5,-69);scene.add(pizzaGlow);
  endingObjects=[bendy,krabs,portal,portalLight,pizzaGlow];
  showMsg('\uD83C\uDF1F THE BLACKWOOD IS FREE! THE SOULS ARE RELEASED! \uD83C\uDF1F',6000);
}

// ─── GAME LOOP ───
const clock=new THREE.Clock();
function gameLoop(){
  requestAnimationFrame(gameLoop);
  const dt=Math.min(clock.getDelta(),.12);frameCount++;

  // Damage flash
  if(damageFlash>0){damageFlash--;renderer.domElement.style.filter=`brightness(${1+damageFlash*.025})`}else renderer.domElement.style.filter='';
  if(attackCooldown>0)attackCooldown--;

  // Stars & moon
  stars.rotation.y+=dt*.01;stars.material.opacity=.65+.15*Math.sin(frameCount*.0025);
  godRayPlane.material.opacity=.25+.12*Math.sin(frameCount*.0015);

  // Dynamic fog
  scene.fog.density=.00003+.00002*Math.sin(frameCount*.0002);
  // Rain
  rainIntensity+=(targetRain-rainIntensity)*dt*.5;
  rainMat.opacity=.08+.15*rainIntensity;rainSystem.visible=rainIntensity>.03;
  const rpos=rainSystem.geometry.attributes.position;for(let i=0;i<rainDropsCount;i++){rpos.array[i*3+1]-=15*dt*rainIntensity;if(rpos.array[i*3+1]<-1){rpos.array[i*3+1]=25+Math.random()*5;rpos.array[i*3]=(Math.random()-.5)*100;rpos.array[i*3+2]=-(Math.random()*.8+.05)*140}}rpos.needsUpdate=true;
  // Thunder
  thunderTimer-=dt;if(thunderTimer<=0&&rainIntensity>.3&&Math.random()<.005){thunderTimer=8+Math.random()*15;thunderFlash=.8+Math.random()*.5;sThunder();renderer.toneMappingExposure=1.2}
  if(thunderFlash>0){thunderFlash=Math.max(0,thunderFlash-dt*4);renderer.toneMappingExposure=.6+thunderFlash}

  // Tree sway (wind)
  const windStrength=.05+.1*rainIntensity;
  treeGroup.children.forEach(c=>{if(c.userData&&c.userData.swayOffset!==undefined){c.position.x=c.userData.baseX+Math.sin(frameCount*.01+c.userData.swayOffset)*windStrength;c.position.z=c.userData.baseZ+Math.cos(frameCount*.012+c.userData.swayOffset)*windStrength*.5}});
  grassGroup.children.forEach(c=>{if(c.userData&&c.userData.swayOffset!==undefined){c.position.x=c.userData.baseX+Math.sin(frameCount*.015+c.userData.swayOffset)*windStrength*1.5}});

  if(gameState==='playing'){
    // Mouse look
    if(mouseLocked){euler.set(cameraPitch,cameraYaw,0);camera.quaternion.setFromEuler(euler)}
    // Movement with touch support
    velocity.x=0;velocity.z=0;
    if(keys['w']||touchState.move.y<-0.3)velocity.z-=1;
    if(keys['s']||touchState.move.y>0.3)velocity.z+=1;
    if(keys['a']||touchState.move.x<-0.3)velocity.x-=1;
    if(keys['d']||touchState.move.x>0.3)velocity.x+=1;
    direction.set(velocity.x,0,velocity.z).normalize();
    sprinting=keys['shift'];const speed=sprinting?7.5:4;
    if(velocity.length()>0){headBob+=dt*12;const fwd=direction.clone().applyQuaternion(camera.quaternion);fwd.y=0;fwd.normalize();camera.position.x+=fwd.x*speed*dt;camera.position.z+=fwd.z*speed*dt}
    if(!grounded)velocity.y-=16*dt;
    const bob=velocity.length()>0?Math.sin(headBob)*.05:0;camera.position.y+=bob;
    if((keys[' ']||touchState.jump)&&grounded){velocity.y=8.5;grounded=false;sfx(130,'sine',.03,.05)}
    camera.position.y+=velocity.y*dt;
    const ty=getTerrainHeight(camera.position.x,camera.position.z);
    if(camera.position.y<=ty+1.6){camera.position.y=ty+1.6;velocity.y=0;grounded=true}
    camera.position.x=Math.max(-120,Math.min(120,camera.position.x));camera.position.z=Math.max(-155,Math.min(12,camera.position.z));

    // Flashlight
    flashLight.intensity=flashlightOn?3:0;flashLight.position.copy(camera.position);flashLight.position.y+=.5;
    const lookT=new THREE.Vector3();camera.getWorldDirection(lookT);flashTarget.position.copy(camera.position).add(lookT.multiplyScalar(15));

    // Lore
    checkLore();

    // Ambient creaks
    if(Math.random()<.004){sCreak();if(Math.random()<.4&&rainIntensity>.2)sRain_hit()}

    const cz=camera.position.z;
    // Trigger Cat
    if(cz<-30&&!catActive&&!catDefeated){catActive=true;catBoss.visible=true;catBoss.position.set(camera.position.x+(Math.random()-.5)*6,getTerrainHeight(camera.position.x,camera.position.z),camera.position.z-12);showMsg('\uD83D\uDC31 CARTOON CAT: "Foolish mortal... you wander into MY hunting grounds?"',4500);showBossBar(catHP,catMHP,'\uD83D\uDC31 CARTOON CAT');sRoar();sStretch();targetRain=.5}
    // Trigger Siren
    if(cz<-60&&!sirActive&&!sirDefeated&&catDefeated){sirActive=true;sirenBoss.visible=true;sirenBoss.position.set(camera.position.x+(Math.random()-.5)*8,getTerrainHeight(camera.position.x,camera.position.z),camera.position.z-10);showMsg('\uD83D\uDCE2 SIREN HEAD: *EAR-SPLITTING SCREECH* ...Your power intrigues me, mortal...',5000);showBossBar(sirHP,sirMHP,'\uD83D\uDCE2 SIREN HEAD');sRoar();targetRain=.7}

    // Cat AI
    if(catActive&&!catDefeated&&catBoss.visible){bossTimers.cat++;catBoss.lookAt(camera.position);const dist=camera.position.distanceTo(catBoss.position);catBoss.position.y=getTerrainHeight(catBoss.position.x,catBoss.position.z)+Math.sin(frameCount*.035)*.4;
      if(bossTimers.cat>90&&dist<16&&!stretchActive){stretchActive=true;bossTimers.cat=0;const rArm=catBoss.getObjectByName('rArm');if(rArm){rArm.scale.y=4.5;rArm.position.z=-3}const rPaw=catBoss.getObjectByName('rPaw');if(rPaw)rPaw.position.z=-14;sStretch();spawnParts(catBoss.position.clone().add(new THREE.Vector3(0,1.5,0)),'#ff0',18,4,35);setTimeout(()=>{const ra=catBoss.getObjectByName('rArm');if(ra){ra.scale.y=1;ra.position.z=0}const rp=catBoss.getObjectByName('rPaw');if(rp)rp.position.z=0;stretchActive=false;if(dist<9)takeDamage(22)},1100)}
      if(bossTimers.cat>130&&!stretchActive){bossTimers.cat=0;const mv=camera.position.clone().sub(catBoss.position).normalize().multiplyScalar(1.8);catBoss.position.add(mv);if(dist<6){takeDamage(18);addBloodDecal(camera.position.clone())}}
      const eyes=catBoss.children.filter(c=>c.name==='eye');eyes.forEach(e=>e.material.color.setHSL(.15,.85,.45+.4*Math.sin(frameCount*.004)));showBossBar(catHP,catMHP,'\uD83D\uDC31 CARTOON CAT')}
    // Siren AI
    if(sirActive&&!sirDefeated&&sirenBoss.visible){bossTimers.sir++;sirenBoss.lookAt(camera.position);const dist=camera.position.distanceTo(sirenBoss.position);sirenBoss.position.y=getTerrainHeight(sirenBoss.position.x,sirenBoss.position.z);
      if(sirHP<sirMHP*.35&&!sirSSJ){sirSSJ=true;const a=sirenBoss.getObjectByName('ssjAura');if(a)a.intensity=5;const g=sirenBoss.getObjectByName('ssjGlow');if(g)g.material.opacity=.55;const r=sirenBoss.getObjectByName('ssjRing');if(r)r.material.opacity=.6;sSSJ();spawnParts(sirenBoss.position.clone().add(new THREE.Vector3(0,15,0)),'#ffd700',80,8,100,true);showMsg('\u26a1\u26a1 SIREN HEAD UNLEASHES SUPER SAIYAN FURY!!! \u26a1\u26a1',5000);targetRain=.9;thunderTimer=2}
      if(bossTimers.sir>80){bossTimers.sir=0;const rush=camera.position.clone().sub(sirenBoss.position).normalize().multiplyScalar(sirSSJ?3:1.5);sirenBoss.position.add(rush);if(dist<7){takeDamage(sirSSJ?35:20);addBloodDecal(camera.position.clone())}if(Math.random()<.5){sfx(28,'sawtooth',.12,.4);spawnParts(sirenBoss.position.clone().add(new THREE.Vector3(0,8,0)),'#ff5500',25,6,45,true)}}
      if(sirSSJ){const a=sirenBoss.getObjectByName('ssjAura');if(a)a.intensity=4+Math.sin(frameCount*.006)*1.5;const r=sirenBoss.getObjectByName('ssjRing');if(r){r.rotation.z+=.05;r.material.opacity=.5+.25*Math.sin(frameCount*.008)}const hl=sirenBoss.children.filter(c=>c.name==='hornLight');hl.forEach(h=>h.material.color.setHSL(.15,.9,.45+.45*Math.sin(frameCount*.01)))}
      showBossBar(sirHP,sirMHP,(sirSSJ?'\u26a1':'\uD83D\uDCE2')+' SIREN HEAD',sirSSJ)}
  }

  // Ending
  if(gameState==='ending'){endTimer+=dt;const t=endTimer,orR=16;camera.position.x=Math.sin(t*.28)*orR;camera.position.z=-70+Math.cos(t*.28)*orR;camera.position.y=4+Math.sin(t*.18)*2.5;camera.lookAt(0,3,-70);endingObjects.forEach(o=>{if(o.type==='Group'){o.position.y+=Math.sin(t*3.5+o.position.x)*.6;o.rotation.y+=dt*1.2}});if(t>2&&Math.floor(t*2)%3===0)sDance();rainIntensity=Math.max(0,rainIntensity-dt*.3);targetRain=0;
    if(t>2.5&&Math.floor(t*5)%2===0)spawnParts(new THREE.Vector3(0,2,-68),'#ffaa00',8,3,35);
    if(t>3)showMsg('\uD83D\uDD7A BENDY HITS THE GRIDDY! \uD83E\uDD80 MR KRABS: "I LOVE MONEY!" \uD83D\uDD25 GETTING FRIED!',5000);
    if(t>14){document.getElementById('overlay').classList.remove('hidden');document.getElementById('overlay').querySelector('h1').textContent='YOU SURVIVED';document.getElementById('overlay').querySelector('.sub').textContent='The Blackwood is FREE';document.getElementById('overlay').querySelector('.blink').textContent='CLICK TO PLAY AGAIN';document.getElementById('overlay').querySelector('.tagline').textContent='Bendy Griddy \u2705  Cuphead Censored \u2705  Krabs Fried \u2705  Blood Decals \uD83E\uDE78';document.getElementById('overlay').onclick=()=>location.reload()}}
  if(gameState==='gameover'){endTimer+=dt;if(endTimer>5){document.getElementById('overlay').onclick=()=>location.reload()}}

  // Blood decal cleanup
  for(let i=bloodDecals.length-1;i>=0;i--){bloodDecals[i].timer--;if(bloodDecals[i].timer<=0){scene.remove(bloodDecals[i].mesh);bloodDecals.splice(i,1)}}

  // Mist
  mistGroup.children.forEach(m=>{m.position.x+=m.userData.vx*dt;m.position.y+=m.userData.vy*dt;m.position.z+=m.userData.vz*dt;if(m.position.x>60)m.position.x=-60;if(m.position.x<-60)m.position.x=60;if(m.position.y>10)m.position.y=.3;if(m.position.z>5)m.position.z=-140});
  // Fireflies
  fireflyData.forEach(ff=>{ff.mesh.position.x=ff.bx+Math.sin(frameCount*.008*ff.speed+ff.phase)*2.5;ff.mesh.position.y=ff.height+Math.sin(frameCount*.012*ff.speed+ff.phase)*2;ff.mesh.material.opacity=.25+.55*Math.sin(frameCount*.025*ff.speed+ff.phase)});
  // Lore stones
  loreStones.forEach(s=>{if(!s.collected){s.stone.material.emissiveIntensity=.4+.4*Math.sin(frameCount*.04);s.glow.material.opacity=.15+.2*Math.sin(frameCount*.05);s.light.intensity=.7+.5*Math.sin(frameCount*.06)}});

  renderer.render(scene,camera);
}

document.addEventListener('click',()=>{AC.resume()},{once:true});
gameLoop();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}

console.log('%c\uD83C\uDFAEClick to play | WASD Move | Mouse Look | Click Attack | SPACE Jump | F Flashlight','color:#aaa');
console.log('%c\uD83D\uDCA3 SSAO · Bloom · Rain · Blood · Wind · Gore · God Rays · Film Grain · 3 Lore Stones · 2 Epic Bosses','color:#8b0000');
