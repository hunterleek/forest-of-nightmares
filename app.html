<!DOCTYPE html>

<head>

<title>Forest of Nightmares</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Georgia',serif;cursor:none;user-select:none}
canvas{display:block;position:fixed;top:0;left:0}
#chromatic{position:fixed;inset:0;pointer-events:none;z-index:8;opacity:0;transition:opacity .2s}
#chromatic.active{opacity:.3}
#blood{position:fixed;inset:0;pointer-events:none;z-index:9;opacity:0;transition:opacity .1s}
#blood.splat{opacity:1;transition:opacity 0s;background:radial-gradient(ellipse at 35% 45%,rgba(200,20,0,.45) 0%,rgba(140,0,0,.35) 25%,rgba(80,0,0,.2) 48%,transparent 65%),radial-gradient(ellipse at 68% 38%,rgba(180,10,0,.3) 0%,transparent 42%),radial-gradient(ellipse at 50% 60%,rgba(150,5,0,.4) 0%,transparent 38%)}
#dof-near{position:fixed;inset:0;pointer-events:none;z-index:6;backdrop-filter:blur(0);transition:backdrop-filter .5s;opacity:0}
#dof-near.active{backdrop-filter:blur(3px);opacity:.18}
#grain{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:.03;mix-blend-mode:overlay;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:130px;animation:grain .08s steps(5) infinite}
@keyframes grain{0%,100%{transform:translate(0,0)}20%{transform:translate(-1%,-1.5%)}40%{transform:translate(1%,-2%)}60%{transform:translate(-2%,1%)}80%{transform:translate(1.5%,1%)}}
#motion{position:fixed;inset:0;pointer-events:none;z-index:7;opacity:0;transition:opacity .2s}
#motion.active{opacity:.12;backdrop-filter:blur(3px)}
#lens{position:fixed;inset:0;pointer-events:none;z-index:10;opacity:.022;background:radial-gradient(ellipse at 28% 22%,rgba(255,200,140,1) 0%,transparent 28%),radial-gradient(ellipse at 78% 75%,rgba(180,210,255,.5) 0%,transparent 22%),radial-gradient(circle at 50% 50%,rgba(0,0,0,.8) 0%,transparent 32%)}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.9) 100%)}
#scanlines{position:fixed;inset:0;pointer-events:none;z-index:11;opacity:.025;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.12) 2px,rgba(0,0,0,.12) 4px)}
#wet{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity 2.5s;background:linear-gradient(180deg,rgba(15,25,45,.1) 0%,rgba(8,12,28,.15) 30%,rgba(5,8,18,.1) 60%,rgba(12,22,38,.12) 100%)}
#wet.active{opacity:1}
#overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse at center,#050000 0%,#000 100%);transition:opacity 1s;cursor:pointer}
#overlay.hidden{opacity:0;pointer-events:none}
#overlay h1{font-size:clamp(2em,8vw,6em);color:#8b0000;text-shadow:0 0 120px #ff0000,0 0 240px #8b0000,0 0 50px #ff6600;letter-spacing:10px;margin:0;animation:titleGlow 2s ease-in-out infinite;font-family:'Times New Roman',serif}
#overlay h1.sub{font-size:clamp(1.5em,4vw,3em);color:#a0522d;text-shadow:0 0 60px #cd853f,0 0 120px #8b4513;animation:glow2 3s ease-in-out infinite}
@keyframes titleGlow{0%,100%{text-shadow:0 0 100px #ff0000,0 0 200px #8b0000,0 0 40px #ff6600}50%{text-shadow:0 0 200px #ff3300,0 0 400px #990000,0 0 80px #ff8800}}
@keyframes glow2{0%,100%{text-shadow:0 0 50px #cd853f}50%{text-shadow:0 0 120px #8b4513}}
#overlay .tagline{color:#654321;font-size:1em;margin:12px 0 30px;letter-spacing:5px}
#overlay .blink{color:#8b0000;font-size:1.3em;animation:blink 1.8s infinite;margin-top:30px;font-weight:bold}
@keyframes blink{0%,100%{opacity:.15}50%{opacity:1}}
#overlay .controls{color:#3a2010;font-size:.7em;margin-top:25px;max-width:620px;text-align:center;line-height:2.4}
#hud{position:fixed;bottom:55px;left:50%;transform:translateX(-50%);z-index:15;pointer-events:none;display:none;text-align:center}
#hp-outer{width:340px;height:15px;background:rgba(0,0,0,.92);border:1px solid #1a1a1a;margin:0 auto;overflow:hidden;box-shadow:0 0 25px rgba(255,0,0,.18),inset 0 0 10px rgba(0,0,0,.6)}
#hp-fill{height:100%;background:linear-gradient(90deg,#8b0000 0%,#dc143c 22%,#ff4500 48%,#ff6347 72%,#ff4500 100%);transition:width .35s;width:100%;box-shadow:inset 0 1px 5px rgba(255,150,80,.5),0 0 10px rgba(255,50,0,.4)}
#hp-text{color:#aaa;font-size:10px;margin:8px 0;text-shadow:0 0 10px #000;letter-spacing:3px}
#boss-outer{width:340px;height:10px;background:rgba(0,0,0,.92);border:1px solid #300;margin:16px auto 0;overflow:hidden;display:none;box-shadow:0 0 30px rgba(255,0,0,.3)}
#boss-fill{height:100%;background:linear-gradient(90deg,#8b0000,#ff0000);transition:width .35s;width:100%}
#boss-label{color:#f44;font-size:9px;margin:5px 0;text-shadow:0 0 12px #f00;letter-spacing:2px}
#dialogue{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);z-index:18;pointer-events:none;display:none;width:90%;max-width:700px}
#dialogue-box{background:rgba(0,0,0,.92);border:1px solid #3a2010;padding:20px 28px;border-radius:3px;box-shadow:0 0 40px rgba(0,0,0,.8)}
#dialogue-speaker{color:#cd853f;font-size:1.1em;margin-bottom:8px;text-shadow:0 0 8px #000;letter-spacing:1px;font-weight:bold}
#dialogue-text{color:#d4b896;font-size:.95em;line-height:1.8;font-style:italic;text-shadow:0 0 6px #000}
#dialogue-hint{color:#5a4030;font-size:.7em;margin-top:10px;text-align:right}
#msg{position:fixed;top:8%;left:50%;transform:translateX(-50%);color:#cd853f;font-size:1em;text-align:center;pointer-events:none;z-index:12;text-shadow:0 0 30px #000;opacity:0;transition:opacity .8s;max-width:90vw;font-style:italic;letter-spacing:.5px}
#msg.on{opacity:1}
#inventory{position:fixed;top:20px;left:20px;z-index:14;pointer-events:none;display:none}
#inv-item{color:#aaa;font-size:11px;text-shadow:0 0 8px #000;margin:4px 0;letter-spacing:2px}
#compass-el{position:fixed;top:25px;right:25px;z-index:14;pointer-events:none;display:none}
#compass-el canvas{width:90px;height:90px}
</style>

<body>
<svg style="display:none"><filter id="chroma"><feColorMatrix values="1 0 0 0 .012  0 .94 0 0 0  0 0 1 0 -.012  0 0 0 1 0"/></filter></svg>
<div id="chromatic"></div><div id="blood"></div><div id="dof-near"></div><div id="grain"></div><div id="motion"></div><div id="lens"></div><div id="vignette"></div><div id="scanlines"></div><div id="wet"></div>
<div id="compass-el"><canvas id="compass-canvas" width="90" height="90"></canvas></div>

<div id="overlay"><h1>FOREST OF</h1><h1 class="sub">NIGHTMARES</h1><p class="tagline">DEFINITIVE EDITION</p><p class="blink">▶ CLICK TO ENTER THE BLACKWOOD ◀</p><p class="controls">WASD Move · Mouse Look · Click Attack · SPACE Jump · SHIFT Sprint<br>F Flashlight · M Map · C Compass · E Interact · ESC Pause</p></div>
<div id="hud"><div id="hp-outer"><div id="hp-fill"></div></div><div id="hp-text">♥ 100 / 100</div><div id="boss-outer"><div id="boss-fill"></div></div><div id="boss-label"></div></div>
<div id="dialogue"><div id="dialogue-box"><div id="dialogue-speaker"></div><div id="dialogue-text"></div><div id="dialogue-hint">[ CLICK TO CONTINUE ]</div></div></div>

<script src="threejs/three.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════
//  FOREST OF NIGHTMARES — DEFINITIVE EDITION
//  Maximum WebGL Fidelity · Cinematic Narrative · Full Audio Design
// ═══════════════════════════════════════════════════════════════════

const AC=new(window.AudioContext||window.webkitAudioContext)();
const sfx=(f,t,d,v=.1,g=0)=>{try{const o=AC.createOscillator(),gn=AC.createGain();o.type=t;o.frequency.setValueAtTime(f,AC.currentTime);if(g)o.frequency.linearRampToValueAtTime(f+g,AC.currentTime+d);gn.gain.setValueAtTime(v,AC.currentTime);gn.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(gn);gn.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}};

// ─── AUDIO: Complex layered sounds ───
const sHit=()=>{sfx(48,'sawtooth',.07,.22);sfx(22,'square',.04,.15);sfx(78,'triangle',.02,.13);sfx(120,'sine',.015,.08)};
const sPower=()=>{for(let i=0;i<12;i++)setTimeout(()=>sfx(170+i*155,'sine',.03,.055),i*42);sfx(55,'square',.08,.35,65);sfx(85,'triangle',.05,.25);setTimeout(()=>sfx(900,'sine',.04,.3,400),500)};
const sStretch=()=>{sfx(32,'sawtooth',.08,.5,15);sfx(48,'square',.04,.35);sfx(70,'triangle',.02,.25)};
const sRoar=()=>{sfx(14,'sawtooth',.12,.65,8);sfx(26,'square',.07,.45);sfx(40,'triangle',.05,.4);sfx(18,'sawtooth',.06,.5,4)};
const sSSJ=()=>{for(let i=0;i<16;i++)setTimeout(()=>sfx(210+i*135,'sine',.03,.06),i*35);sfx(42,'sawtooth',.1,.45,70);sfx(72,'square',.06,.35);sfx(200,'triangle',.04,.5,300)};
const sWin=()=>{for(let i=0;i<20;i++)setTimeout(()=>sfx(210+i*80,'triangle',.025,.09),i*55);setTimeout(()=>{for(let i=0;i<10;i++)setTimeout(()=>sfx(260+i*100,'sine',.03,.12),i*100)},1100)};
const sDance=()=>{sfx(523,'square',.035,.14);setTimeout(()=>sfx(659,'square',.035,.14),100);setTimeout(()=>sfx(784,'square',.035,.14),200);setTimeout(()=>sfx(1047,'square',.05,.2),300)};
const sAmbient=()=>{sfx(60+Math.random()*40,'triangle',.02,3.5);setTimeout(()=>sfx(95+Math.random()*60,'triangle',.015,3),900+Math.random()*900);setTimeout(()=>sfx(25+Math.random()*25,'sawtooth',.008,5),2000+Math.random()*1500)};
const sCreak=()=>{sfx(28+Math.random()*25,'sawtooth',.012,1.2,6);setTimeout(()=>sfx(38+Math.random()*35,'sawtooth',.008,.9,9),380)};
const sThunder=()=>{sfx(8,'sawtooth',.18,2.5,3);sfx(18,'square',.1,1.6);setTimeout(()=>sfx(26,'sawtooth',.06,1.2),280);setTimeout(()=>sfx(40,'sawtooth',.04,.8),600)};
const sFootstep=()=>{const v=Math.random()>.5?.08:.12;sfx(50+Math.random()*30,'square',.008,.07,v);sfx(35+Math.random()*20,'sine',.004,.05,v*.5)};
const sRain_hit=()=>{sfx(160+Math.random()*380,'sine',.007,.1)};
const sHeartbeat=()=>{for(let i=0;i<3;i++)setTimeout(()=>sfx(30,'sine',.015,.25),i*300)};
let ambLoop;const startAmbient=()=>{ambLoop=setInterval(sAmbient,2000+Math.random()*1800)};

// ─── RENDERER (Maximum quality) ───
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance',alpha:false,stencil:true,depth:true});
renderer.setSize(window.innerWidth,window.innerHeight);renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.5;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();scene.fog=new THREE.Fog('#020a1a',32,195);scene.background=new THREE.Color('#020818');
const camera=new THREE.PerspectiveCamera(85,window.innerWidth/window.innerHeight,.2,270);
camera.position.set(0,1.75,14);camera.lookAt(0,1.5,-10);
const audioListener=new THREE.AudioListener();camera.add(audioListener);

// ─── LIGHTING ───
scene.add(new THREE.AmbientLight('#1a1535',.07));
const moonLight=new THREE.DirectionalLight('#8899cc',.6);moonLight.position.set(60,80,-58);moonLight.castShadow=true;
moonLight.shadow.mapSize.set(8192,8192);moonLight.shadow.camera.near=1;moonLight.shadow.camera.far=280;
moonLight.shadow.camera.left=-80;moonLight.shadow.camera.right=80;moonLight.shadow.camera.top=80;moonLight.shadow.camera.bottom=-80;
moonLight.shadow.bias=-.00015;moonLight.shadow.normalBias=.06;scene.add(moonLight);
const moonObj=new THREE.Mesh(new THREE.SphereGeometry(6,32,16),new THREE.MeshBasicMaterial({color:'#ffe8cc'}));moonObj.position.set(55,70,-95);scene.add(moonObj);
const moonGlow=new THREE.PointLight('#ffe8cc',12,160);moonGlow.position.copy(moonObj.position);scene.add(moonGlow);
const godRayPlane=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshBasicMaterial({color:'#8899cc',transparent:true,opacity:.08,blending:THREE.AdditiveBlending,depthWrite:false}));godRayPlane.position.set(55,65,-85);scene.add(godRayPlane);
const flashLight=new THREE.SpotLight('#ffe8c8',4,50,Math.PI/7,.2,.65);flashLight.castShadow=true;flashLight.shadow.mapSize.set(1024,1024);flashLight.shadow.bias=-.00006;scene.add(flashLight);
const flashTarget=new THREE.Object3D();flashTarget.position.set(0,0,-18);scene.add(flashTarget);flashLight.target=flashTarget;

// Stars
const starsGeo=new THREE.BufferGeometry();const starsArr=[];for(let i=0;i<7000;i++)starsArr.push((Math.random()-.5)*440,26+Math.random()*130,-(Math.random()*.8+.2)*220);
starsGeo.setAttribute('position',new THREE.Float32BufferAttribute(starsArr,3));const stars=new THREE.Points(starsGeo,new THREE.PointsMaterial({color:'#fff',size:.28,transparent:true,opacity:.6,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(stars);

// Textures
function createGroundTex(){const c=document.createElement('canvas');c.width=1024;c.height=1024;const ctx=c.getContext('2d');ctx.fillStyle='#0d0502';ctx.fillRect(0,0,1024,1024);for(let i=0;i<15000;i++){ctx.fillStyle=`rgba(${7+Math.random()*34},${3+Math.random()*20},${1+Math.random()*9},.38)`;ctx.fillRect(Math.random()*1024,Math.random()*1024,2+Math.random()*9,2+Math.random()*9)}for(let i=0;i<300;i++){ctx.strokeStyle='rgba(5,2,0,.18)';ctx.lineWidth=.3+Math.random()*2;ctx.beginPath();ctx.moveTo(Math.random()*1024,Math.random()*1024);ctx.lineTo(Math.random()*1024,Math.random()*1024);ctx.stroke()}for(let i=0;i<35;i++){const g=ctx.createRadialGradient(Math.random()*1024,Math.random()*1024,0,Math.random()*1024,Math.random()*1024,30+Math.random()*50);g.addColorStop(0,'rgba(1,1,0,.5)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,1024,1024)}for(let i=0;i<700;i++){ctx.fillStyle=`rgba(${36+Math.random()*48},${30+Math.random()*38},${26+Math.random()*32},.4)`;ctx.beginPath();ctx.arc(Math.random()*1024,Math.random()*1024,.8+Math.random()*6,0,Math.PI*2);ctx.fill()}for(let i=0;i<50;i++){ctx.strokeStyle='rgba(16,5,1,.22)';ctx.lineWidth=.8+Math.random()*3.8;ctx.beginPath();let x=Math.random()*1024,y=Math.random()*1024;ctx.moveTo(x,y);for(let j=0;j<12;j++){x+=Math.cos(j*.4+Math.random())*32;y+=Math.sin(j*.3+Math.random())*25;ctx.lineTo(x,y)}ctx.stroke()}const tex=new THREE.CanvasTexture(c);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(15,15);tex.colorSpace=THREE.SRGBColorSpace;return tex}
function createBarkTex(){const c=document.createElement('canvas');c.width=256;c.height=512;const ctx=c.getContext('2d');ctx.fillStyle='#110701';ctx.fillRect(0,0,256,512);for(let i=0;i<400;i++){ctx.strokeStyle=`rgba(${9+Math.random()*26},${3+Math.random()*16},${1+Math.random()*8},.52)`;ctx.lineWidth=.7+Math.random()*5;ctx.beginPath();ctx.moveTo(Math.random()*256,Math.random()*512);ctx.lineTo(Math.random()*256,Math.random()*512);ctx.stroke()}for(let i=0;i<60;i++){ctx.strokeStyle='rgba(5,2,0,.42)';ctx.lineWidth=1.5+Math.random()*6;ctx.beginPath();let y=i*8+Math.random()*7;ctx.moveTo(0,y);for(let x=0;x<256;x+=14)ctx.lineTo(x+Math.random()*22,y+Math.random()*14-Math.random()*14);ctx.stroke()}for(let i=0;i<12;i++){ctx.fillStyle='rgba(5,2,0,.55)';ctx.beginPath();ctx.ellipse(30+Math.random()*200,60+Math.random()*380,6+Math.random()*16,3+Math.random()*10,Math.random()*Math.PI,0,Math.PI*2);ctx.fill()}const tex=new THREE.CanvasTexture(c);tex.wrapS=THREE.RepeatWrapping;tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(2,3);tex.colorSpace=THREE.SRGBColorSpace;return tex}
const groundTex=createGroundTex();const barkTex=createBarkTex();

// Terrain
const groundGeo=new THREE.PlaneGeometry(380,380,120,120);const pos=groundGeo.attributes.position;
for(let i=0;i<pos.count;i++){const x=pos.getX(i),y=pos.getY(i),d=Math.sqrt(x*x+y*y);const h=Math.sin(x*.016)*Math.cos(y*.022)*4.5+Math.sin(x*.05+y*.038)*2.2+Math.cos(x*.028)*Math.sin(y*.042)*1.8+Math.sin(x*.085+y*.06)*.8+Math.cos(d*.022)*.7;if(Math.abs(x)<5&&Math.abs(y)<5)pos.setZ(i,Math.max(h,-.1));else pos.setZ(i,h)}
groundGeo.computeVertexNormals();const ground=new THREE.Mesh(groundGeo,new THREE.MeshStandardMaterial({map:groundTex,roughness:.74,metalness:.05,color:'#0b0602'}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;ground.position.y=-.6;scene.add(ground);
const path=new THREE.Mesh(new THREE.PlaneGeometry(4.2,380,3,100),new THREE.MeshStandardMaterial({color:'#120904',roughness:.92,transparent:true,opacity:.35}));path.rotation.x=-Math.PI/2;path.position.y=.05;path.position.z=-75;path.receiveShadow=true;scene.add(path);

// Puddles
const puddles=[];for(let i=0;i<45;i++){const px=(Math.random()-.5)*125,pz=-(Math.random()*.4+.03)*130;if(Math.abs(px)<3&&pz>-5)continue;const pc=document.createElement('canvas');pc.width=64;pc.height=64;const pcx=pc.getContext('2d');pcx.fillStyle='#0a0e18';pcx.fillRect(0,0,64,64);pcx.fillStyle='rgba(25,40,60,.18)';pcx.beginPath();pcx.arc(32,32,28,0,Math.PI*2);pcx.fill();const puddle=new THREE.Mesh(new THREE.CircleGeometry(.18+Math.random()*1.1,14),new THREE.MeshStandardMaterial({map:new THREE.CanvasTexture(pc),roughness:.05,metalness:.92,color:'#1a2a3a',transparent:true,opacity:.55}));puddle.rotation.x=-Math.PI/2;puddle.position.set(px,.03,pz);puddle.receiveShadow=true;scene.add(puddle);puddles.push({mesh:puddle,baseRough:.05})}

// Trees

function spawnParts(pos,color,n=30,spd=5.5,life=60,blood=false){const g=new THREE.Group();for(let i=0;i<n;i++){const size=blood?.035+.22*Math.random():.03+.18*Math.random();const p=new THREE.Mesh(new THREE.SphereGeometry(size,5),new THREE.MeshBasicMaterial({color,transparent:true,opacity:1}));p.position.copy(pos);p.userData={vx:(Math.random()-.5)*spd,vy:Math.random()*spd*.62,vz:(Math.random()-.5)*spd,life,blood};g.add(p)}scene.add(g);let t=0;const iv=setInterval(()=>{t+=16;let alive=false;g.children.forEach(p=>{p.userData.life-=16;p.position.x+=p.userData.vx*.016;p.position.y+=p.userData.vy*.016;p.position.z+=p.userData.vz*.016;p.userData.vy-=4.5*.016;p.material.opacity=Math.max(0,p.userData.life/life);if(p.userData.life>0)alive=true;if(p.userData.blood&&p.position.y<.06&&p.userData.life>life*.18){addBloodDecal(p.position,2);p.userData.life=0}});if(!alive){clearInterval(iv);scene.remove(g);g.children.forEach(c=>{c.material.dispose();c.geometry.dispose()})}},16);return g}

const clock=new THREE.Clock();
function gameLoop(){requestAnimationFrame(gameLoop);const dt=Math.min(clock.getDelta(),.12);frameCount++;
  if(damageFlash>0){damageFlash--;renderer.domElement.style.filter=`brightness(${1+damageFlash*.04})`}else renderer.domElement.style.filter='';
  if(attackCooldown>0)attackCooldown--;
  stars.rotation.y+=dt*.006;godRayPlane.material.opacity=.06+.03*Math.sin(frameCount*.0008);
  rainI+=(targetRain-rainI)*dt*.32;rainSystem.material.opacity=.04+.2*rainI;rainSystem.visible=rainI>.012;if(rainI>.18)wetEl.classList.add('active');else wetEl.classList.remove('active');
  puddles.forEach(p=>{p.mesh.material.roughness=p.baseRough+.05-rainI*.07});
  const rpos=rainSystem.geometry.attributes.position;for(let i=0;i<rainCount;i++){rpos.array[i*3+1]-=20*dt*rainI;if(rpos.array[i*3+1]<-1){rpos.array[i*3+1]=32+Math.random()*8;rpos.array[i*3]=(Math.random()-.5)*120;rpos.array[i*3+2]=-(Math.random()*.7+.05)*160}}rpos.needsUpdate=true;
  thunderTimer-=dt;if(thunderTimer<=0&&rainI>.25&&Math.random()<.003){thunderTimer=5+Math.random()*22;thunderFlash=1.1+Math.random()*.8;sThunder();renderer.toneMappingExposure=1.8;scene.background.setHSL(.65,.08,.06)}
  if(thunderFlash>0){thunderFlash=Math.max(0,thunderFlash-dt*5.5);renderer.toneMappingExposure=.5+thunderFlash*1.6;if(thunderFlash<=0)scene.background.setHSL(.65,.3,.02)}
  const wS=.03+.16*rainI;treeGroup.children.forEach(c=>{if(c.userData&&c.userData.bx!==undefined){c.position.x=c.userData.bx+Math.sin(frameCount*.006+c.userData.so)*wS;c.position.z=c.userData.bz+Math.cos(frameCount*.008+c.userData.so)*wS*.4}});
  grassGroup.children.forEach(c=>{if(c.userData&&c.userData.bx!==undefined){c.position.x=c.userData.bx+Math.sin(frameCount*.009+c.userData.so)*wS*2.2}});
  dustGroup.children.forEach(d=>{d.position.x+=d.userData.vx*dt;d.position.y+=d.userData.vy*dt;d.position.z+=d.userData.vz*dt;d.userData.life--;const dist=camera.position.distanceTo(d.position);d.material.opacity=flashlightOn?Math.max(0,.03+.14*(1-dist/22))*Math.sin(frameCount*.035+d.userData.life*.08):0;if(d.userData.life<=0){d.position.set(camera.position.x+(Math.random()-.5)*38,camera.position.y+.4+Math.random()*5.5,camera.position.z-(Math.random()*.18+.02)*24);d.userData.life=160+Math.random()*160}});

  if(gameState==='playing'){
    if(mouseLocked){euler.set(cameraPitch,cameraYaw,0);camera.quaternion.setFromEuler(euler)}
    velocity.x=0;velocity.z=0;if(keys['w']||touchState.move.y<-.3)velocity.z-=1;if(keys['s']||touchState.move.y>.3)velocity.z+=1;if(keys['a']||touchState.move.x<-.3)velocity.x-=1;if(keys['d']||touchState.move.x>.3)velocity.x+=1;
    direction.set(velocity.x,0,velocity.z).normalize();sprinting=keys['shift'];const speed=sprinting?8.5:4.8;
    if(velocity.length()>0){headBob+=dt*12;const fwd=direction.clone().applyQuaternion(camera.quaternion);fwd.y=0;fwd.normalize();camera.position.x+=fwd.x*speed*dt;camera.position.z+=fwd.z*speed*dt;stepTimer+=dt;if(stepTimer>.42){stepTimer=0;sFootstep()}}
    if(!grounded)velocity.y-=19*dt;const bob=velocity.length()>0?Math.sin(headBob)*.065:0;camera.position.y+=bob;
    if((keys[' ']||touchState.jump)&&grounded){velocity.y=10;grounded=false;sfx(115,'sine',.018,.06)}
    camera.position.y+=velocity.y*dt;const ty=getTerrainHeight(camera.position.x,camera.position.z);
    if(camera.position.y<=ty+1.6){camera.position.y=ty+1.6;velocity.y=0;grounded=true}
    camera.position.x=Math.max(-140,Math.min(140,camera.position.x));camera.position.z=Math.max(-180,Math.min(16,camera.position.z));
    flashLight.intensity=flashlightOn?4:0;flashLight.position.copy(camera.position).add(new THREE.Vector3(0,.5,0));const lookT=new THREE.Vector3();camera.getWorldDirection(lookT);flashTarget.position.copy(camera.position).add(lookT.multiplyScalar(18));
    checkLore();if(Math.random()<.002){sCreak();if(Math.random()<.22&&rainI>.1)sRain_hit()}
    const cz=camera.position.z;
    if(cz<-30&&!catActive&&!catDefeated){catActive=true;catBoss.visible=true;catBoss.position.set(camera.position.x+(Math.random()-.5)*6,getTerrainHeight(camera.position.x,camera.position.z),camera.position.z-15);showDialogue('CARTOON CAT','"Well, well, well... another lost little morsel wanders into MY hunting grounds. You know, I have not eaten in... oh, since 1924. Seven children was a good meal, but one brave wanderer? That is a DELICACY."',()=>{showBossBar(catHP,catMHP,'\uD83D\uDC31 CARTOON CAT');sRoar();sStretch();targetRain=.4;showMsg('\u26A0\uFE0F BOSS FIGHT — Cartoon Cat — Beware the STRETCH attack!',4500)})}
    if(cz<-60&&!sirActive&&!sirDefeated&&catDefeated){sirActive=true;sirenBoss.visible=true;sirenBoss.position.set(camera.position.x+(Math.random()-.5)*8,getTerrainHeight(camera.position.x,camera.position.z),camera.position.z-13);showDialogue('SIREN HEAD','"*DEAFENING RADIO SCREECH* ...Mortal... I was once a man. Hollis Bennett. The frequencies showed me EVERYTHING. Past, present, future — all broadcasting on the same terrible frequency. I became the signal. And now... now YOU will become part of the transmission too."',()=>{showBossBar(sirHP,sirMHP,'\uD83D\uDCE2 SIREN HEAD');sRoar();targetRain=.6;showMsg('\u26A0\uFE0F BOSS FIGHT — Siren Head — At 35% HP... SUPER SAIYAN!',5000)})}
    // Cat AI
    if(catActive&&!catDefeated&&catBoss.visible){bossTimers.cat++;catBoss.lookAt(camera.position);const dist=camera.position.distanceTo(catBoss.position);catBoss.position.y=getTerrainHeight(catBoss.position.x,catBoss.position.z)+Math.sin(frameCount*.026)*.6;
      if(bossTimers.cat>75&&dist<19&&!stretchActive){stretchActive=true;bossTimers.cat=0;const rArm=catBoss.getObjectByName('rArm');if(rArm){rArm.scale.y=6;rArm.position.z=-4.5}const rGlove=catBoss.getObjectByName('rGlove');if(rGlove)rGlove.position.z=-20;sStretch();spawnParts(catBoss.position.clone().add(new THREE.Vector3(0,5,0)),'#ff0',24,6.5,48);setTimeout(()=>{const ra=catBoss.getObjectByName('rArm');if(ra){ra.scale.y=1;ra.position.z=0}const rg=catBoss.getObjectByName('rGlove');if(rg)rg.position.z=-.1;stretchActive=false;if(dist<12)takeDamage(28)},1400)}
      if(bossTimers.cat>115&&!stretchActive){bossTimers.cat=0;const mv=camera.position.clone().sub(catBoss.position).normalize().multiplyScalar(2.4);catBoss.position.add(mv);if(dist<9){takeDamage(24);addBloodDecal(camera.position.clone(),4)}}
      const eyes=catBoss.children.filter(c=>c.name==='eye');eyes.forEach(e=>e.material.color.setHSL(.15,.85,.35+.5*Math.sin(frameCount*.0028)));showBossBar(catHP,catMHP,'\uD83D\uDC31 CARTOON CAT')}
    // Siren AI
    if(sirActive&&!sirDefeated&&sirenBoss.visible){bossTimers.sir++;sirenBoss.lookAt(camera.position);const dist=camera.position.distanceTo(sirenBoss.position);sirenBoss.position.y=getTerrainHeight(sirenBoss.position.x,sirenBoss.position.z);
      if(sirHP<sirMHP*.35&&!sirSSJ){sirSSJ=true;const a=sirenBoss.getObjectByName('ssjAura');if(a)a.intensity=8;const g=sirenBoss.getObjectByName('ssjGlow');if(g)g.material.opacity=.7;const r=sirenBoss.getObjectByName('ssjRing');if(r)r.material.opacity=.75;sSSJ();spawnParts(sirenBoss.position.clone().add(new THREE.Vector3(0,18,0)),'#ffd700',110,13,130,true);showDialogue('SIREN HEAD','"*THE FREQUENCY SURGES* ...YOU THINK YOU CAN DEFEAT ME, MORTAL?! I HAVE SEEN THE BIRTH OF STARS! I HAVE HEARD THE DEATH OF GALAXIES! I AM THE ETERNAL SIGNAL — SUPER SAIYAN!!!"',()=>{showMsg('\u26A1\u26A1 SIREN HEAD TRANSCENDS — SUPER SAIYAN AWAKENED! \u26A1\u26A1',6500);targetRain=.85;thunderTimer=1;thunderFlash=1.8})}
      if(bossTimers.sir>65){bossTimers.sir=0;const rush=camera.position.clone().sub(sirenBoss.position).normalize().multiplyScalar(sirSSJ?4.5:2.2);sirenBoss.position.add(rush);if(dist<10){takeDamage(sirSSJ?46:26);addBloodDecal(camera.position.clone(),5)}if(Math.random()<.5){sfx(22,'sawtooth',.07,.48);spawnParts(sirenBoss.position.clone().add(new THREE.Vector3(0,11,0)),'#ff5500',35,8.5,58,true)}}
      if(sirSSJ){const a=sirenBoss.getObjectByName('ssjAura');if(a)a.intensity=5.5+Math.sin(frameCount*.0035)*2.5;const r=sirenBoss.getObjectByName('ssjRing');if(r){r.rotation.z+=.08;r.material.opacity=.65+.4*Math.sin(frameCount*.005)}const hl=sirenBoss.children.filter(c=>c.name==='hornLight');hl.forEach(h=>h.material.color.setHSL(.15,.95,.35+.55*Math.sin(frameCount*.007)))}
      showBossBar(sirHP,sirMHP,(sirSSJ?'\u26a1':'\uD83D\uDCE2')+' SIREN HEAD',sirSSJ)}
  }

  if(gameState==='ending'){endTimer+=dt;const t=endTimer,orR=19;camera.position.x=Math.sin(t*.22)*orR;camera.position.z=-76+Math.cos(t*.22)*orR;camera.position.y=5.5+Math.sin(t*.12)*4;camera.lookAt(0,4,-76);endingObjects.forEach(o=>{if(o.type==='Group'){o.position.y+=Math.sin(t*2.8+o.position.x)*.9;o.rotation.y+=dt*1.5}});if(t>2&&Math.floor(t*2)%3===0)sDance();if(t>2.5&&Math.floor(t*4)%2===0)spawnParts(new THREE.Vector3(0,3.5,-74),'#ffaa00',14,5.5,50);if(t>16){document.getElementById('overlay').classList.remove('hidden');document.getElementById('overlay').querySelector('h1').textContent='YOU SURVIVED';document.getElementById('overlay').querySelector('.sub').textContent='The Blackwood is FREE';document.getElementById('overlay').querySelector('.blink').textContent='CLICK TO PLAY AGAIN';document.getElementById('overlay').querySelector('.tagline').textContent='1924-2026 | 7 Children Freed | Hollis Released | \uD83C\uDF1F';document.getElementById('overlay').onclick=()=>location.reload()}}
  if(gameState==='gameover'){endTimer+=dt;if(endTimer>8){document.getElementById('overlay').onclick=()=>location.reload()}}

  for(let i=bloodDecals.length-1;i>=0;i--){bloodDecals[i].timer--;if(bloodDecals[i].timer<=0){scene.remove(bloodDecals[i].mesh);bloodDecals.splice(i,1)}}
  mistGroup.children.forEach(m=>{m.position.x+=m.userData.vx*dt;m.position.y+=m.userData.vy*dt;m.position.z+=m.userData.vz*dt;if(m.position.x>75)m.position.x=-75;if(m.position.x<-75)m.position.x=75;if(m.position.y>13)m.position.y=.12;if(m.position.z>5)m.position.z=-160});
  fireflyData.forEach(ff=>{ff.mesh.position.x=ff.bx+Math.sin(frameCount*.005*ff.speed+ff.phase)*4;ff.mesh.position.y=ff.h+Math.sin(frameCount*.009*ff.speed+ff.phase)*3.5;ff.mesh.material.opacity=.12+.7*Math.sin(frameCount*.018*ff.speed+ff.phase)});
  loreStones.forEach(s=>{if(!s.collected){s.stone.material.emissiveIntensity=.55+.55*Math.sin(frameCount*.028);s.glow.material.opacity=.08+.3*Math.sin(frameCount*.038);s.light.intensity=1+.8*Math.sin(frameCount*.048)}});
  document.getElementById('compass-el').style.display=showCompass?'block':'none';if(showCompass)drawCompass();
  renderer.render(scene,camera);
}

document.getElementById('overlay').addEventListener('click',()=>{AC.resume();if(gameState==='title')startGame();else if(gameState==='gameover'||gameState==='ending')location.reload()});
document.addEventListener('click',()=>{AC.resume()},{once:true});
gameLoop();
