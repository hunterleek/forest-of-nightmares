<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Forest of Nightmares — Cinematic 3D Horror Survival Game">
<title>🌲 Forest of Nightmares</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Georgia',serif;cursor:none}
canvas{display:block;position:fixed;top:0;left:0}
#overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.92);transition:opacity .8s;cursor:pointer}
#overlay.hidden{opacity:0;pointer-events:none}
#overlay h1{font-size:clamp(2em,8vw,5em);color:#c0392b;text-shadow:0 0 60px #ff3300,0 0 120px #800000;letter-spacing:4px;margin:0;animation:glow 2s ease-in-out infinite}
#overlay h1.sub{font-size:clamp(1.5em,4vw,2.5em);color:#e67e22;text-shadow:0 0 30px #e67e22;animation:glow2 3s ease-in-out infinite}
@keyframes glow{0%,100%{text-shadow:0 0 40px #ff3300,0 0 80px #800}50%{text-shadow:0 0 80px #ff4400,0 0 140px #a00}}
@keyframes glow2{0%,100%{text-shadow:0 0 20px #e67e22}50%{text-shadow:0 0 50px #f39c12}}
#overlay .tagline{color:#8e6e5e;font-size:1em;margin:12px 0 30px;letter-spacing:2px}
#overlay .blink{color:#d35400;font-size:1.3em;animation:blink 1.8s infinite;margin-top:30px}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
#overlay .controls{color:#5a4a3a;font-size:.8em;margin-top:20px;max-width:500px;text-align:center;line-height:1.8}
#hud{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:10;pointer-events:none;display:none}
#hp-bar{width:280px;height:10px;background:rgba(0,0,0,.7);border:1px solid #333;border-radius:3px;overflow:hidden;margin:0 auto}
#hp-fill{height:100%;background:linear-gradient(90deg,#c0392b 0%,#e74c3c 40%,#f1c40f 70%,#2ecc71 100%);transition:width .3s;width:100%}
#hp-text{color:#aaa;font-size:10px;text-align:center;margin:4px 0}
#boss-bar{width:280px;height:8px;background:rgba(0,0,0,.7);border:1px solid #500;border-radius:2px;overflow:hidden;margin:8px auto 0;display:none}
#boss-fill{height:100%;background:#c0392b;transition:width .3s;width:100%}
#boss-text{color:#c0392b;font-size:9px;text-align:center;margin:2px 0}
#msg{position:fixed;top:15%;left:50%;transform:translateX(-50%);color:#d4a574;font-size:1.1em;text-align:center;pointer-events:none;z-index:10;text-shadow:0 0 10px #000;opacity:0;transition:opacity .5s;max-width:90vw}
#msg.on{opacity:1}
#story{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#d4a574;font-size:1.2em;text-align:center;pointer-events:none;z-index:10;text-shadow:0 0 15px #000;opacity:0;transition:opacity 1s;max-width:80vw;line-height:2;font-style:italic}
#story.on{opacity:1}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.75) 100%)}
#compass{position:fixed;top:20px;right:20px;z-index:10;pointer-events:none}
</style>
</head>
<body>
<div id="vignette"></div>
<div id="overlay">
  <h1>FOREST OF</h1>
  <h1 class="sub">NIGHTMARES</h1>
  <p class="tagline">CINEMATIC HORROR SURVIVAL</p>
  <p class="blink">▶ CLICK TO ENTER THE BLACKWOOD ◀</p>
  <p class="controls">WASD — Move &nbsp;|&nbsp; Mouse — Look &nbsp;|&nbsp; Click — Attack<br>SPACE — Jump &nbsp;|&nbsp; SHIFT — Sprint &nbsp;|&nbsp; E — Interact<br>ESC — Pause &nbsp;|&nbsp; F — Flashlight Toggle</p>
</div>
<div id="hud">
  <div id="hp-bar"><div id="hp-fill"></div></div>
  <div id="hp-text">♥ 100 / 100</div>
  <div id="boss-bar"><div id="boss-fill"></div></div>
  <div id="boss-text"></div>
</div>
<div id="msg"></div>
<div id="story"></div>

<script src="threejs/three.min.js"></script>
<script>

// ═══════════════════════════════════════════
//  FOREST OF NIGHTMARES — ENHANCED EDITION
//  Cinematic 3D Horror Survival
// ═══════════════════════════════════════════

// ─── AUDIO ENGINE ───
const AC = new (window.AudioContext||window.webkitAudioContext)();
const sfx = (f,t,d,v=.08,g=0) => {try{const o=AC.createOscillator(),gn=AC.createGain(),tm=AC.currentTime;o.type=t;o.frequency.setValueAtTime(f,tm);if(g)o.frequency.linearRampToValueAtTime(f+g,tm+d);gn.gain.setValueAtTime(v,tm);gn.gain.exponentialRampToValueAtTime(.001,tm+d);o.connect(gn);gn.connect(AC.destination);o.start(tm);o.stop(tm+d)}catch(e){}};
const sHit = ()=> {sfx(55,'sawtooth',.1,.18);sfx(30,'square',.06,.12)};
const sPower = ()=> {for(let i=0;i<6;i++)setTimeout(()=>sfx(200+i*150,'sine',.05,.04),i*50);sfx(70,'square',.12,.25,50)};
const sStretch = ()=> {sfx(40,'sawtooth',.1,.4,15);sfx(55,'square',.06,.25)};
const sRoar = ()=> {sfx(20,'sawtooth',.18,.55,8);sfx(35,'square',.1,.35);sfx(50,'triangle',.08,.3)};
const sSSJ = ()=> {for(let i=0;i<10;i++)setTimeout(()=>sfx(250+i*120,'sine',.05,.05),i*45);sfx(50,'sawtooth',.15,.35,60)};
const sWin = ()=> {for(let i=0;i<15;i++)setTimeout(()=>sfx(240+i*90,'triangle',.04,.07),i*70)};
const sDance = ()=> {sfx(523,'square',.05,.1);setTimeout(()=>sfx(659,'square',.05,.1),120);setTimeout(()=>sfx(784,'square',.05,.1),240);setTimeout(()=>sfx(1047,'square',.07,.15),360)};
const sAmbient = ()=> {sfx(80+Math.random()*40,'triangle',.05,2);setTimeout(()=>sfx(120+Math.random()*50,'triangle',.04,1.8),500+Math.random()*500)};
let ambLoop; const startAmbient = ()=> {ambLoop=setInterval(sAmbient,3000+Math.random()*2000)};
const sWhisper = ()=> {for(let i=0;i<5;i++)setTimeout(()=>sfx(200+Math.random()*300,'sine',.02,.4),i*200+Math.random()*300)};

// ─── RENDERER ───
const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .65;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2('#020008', .000045);
scene.background = new THREE.Color('#020010');

const camera = new THREE.PerspectiveCamera(80, window.innerWidth/window.innerHeight, .2, 200);
camera.position.set(0, 1.7, 10);
camera.lookAt(0, 1.5, -10);

// ─── LIGHTING ───
scene.add(new THREE.AmbientLight('#1a1030', .2));
const moonLight = new THREE.DirectionalLight('#8899cc', .5);
moonLight.position.set(50, 60, -40);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048,2048);
moonLight.shadow.camera.near = .5; moonLight.shadow.camera.far = 200;
moonLight.shadow.camera.left = -50; moonLight.shadow.camera.right = 50;
moonLight.shadow.camera.top = 50; moonLight.shadow.camera.bottom = -50;
moonLight.shadow.bias = -.00025;
scene.add(moonLight);

const moonGeo = new THREE.SphereGeometry(4, 32, 16);
const moonMat = new THREE.MeshBasicMaterial({color:'#ffe0c8'});
const moon = new THREE.Mesh(moonGeo, moonMat);
moon.position.set(45, 50, -70); scene.add(moon);
const moonGlow = new THREE.PointLight('#ffe0c8', 6, 100);
moonGlow.position.copy(moon.position); scene.add(moonGlow);

// Flashlight
const flashLight = new THREE.SpotLight('#ffe8c0', 2.5, 35, Math.PI/6, .3, 1);
flashLight.position.copy(camera.position);
flashLight.castShadow = true;
flashLight.shadow.mapSize.set(1024,1024);
flashLight.shadow.bias = -.0001;
scene.add(flashLight);
const flashTarget = new THREE.Object3D();
flashTarget.position.set(0,0,-15);
scene.add(flashTarget);
flashLight.target = flashTarget;

// ─── STARS ───
const starsGeo = new THREE.BufferGeometry();
const starsArr = [];
for(let i=0;i<3000;i++) starsArr.push((Math.random()-.5)*300, 25+Math.random()*90, -(Math.random()*.8+.2)*160);
starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(starsArr,3));
const stars = new THREE.Points(starsGeo, new THREE.PointsMaterial({color:'#fff',size:.2,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(stars);

// ─── PROCEDURAL TEXTURES ───
function createGroundTexture() {
  const c = document.createElement('canvas'); c.width=c.height=512;
  const ctx = c.getContext('2d');
  ctx.fillStyle='#1a0f04'; ctx.fillRect(0,0,512,512);
  for(let i=0;i<4000;i++){ctx.fillStyle=`rgba(${15+Math.random()*30},${8+Math.random()*18},${2+Math.random()*8},.6)`;ctx.fillRect(Math.random()*512,Math.random()*512,2+Math.random()*5,2+Math.random()*5)}
  for(let i=0;i<200;i++){ctx.strokeStyle=`rgba(20,${10+Math.random()*12},4,.4)`;ctx.lineWidth=.5+Math.random();ctx.beginPath();ctx.moveTo(Math.random()*512,Math.random()*512);ctx.lineTo(Math.random()*512,Math.random()*512);ctx.stroke()}
  const tex = new THREE.CanvasTexture(c); tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.repeat.set(25,25);
  return tex;
}
const groundTex = createGroundTexture();

// ─── TERRAIN ───
const groundGeo = new THREE.PlaneGeometry(300, 300, 60, 60);
const pos = groundGeo.attributes.position;
for(let i=0;i<pos.count;i++){
  const x=pos.getX(i), y=pos.getY(i);
  const h = Math.sin(x*.03)*Math.cos(y*.04)*2.5 + Math.sin(x*.08+y*.06)*1.2 + Math.cos(y*.05)*Math.sin(x*.06)*.8;
  if(Math.abs(x)<5&&Math.abs(y)<5) pos.setZ(i, Math.max(h, -0.1));
  else pos.setZ(i, h);
}
groundGeo.computeVertexNormals();
const groundMat = new THREE.MeshStandardMaterial({map:groundTex, roughness:.85, metalness:0, color:'#1a0f06'});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; ground.position.y = -0.3;
scene.add(ground);

// Path
const pathGeo = new THREE.PlaneGeometry(3.5, 300, 2, 50);
const pathMat = new THREE.MeshStandardMaterial({color:'#1a1208', roughness:.9, transparent:true, opacity:.5});
const path = new THREE.Mesh(pathGeo, pathMat);
path.rotation.x = -Math.PI/2; path.position.y = .02; path.position.z = -60; path.receiveShadow = true;
scene.add(path);

// ─── ENHANCED TREES ───
const treeGroup = new THREE.Group();
for(let i=0;i<180;i++){
  const tx=(Math.random()-.5)*250, tz=-(Math.random()*.7+.05)*160;
  if(Math.abs(tx)<2.5&&tz>-8&&tz<0) continue;
  const h=2.5+Math.random()*14, variant=Math.floor(Math.random()*3);

  // Trunk
  const trunkGeo = new THREE.CylinderGeometry(.12+Math.random()*.3, .22+Math.random()*.4, h, 10, 6);
  const trunkMat = new THREE.MeshStandardMaterial({color:`rgb(${30+Math.random()*30},${15+Math.random()*18},${6+Math.random()*10})`,roughness:.95});
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.set(tx,h/2,tz); trunk.castShadow=true; trunk.receiveShadow=true;
  treeGroup.add(trunk);

  // Canopy layers
  const layers = 2 + Math.floor(Math.random()*3);
  for(let l=0;l<layers;l++){
    const cy = h*.4 + l*1.8;
    const cr = 1.2 + l*.7 + (Math.random()-.5)*.5;
    if(variant===0){
      const cone = new THREE.Mesh(new THREE.ConeGeometry(cr, 2+Math.random()*2.5, 8, 5), new THREE.MeshStandardMaterial({color:`rgb(${5+Math.random()*10},${10+Math.random()*18},${2+Math.random()*7})`,roughness:.9}));
      cone.position.set(tx,cy,tz); cone.castShadow=true; cone.receiveShadow=true;
      treeGroup.add(cone);
    } else if(variant===1){
      const sphere = new THREE.Mesh(new THREE.SphereGeometry(cr, 7, 5), new THREE.MeshStandardMaterial({color:`rgb(${8+Math.random()*6},${12+Math.random()*14},${3+Math.random()*5})`,roughness:.85}));
      sphere.position.set(tx+(Math.random()-.5)*.5,cy,tz+(Math.random()-.5)*.5); sphere.castShadow=true;
      treeGroup.add(sphere);
    } else {
      for(let s=-1;s<=1;s+=2){
        const ic = new THREE.Mesh(new THREE.IcosahedronGeometry(cr*.6,1), new THREE.MeshStandardMaterial({color:`rgb(${6+Math.random()*8},${8+Math.random()*10},${2+Math.random()*4})`,roughness:.8}));
        ic.position.set(tx+s*(.8+l*.3),cy+(Math.random()-.5)*.8,tz+(Math.random()-.5)*.8); ic.castShadow=true;
        treeGroup.add(ic);
      }
    }
  }
  // Dead branches
  if(Math.random()<.35){
    const brGeo = new THREE.CylinderGeometry(.04,.07,1+Math.random()*2.5, 5);
    const br = new THREE.Mesh(brGeo, new THREE.MeshStandardMaterial({color:'#3a2010',roughness:.9}));
    br.position.set(tx+(Math.random()-.5)*1,h*.6,tz);
    br.rotation.z=(Math.random()-.5)*1.5; br.rotation.x=(Math.random()-.5)*.8; br.castShadow=true;
    treeGroup.add(br);
  }
}
scene.add(treeGroup);

// ─── ROCKS & BOULDERS ───
for(let i=0;i<80;i++){
  const rx=(Math.random()-.5)*220, rz=-(Math.random()*.6+.1)*150;
  const s=.15+Math.random()*2;
  const rockGeo = new THREE.IcosahedronGeometry(s, Math.floor(Math.random()*2)+1);
  const rock = new THREE.Mesh(rockGeo, new THREE.MeshStandardMaterial({color:`rgb(${35+Math.random()*45},${28+Math.random()*35},${22+Math.random()*30})`,roughness:.7}));
  rock.position.set(rx,s*.3,rz);
  rock.rotation.set(Math.random()*Math.PI,Math.random()*Math.PI,Math.random()*Math.PI);
  rock.castShadow=true; rock.receiveShadow=true;
  scene.add(rock);
}

// ─── GRASS PATCHES ───
const grassGroup = new THREE.Group();
for(let i=0;i<400;i++){
  const gx=(Math.random()-.5)*100, gz=-(Math.random()*.5+.02)*120;
  if(Math.abs(gx)<2.5&&gz>-6) continue;
  const bladeCount = 3+Math.floor(Math.random()*5);
  for(let b=0;b<bladeCount;b++){
    const h=.2+Math.random()*.6;
    const blade = new THREE.Mesh(new THREE.ConeGeometry(.03,.02,h,4,1), new THREE.MeshStandardMaterial({color:`rgb(${10+Math.random()*15},${25+Math.random()*35},${5+Math.random()*8})`,roughness:.8}));
    blade.position.set(gx+(Math.random()-.5)*.4,h/2,gz+(Math.random()-.5)*.4);
    blade.rotation.z=(Math.random()-.5)*.3; blade.rotation.x=(Math.random()-.5)*.3;
    grassGroup.add(blade);
  }
}
scene.add(grassGroup);

// ─── MUSHROOMS & DETAILS ───
for(let i=0;i<50;i++){
  const mx=(Math.random()-.5)*80, mz=-(Math.random()*.5+.05)*100;
  if(Math.abs(mx)<2.5&&mz>-5) continue;
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(.03,.04,.15+Math.random()*.25,6), new THREE.MeshStandardMaterial({color:'#e8dcc8',roughness:.7}));
  stem.position.set(mx,.1,mz);
  const cap = new THREE.Mesh(new THREE.SphereGeometry(.08+Math.random()*.1,.6,.1,8,4), new THREE.MeshStandardMaterial({color:`rgb(${100+Math.random()*60},${30+Math.random()*20},${20+Math.random()*20})`,roughness:.5}));
  cap.position.copy(stem.position); cap.position.y+=.12;
  grassGroup.add(stem); grassGroup.add(cap);
}

// ─── VOLUMETRIC MIST ───
const mistGroup = new THREE.Group();
for(let i=0;i<40;i++){
  const w=4+Math.random()*12, h=2+Math.random()*6;
  const mist = new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({color:'#151520',transparent:true,opacity:.04+Math.random()*.06,depthWrite:false,side:THREE.DoubleSide}));
  mist.position.set((Math.random()-.5)*100, .5+Math.random()*7, -(Math.random()*.6+.1)*120);
  mist.userData = {vx:(Math.random()-.5)*.4, vy:.03+Math.random()*.06, vz:(Math.random()-.5)*.25, rot:Math.random()*Math.PI};
  mist.rotation.y = mist.userData.rot;
  mistGroup.add(mist);
}
scene.add(mistGroup);

// ─── FIREFLIES ───
const firefliesGroup = new THREE.Group();
const fireflyData = [];
for(let i=0;i<80;i++){
  const geo = new THREE.SphereGeometry(.04,4,4);
  const mat = new THREE.MeshBasicMaterial({color:'#ffff88', transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false});
  const ff = new THREE.Mesh(geo, mat);
  const bx=(Math.random()-.5)*60, bz=-(Math.random()*.4+.05)*80;
  ff.position.set(bx, .3+Math.random()*5, bz);
  fireflyData.push({mesh:ff, bx, bz, phase:Math.random()*Math.PI*2, speed:.5+Math.random()*2, height:.3+Math.random()*5});
  firefliesGroup.add(ff);
}
scene.add(firefliesGroup);

// ─── LORE PORTALS (glowing stones) ───
const loreStones = [];
for(let i=0;i<3;i++){
  const stone = new THREE.Mesh(new THREE.IcosahedronGeometry(.25,.25,0), new THREE.MeshBasicMaterial({color:'#4488ff',transparent:true,opacity:.7,blending:THREE.AdditiveBlending}));
  stone.position.set(-30+i*30, .8, -30-i*25);
  const glow = new THREE.PointLight('#4488ff', .8, 8);
  glow.position.copy(stone.position); glow.position.y += .3;
  scene.add(stone); scene.add(glow);
  loreStones.push({stone, glow, collected:false});
}

// ─── BOSS CREATION ───
function createCartoonCat(){
  const g = new THREE.Group();
  // Body
  const body = new THREE.Mesh(new THREE.SphereGeometry(2.5,2,1.6,16,12), new THREE.MeshStandardMaterial({color:'#1a1a1a',roughness:.45,metalness:.1}));
  body.scale.set(1,1.15,1); body.position.y=1.6; body.castShadow=true; g.add(body);
  body.name='body';
  // Ears
  for(let s=-1;s<=1;s+=2){
    const ear = new THREE.Mesh(new THREE.ConeGeometry(.7,2.2,8), new THREE.MeshStandardMaterial({color:'#1a1a1a',roughness:.4}));
    ear.position.set(s*1.4,3.8,0); ear.rotation.z=s*.35; ear.castShadow=true; g.add(ear);
    const ie = new THREE.Mesh(new THREE.ConeGeometry(.4,1.4,8), new THREE.MeshStandardMaterial({color:'#2a1010',roughness:.4}));
    ie.position.set(s*1.4,3.5,0); ie.rotation.z=s*.35; g.add(ie);
  }
  // Eyes
  for(let s=-1;s<=1;s+=2){
    const eye = new THREE.Mesh(new THREE.SphereGeometry(.5,16,8), new THREE.MeshBasicMaterial({color:'#ffff00'}));
    eye.position.set(s*.95,3,-1.8); eye.name='eye'; g.add(eye);
    const pup = new THREE.Mesh(new THREE.SphereGeometry(.18,8,8), new THREE.MeshBasicMaterial({color:'#000'}));
    pup.position.set(s*.95,3,-2.1); pup.name='pupil'; g.add(pup);
  }
  // Grin
  const grinGeo = new THREE.TorusGeometry(1.2,.12,8,12,Math.PI);
  const grin = new THREE.Mesh(grinGeo, new THREE.MeshBasicMaterial({color:'#fff'}));
  grin.position.set(0,1.5,-2); grin.rotation.x=Math.PI; g.add(grin);
  // Teeth
  for(let i=-6;i<=6;i+=2){
    const tooth = new THREE.Mesh(new THREE.BoxGeometry(.12,.5,.12), new THREE.MeshStandardMaterial({color:'#fff',roughness:.2}));
    tooth.position.set(i*.35,1.2,-2.2); g.add(tooth);
  }
  // Arms
  for(let s=-1;s<=1;s+=2){
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(.3,.34,3.8,8), new THREE.MeshStandardMaterial({color:'#1a1a1a',roughness:.45}));
    arm.position.set(s*2.8,1.8,0); arm.name=s>0?'rArm':'lArm'; arm.castShadow=true; g.add(arm);
    const paw = new THREE.Mesh(new THREE.SphereGeometry(.5,8,8), new THREE.MeshStandardMaterial({color:'#222',roughness:.35}));
    paw.position.set(s*3.5,.2,0); paw.name=s>0?'rPaw':'lPaw'; g.add(paw);
  }
  // Whiskers
  for(let s=-1;s<=1;s+=2){
    for(let j=-1;j<=1;j++){
      const w = new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,1.6,4), new THREE.MeshBasicMaterial({color:'#333'}));
      w.position.set(s*1.2,2.3,j*.8-1.8); w.rotation.z=Math.PI/2; w.rotation.y=j*.3; g.add(w);
    }
  }
  // Tail
  const tailPoints = [new THREE.Vector3(0,.5,.8),new THREE.Vector3(-2.5,.3,1.2),new THREE.Vector3(-4,-.3,.5),new THREE.Vector3(-3.5,-1.2,.3)];
  const tailCurve = new THREE.CatmullRomCurve3(tailPoints);
  const tailGeo = new THREE.TubeGeometry(tailCurve,16,.15,8,false);
  const tail = new THREE.Mesh(tailGeo, new THREE.MeshStandardMaterial({color:'#1a1a1a',roughness:.45}));
  tail.rotation.x=-.3; g.add(tail);
  g.visible=false; g.position.set(0,0,-45);
  scene.add(g); return g;
}

function createSirenHead(){
  const g = new THREE.Group();
  // Legs
  for(let s=-1;s<=1;s+=2){
    const leg = new THREE.Mesh(new THREE.BoxGeometry(.4,9,.4), new THREE.MeshStandardMaterial({color:'#3a2515',roughness:.8}));
    leg.position.set(s*.5,-.5,0); leg.castShadow=true; g.add(leg);
  }
  // Body
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.5,10,1.3), new THREE.MeshStandardMaterial({color:'#4a3520',roughness:.7,metalness:.05}));
  body.position.y=5; body.castShadow=true; g.add(body);

// ─── PARTICLE SYSTEM ───
function spawnParticles(pos, color, n=25, spd=4, life=55){
  const g = new THREE.Group();
  for(let i=0;i<n;i++){
    const p = new THREE.Mesh(new THREE.SphereGeometry(.06+.1*Math.random(),4), new THREE.MeshBasicMaterial({color,transparent:true,opacity:1}));
    p.position.copy(pos);
    p.userData = {vx:(Math.random()-.5)*spd, vy:Math.random()*spd*.7, vz:(Math.random()-.5)*spd, life};
    g.add(p);
  }
  scene.add(g);
  let t=0;
  const iv = setInterval(()=>{
    t+=16; let alive=false;
    g.children.forEach(p=>{p.userData.life-=16; p.position.x+=p.userData.vx*.016; p.position.y+=p.userData.vy*.016; p.position.z+=p.userData.vz*.016; p.userData.vy-=2*.016; p.material.opacity=Math.max(0,p.userData.life/life); if(p.userData.life>0)alive=true});
    if(!alive){clearInterval(iv);scene.remove(g);g.children.forEach(c=>{c.material.dispose();c.geometry.dispose()})}
  },16);
  return g;
}

// ─── MELEE ATTACK ───
const raycaster = new THREE.Raycaster(); raycaster.far = 8;
function meleeAttack(){
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  raycaster.set(camera.position, dir);
  const targets = [];
  if(catBoss.visible&&!catDefeated) targets.push(...catBoss.children);
  if(sirenBoss.visible&&!sirDefeated) targets.push(...sirenBoss.children);
  const hits = raycaster.intersectObjects(targets, true);
  if(hits.length>0){
    const point = hits[0].point;
    spawnParticles(point, '#ff5533', 20, 4, 40);
    let hitCat=false, hitSir=false;
    let obj = hits[0].object;
    while(obj){if(obj===catBoss){hitCat=true;break}if(obj===sirenBoss){hitSir=true;break}obj=obj.parent}
    if(hitCat&&!catDefeated){
      catHP -= 20;
      sHit();
      if(catHP<=0){catHP=0;catDefeated=true;catBoss.visible=false;showMsg('💀 CARTOON CAT DEFEATED! The forest trembles...',4000);spawnParticles(catBoss.position.clone().add(new THREE.Vector3(0,2,0)),'#ff4400',70,8,80);sPower();hp=Math.min(100,hp+40);refreshHUD();document.getElementById('boss-bar').style.display='none'}
    }
    if(hitSir&&!sirDefeated){
      sirHP -= 18;
      sHit();
      if(sirHP<=0){sirHP=0;sirDefeated=true;sirenBoss.visible=false;gameState='ending';document.exitPointerLock();showMsg('🏆 SIREN HEAD VANQUISHED! The Blackwood is free...',5000);spawnParticles(sirenBoss.position.clone().add(new THREE.Vector3(0,8,0)),'#ffd700',90,10,100);sPower();sWin();setTimeout(()=>startEnding(),2000)}
    }
  }
}

function takeDamage(amt){
  if(damageFlash>0) return;
  hp -= amt; damageFlash = 15;
  spawnParticles(camera.position.clone(), '#ff0000', 8, 3, 25);
  sHit(); refreshHUD();
  if(hp<=0){hp=0;gameState='gameover';document.exitPointerLock();showMsg('💀 YOU HAVE PERISHED... The Blackwood claims another soul.',5000);

}

// ─── GAME LOOP ───
const clock = new THREE.Clock();
let frameCount = 0;

function gameLoop(){
  requestAnimationFrame(gameLoop);
  const dt = Math.min(clock.getDelta(), .12);
  frameCount++;

  // Damage flash
  if(damageFlash>0){damageFlash--;renderer.domElement.style.filter=`brightness(${1+damageFlash*.02})`}else renderer.domElement.style.filter='';
  if(attackCooldown>0) attackCooldown--;

  // Stars twinkle
  stars.rotation.y += dt*.012;
  stars.material.opacity = .7+.15*Math.sin(frameCount*.003);

  // Dynamic fog
  scene.fog.density = .00004 + .000018*Math.sin(frameCount*.00025);

  if(gameState==='playing'){
    // Mouse look
    if(mouseLocked){euler.set(cameraPitch,cameraYaw,0);camera.quaternion.setFromEuler(euler)}
    // Movement
    velocity.x=0; velocity.z=0;
    if(keys['w']) velocity.z -= 1;
    if(keys['s']) velocity.z += 1;
    if(keys['a']) velocity.x -= 1;
    if(keys['d']) velocity.x += 1;
    direction.set(velocity.x,0,velocity.z).normalize();
    sprinting = keys['shift'];
    const speed = sprinting ? 7.5 : 4;
    if(velocity.length()>0){
      headBob += dt*12;
      const forward = direction.clone().applyQuaternion(camera.quaternion);
      forward.y=0; forward.normalize();
      camera.position.x += forward.x*speed*dt;
      camera.position.z += forward.z*speed*dt;
    }
    if(!grounded) velocity.y -= 15*dt;
    // Head bob
    const bob = velocity.length()>0 ? Math.sin(headBob)*.04 : 0;
    camera.position.y += bob;
    // Jump
    if(keys[' ']&&grounded){velocity.y=8;grounded=false;sfx(130,'sine',.03,.05)}
    camera.position.y += velocity.y*dt;
    // Ground collision
    const terrainY = getTerrainHeight(camera.position.x, camera.position.z);
    if(camera.position.y <= terrainY+1.6){camera.position.y = terrainY+1.6; velocity.y=0; grounded=true}
    // Clamp boundaries
    camera.position.x = Math.max(-110, Math.min(110, camera.position.x));
    camera.position.z = Math.max(-140, Math.min(10, camera.position.z));

    // Flashlight
    flashLight.intensity = flashlightOn ? 2.5 : 0;
    flashLight.position.copy(camera.position);
    flashLight.position.y += .5;
    const lookTarget = new THREE.Vector3();
    camera.getWorldDirection(lookTarget);
    flashTarget.position.copy(camera.position).add(lookTarget.multiplyScalar(14));

    // Lore collection
    checkLoreCollection();

    const cz = camera.position.z;

    // Trigger Cartoon Cat
    if(cz<-30&&!catActive&&!catDefeated){
      catActive=true; catBoss.visible=true;
      catBoss.position.set(camera.position.x+(Math.random()-.5)*6,getTerrainHeight(camera.position.x,camera.position.z),camera.position.z-12);
      showMsg('🐱 CARTOON CAT: "Well, well... a lost human in MY domain. You smell delicious..."',4000);
      showBossBar(catHP,catMHP,'🐱 CARTOON CAT'); sRoar(); sStretch();
    }

    // Trigger Siren Head
    if(cz<-60&&!sirActive&&!sirDefeated&&catDefeated){
      sirActive=true; sirenBoss.visible=true;
      sirenBoss.position.set(camera.position.x+(Math.random()-.5)*8,getTerrainHeight(camera.position.x,camera.position.z),camera.position.z-10);
      showMsg('📢 SIREN HEAD: *DEAFENING SCREECH* ...Mortal... I sense great power in you...',4500);
      showBossBar(sirHP,sirMHP,'📢 SIREN HEAD'); sRoar();
    }

    // Update Cat Boss
    if(catActive&&!catDefeated&&catBoss.visible){
      bossTimers.cat++;
      catBoss.lookAt(camera.position);
      const dist = camera.position.distanceTo(catBoss.position);
      // Bob
      catBoss.position.y = getTerrainHeight(catBoss.position.x, catBoss.position.z) + Math.sin(frameCount*.04)*.3;
      // Stretch attack
      if(bossTimers.cat>100&&dist<15&&!stretchActive){
        stretchActive=true; bossTimers.cat=0;
        const rArm = catBoss.getObjectByName('rArm'); if(rArm){rArm.scale.y=4;rArm.position.z=-2.5}
        const rPaw = catBoss.getObjectByName('rPaw'); if(rPaw) rPaw.position.z=-12;
        sStretch(); spawnParticles(rPaw?rPaw.position:catBoss.position,'#ff0',15,3,30);
        setTimeout(()=>{
          const ra=catBoss.getObjectByName('rArm');if(ra){ra.scale.y=1;ra.position.z=0}
          const rp=catBoss.getObjectByName('rPaw');if(rp)rp.position.z=0;
          stretchActive=false; if(dist<8) takeDamage(20);
        },1000);
      }
      // Lunge
      if(bossTimers.cat>140&&!stretchActive){
        bossTimers.cat=0;
        const move = camera.position.clone().sub(catBoss.position).normalize().multiplyScalar(1.5);
        catBoss.position.add(move); if(dist<5) takeDamage(15);
      }
      // Eye glow pulse
      const eyes = catBoss.children.filter(c=>c.name==='eye');
      eyes.forEach(e=>e.material.color.setHSL(.15,.8,.5+.35*Math.sin(frameCount*.005)));
      showBossBar(catHP,catMHP,'🐱 CARTOON CAT');
    }

    // Update Siren Head
    if(sirActive&&!sirDefeated&&sirenBoss.visible){
      bossTimers.sir++;
      sirenBoss.lookAt(camera.position);
      const dist = camera.position.distanceTo(sirenBoss.position);
      sirenBoss.position.y = getTerrainHeight(sirenBoss.position.x, sirenBoss.position.z);

      // SSJ trigger at 35% HP
      if(sirHP<sirMHP*.35&&!sirSSJ){
        sirSSJ=true;
        const aura=sirenBoss.getObjectByName('ssjAura');if(aura)aura.intensity=4;
        const glow=sirenBoss.getObjectByName('ssjGlow');if(glow)glow.material.opacity=.5;
        const ring=sirenBoss.getObjectByName('ssjRing');if(ring)ring.material.opacity=.55;
        sSSJ();spawnParticles(sirenBoss.position.clone().add(new THREE.Vector3(0,14,0)),'#ffd700',70,7,90);
        showMsg('⚡⚡ SIREN HEAD UNLEASHES SUPER SAIYAN POWER!!! ⚡⚡',5000);
      }
      // Rush
      if(bossTimers.sir>85){
        bossTimers.sir=0;
        const rush = camera.position.clone().sub(sirenBoss.position).normalize().multiplyScalar(sirSSJ?2.5:1.2);
        sirenBoss.position.add(rush);
        if(dist<6) takeDamage(sirSSJ?30:18);
        if(Math.random()<.4){sfx(28,'sawtooth',.12,.4);spawnParticles(sirenBoss.position.clone().add(new THREE.Vector3(0,7,0)),'#ff5500',20,5,40)}
      }
      // SSJ effects
      if(sirSSJ){
        const aura=sirenBoss.getObjectByName('ssjAura');if(aura)aura.intensity=3.5+Math.sin(frameCount*.007)*1.2;
        const ring=sirenBoss.getObjectByName('ssjRing');if(ring){ring.rotation.z+=.04;ring.material.opacity=.45+.2*Math.sin(frameCount*.009)}
        const hornLights=sirenBoss.children.filter(c=>c.name==='hornLight');
        hornLights.forEach(h=>h.material.color.setHSL(.15,.9,.5+.4*Math.sin(frameCount*.012)));
      }
      showBossBar(sirHP,sirMHP,(sirSSJ?'⚡':'📢')+' SIREN HEAD', sirSSJ);
    }
  }

  // Ending cinematic
  if(gameState==='ending'){
    endTimer += dt;
    const t = endTimer;
    const orbR = 16;
    camera.position.x = Math.sin(t*.3)*orbR;
    camera.position.z = -70 + Math.cos(t*.3)*orbR;
    camera.position.y = 4 + Math.sin(t*.2)*2;
    camera.lookAt(0,2.5,-70);
    endingObjects.forEach(obj=>{
      if(obj.type==='Group'){
        obj.position.y+=Math.sin(t*4+obj.position.x)*.5;
        obj.rotation.y+=dt;
      }
    });
    if(t>2&&Math.floor(t*2)%2===0) sDance();
    if(t>3) showMsg('🕺 BENDY HITS THE GRIDDY! 🦀 MR KRABS: "I LOVE MONEY!" 🔥',4000);
    if(t>12){
      document.getElementById('overlay').classList.remove('hidden');
      document.getElementById('overlay').querySelector('h1').textContent='YOU SURVIVED';
      document.getElementById('overlay').querySelector('.sub').textContent='The Blackwood is FREE';
      document.getElementById('overlay').querySelector('.blink').textContent='CLICK TO PLAY AGAIN';
      document.getElementById('overlay').querySelector('.tagline').textContent='Bendy Griddy ✅  Cuphead Censored ✅  Mr. Krabs Fried ✅';
      document.getElementById('overlay').onclick = ()=>location.reload();
    }
  }

  // Game over restart
  if(gameState==='gameover'){
    endTimer+=dt;
    if(endTimer>4){
      document.getElementById('overlay').onclick = ()=>location.reload();
    }
  }

  // Mist animation
  mistGroup.children.forEach(m=>{
    m.position.x += m.userData.vx*dt;
    m.position.y += m.userData.vy*dt;
    m.position.z += m.userData.vz*dt;
    if(m.position.x>50) m.position.x=-50; if(m.position.x<-50) m.position.x=50;
    if(m.position.y>9) m.position.y=.3; if(m.position.z>5) m.position.z=-120;
  });

  // Fireflies
  fireflyData.forEach(ff=>{
    ff.mesh.position.x = ff.bx + Math.sin(frameCount*.01*ff.speed+ff.phase)*2;
    ff.mesh.position.y = ff.height + Math.sin(frameCount*.015*ff.speed+ff.phase)*1.5;
    ff.mesh.material.opacity = .3 + .5*Math.sin(frameCount*.03*ff.speed+ff.phase);
  });

  // Lore stone glow
  loreStones.forEach(s=>{
    if(!s.collected){
      s.stone.material.opacity = .5+.3*Math.sin(frameCount*.04);
      s.glow.intensity = .6+.4*Math.sin(frameCount*.05);
    }
  });

  renderer.render(scene, camera);
}

// ─── TERRAIN HEIGHT HELPER ───
function getTerrainHeight(x, z){
  const h = Math.sin(x*.03)*Math.cos(z*.04)*2.5 + Math.sin(x*.08+z*.06)*1.2 + Math.cos(z*.05)*Math.sin(x*.06)*.8 - 0.3;
  return h;
}

// ─── LAUNCH ───
document.getElementById('overlay').addEventListener('click', ()=>{
  if(gameState==='title') startGame();
  else if(gameState==='gameover'||gameState==='ending') location.reload();
});

// Ambient sound on first interaction
document.addEventListener('click', ()=>{AC.resume();if(gameState==='title'){startAmbient()}}, {once:true});

gameLoop();
