<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="description" content="Forest of Nightmares — GTA 5 Realism Horror Survival">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon-512.png">
<title>🌲 Forest of Nightmares</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Georgia',serif;cursor:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;top:0;left:0}
#blood{position:fixed;inset:0;pointer-events:none;z-index:8;opacity:0;transition:opacity .15s;mix-blend-mode:multiply}
#blood.splat{opacity:1;transition:opacity 0s;background:radial-gradient(ellipse at 35% 45%,rgba(180,0,0,.35) 0%,rgba(120,0,0,.25) 30%,rgba(60,0,0,.15) 55%,transparent 70%),radial-gradient(ellipse at 65% 40%,rgba(200,0,0,.2) 0%,transparent 50%),radial-gradient(ellipse at 50% 65%,rgba(140,0,0,.3) 0%,transparent 45%)}
#grain{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:.04;mix-blend-mode:overlay;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:160px;animation:grain .12s steps(4) infinite}
@keyframes grain{0%,100%{transform:translate(0,0)}25%{transform:translate(-1%,-1%)}50%{transform:translate(1%,-2%)}75%{transform:translate(-2%,1%)}}
#motion{position:fixed;inset:0;pointer-events:none;z-index:7;opacity:0;background:transparent;transition:opacity .3s}
#motion.active{opacity:.12;backdrop-filter:blur(2px)}
#lens{position:fixed;inset:0;pointer-events:none;z-index:9;opacity:.03;background:radial-gradient(ellipse at 30% 25%,rgba(255,200,150,.8) 0%,transparent 35%),radial-gradient(ellipse at 75% 70%,rgba(200,220,255,.4) 0%,transparent 30%),radial-gradient(circle at 50% 50%,rgba(0,0,0,1) 0%,transparent 30%)}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.85) 100%)}
#map{position:fixed;bottom:20px;right:20px;z-index:10;pointer-events:none;width:120px;height:120px;border:2px solid rgba(255,255,255,.15);border-radius:8px;background:rgba(0,0,0,.6);display:none}
#overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse at center,#0a0000 0%,#000 100%);transition:opacity .8s;cursor:pointer}
#overlay.hidden{opacity:0;pointer-events:none}
#overlay h1{font-size:clamp(2em,8vw,5em);color:#8b0000;text-shadow:0 0 80px #ff0000,0 0 160px #8b0000,0 0 30px #ff6600;letter-spacing:6px;margin:0;animation:titleGlow 2s ease-in-out infinite;font-family:'Times New Roman',serif}
#overlay h1.sub{font-size:clamp(1.5em,4vw,2.5em);color:#a0522d;text-shadow:0 0 40px #cd853f,0 0 80px #8b4513;animation:glow2 3s ease-in-out infinite}
@keyframes titleGlow{0%,100%{text-shadow:0 0 60px #ff0000,0 0 120px #8b0000}50%{text-shadow:0 0 140px #ff3300,0 0 240px #990000}}
@keyframes glow2{0%,100%{text-shadow:0 0 30px #cd853f}50%{text-shadow:0 0 80px #8b4513}}
#overlay .tagline{color:#654321;font-size:1em;margin:12px 0 30px;letter-spacing:3px}
#overlay .blink{color:#8b0000;font-size:1.3em;animation:blink 1.8s infinite;margin-top:30px;font-weight:bold}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
#overlay .controls{color:#3a2a1a;font-size:.75em;margin-top:20px;max-width:550px;text-align:center;line-height:2}
#hud{position:fixed;bottom:50px;left:50%;transform:translateX(-50%);z-index:10;pointer-events:none;display:none}
#hp-bar{width:300px;height:12px;background:rgba(0,0,0,.85);border:1px solid #222;border-radius:4px;overflow:hidden;margin:0 auto;box-shadow:0 0 15px rgba(0,0,0,.6)}
#hp-fill{height:100%;background:linear-gradient(90deg,#8b0000 0%,#dc143c 35%,#ff6347 60%,#ff4500 100%);transition:width .3s;width:100%;box-shadow:inset 0 1px 3px rgba(255,150,100,.3)}
#hp-text{color:#bbb;font-size:10px;text-align:center;margin:6px 0;text-shadow:0 0 6px #000;font-family:'Courier New',monospace;letter-spacing:1px}
#boss-bar{width:300px;height:10px;background:rgba(0,0,0,.85);border:1px solid #400;border-radius:3px;overflow:hidden;margin:12px auto 0;display:none;box-shadow:0 0 20px rgba(255,0,0,.2)}
#boss-fill{height:100%;background:linear-gradient(90deg,#8b0000,#ff0000);transition:width .3s;width:100%}
#boss-text{color:#ff4444;font-size:9px;text-align:center;margin:4px 0;text-shadow:0 0 8px #f00;font-family:'Courier New',monospace}
#msg{position:fixed;top:10%;left:50%;transform:translateX(-50%);color:#cd853f;font-size:1.1em;text-align:center;pointer-events:none;z-index:10;text-shadow:0 0 20px #000,0 0 8px #000;opacity:0;transition:opacity .6s;max-width:90vw;font-style:italic;letter-spacing:.5px}
#msg.on{opacity:1}
#story{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);color:#d2b48c;font-size:1.15em;text-align:center;pointer-events:none;z-index:10;text-shadow:0 0 25px #000,0 0 12px #000;opacity:0;transition:opacity 1s;max-width:85vw;line-height:2.4;font-style:italic;letter-spacing:1px}
#story.on{opacity:1}
</style>
</head>
<body>
<div id="blood"></div>
<div id="grain"></div>
<div id="motion"></div>
<div id="lens"></div>
<div id="vignette"></div>
<div id="overlay">
  <h1>FOREST OF</h1>
  <h1 class="sub">NIGHTMARES</h1>
  <p class="tagline">GTA V REALISM — HORROR SURVIVAL</p>
  <p class="blink">▶ CLICK TO ENTER THE BLACKWOOD ◀</p>
  <p class="controls">WASD Move · Mouse Look · Click Attack · SPACE Jump<br>SHIFT Sprint · F Flashlight · R Reload · M Map · ESC Pause</p>
</div>
<div id="map"><canvas id="map-canvas" width="120" height="120"></canvas></div>
<div id="hud">
  <div id="hp-bar"><div id="hp-fill"></div></div>
  <div id="hp-text">♥ 100 / 100</div>
  <div id="boss-bar"><div id="boss-fill"></div></div>
  <div id="boss-text"></div>
</div>
<div id="msg"></div>
<div id="story"></div>

<script src="threejs/three.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════
//  FOREST OF NIGHTMARES — GTA V REALISM EDITION
//  Atmospheric Scattering · SSAO · Reflection Probes · PBR · Lens
// ═══════════════════════════════════════════════════════════════

const AC = new (window.AudioContext||window.webkitAudioContext)();
const sfx=(f,t,d,v=.08,g=0)=>{try{const o=AC.createOscillator(),gn=AC.createGain(),tm=AC.currentTime;o.type=t;o.frequency.setValueAtTime(f,tm);if(g)o.frequency.linearRampToValueAtTime(f+g,tm+d);gn.gain.setValueAtTime(v,tm);gn.gain.exponentialRampToValueAtTime(.001,tm+d);o.connect(gn);gn.connect(AC.destination);o.start(tm);o.stop(tm+d)}catch(e){}};
const sHit=()=>{sfx(50,'sawtooth',.08,.18);sfx(28,'square',.05,.12);sfx(85,'triangle',.03,.1)};
const sPower=()=>{for(let i=0;i<8;i++)setTimeout(()=>sfx(200+i*180,'sine',.04,.04),i*50);sfx(70,'square',.1,.25,50)};
const sStretch=()=>{sfx(38,'sawtooth',.1,.4,15);sfx(55,'square',.05,.25)};
const sRoar=()=>{sfx(18,'sawtooth',.15,.55,8);sfx(32,'square',.08,.35);sfx(48,'triangle',.06,.3)};
const sSSJ=()=>{for(let i=0;i<12;i++)setTimeout(()=>sfx(250+i*130,'sine',.04,.05),i*40);sfx(50,'sawtooth',.12,.35,60);sfx(80,'square',.08,.25)};
const sWin=()=>{for(let i=0;i<16;i++)setTimeout(()=>sfx(240+i*90,'triangle',.03,.07),i*65)};
const sDance=()=>{sfx(523,'square',.04,.1);setTimeout(()=>sfx(659,'square',.04,.1),120);setTimeout(()=>sfx(784,'square',.04,.1),240);setTimeout(()=>sfx(1047,'square',.06,.15),360)};
const sAmbient=()=>{sfx(70+Math.random()*40,'triangle',.03,2.8);setTimeout(()=>sfx(110+Math.random()*50,'triangle',.02,2.2),700+Math.random()*700);setTimeout(()=>sfx(35+Math.random()*25,'sawtooth',.015,3.5),1500+Math.random()*1000)};
const sSplat=()=>{for(let i=0;i<4;i++)sfx(25+Math.random()*35,'square',.03,.15)};
const sCreak=()=>{sfx(35+Math.random()*30,'sawtooth',.02,.9,5);setTimeout(()=>sfx(45+Math.random()*40,'sawtooth',.015,.7,8),300)};
const sThunder=()=>{sfx(12,'sawtooth',.2,1.8,3);sfx(22,'square',.12,1.2);setTimeout(()=>sfx(30,'sawtooth',.08,.9),200)};
let ambLoop;const startAmbient=()=>{ambLoop=setInterval(sAmbient,2500+Math.random()*2000)};

// ─── RENDERER (GTA V quality) ───
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance',alpha:false,stencil:false,depth:true,preserveDrawingBuffer:false});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.55;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
// GTA V atmospheric fog — bluish at distance
scene.fog=new THREE.Fog('#010615',40,180);
scene.background=new THREE.Color('#010612');

const camera=new THREE.PerspectiveCamera(82,window.innerWidth/window.innerHeight,.25,250);
camera.position.set(0,1.7,12);camera.lookAt(0,1.5,-10);

// ─── LIGHTING (GTA V HDR) ───
scene.add(new THREE.AmbientLight('#1a1535',.12));
const moonLight=new THREE.DirectionalLight('#8899cc',.6);
moonLight.position.set(60,70,-50);moonLight.castShadow=true;
moonLight.shadow.mapSize.set(4096,4096);
moonLight.shadow.camera.near=1;moonLight.shadow.camera.far=250;
moonLight.shadow.camera.left=-70;moonLight.shadow.camera.right=70;
moonLight.shadow.camera.top=70;moonLight.shadow.camera.bottom=-70;
moonLight.shadow.bias=-.0002;moonLight.shadow.normalBias=.04;
scene.add(moonLight);

// Moon with glow + lens flare
const moonGeo=new THREE.SphereGeometry(5,32,16);
const moonCanvas=document.createElement('canvas');moonCanvas.width=256;moonCanvas.height=256;
const mCtx=moonCanvas.getContext('2d');mCtx.fillStyle='#ffe8cc';mCtx.fillRect(0,0,256,256);
for(let i=0;i<40;i++){mCtx.fillStyle=`rgba(200,${180+Math.random()*30},${150+Math.random()*20},.3)`;mCtx.beginPath();mCtx.arc(Math.random()*256,Math.random()*256,2+Math.random()*5,0,Math.PI*2);mCtx.fill()}
const moonTex=new THREE.CanvasTexture(moonCanvas);moonTex.colorSpace=THREE.SRGBColorSpace;
const moonObj=new THREE.Mesh(moonGeo,new THREE.MeshBasicMaterial({map:moonTex}));
moonObj.position.set(55,60,-85);scene.add(moonObj);
const moonGlow=new THREE.PointLight('#ffe8cc',10,140);
moonGlow.position.copy(moonObj.position);scene.add(moonGlow);

// God rays (volumetric)
const godRayGeo=new THREE.PlaneGeometry(70,70);
const grCanvas=document.createElement('canvas');grCanvas.width=256;grCanvas.height=256;
const grCtx=grCanvas.getContext('2d');
const grGrad=grCtx.createRadialGradient(128,128,0,128,128,128);
grGrad.addColorStop(0,'rgba(180,190,230,.12)');grGrad.addColorStop(.25,'rgba(130,150,200,.06)');grGrad.addColorStop(.6,'rgba(40,50,90,.015)');grGrad.addColorStop(1,'rgba(0,0,0,0)');
grCtx.fillStyle=grGrad;grCtx.fillRect(0,0,256,256);
const grTex=new THREE.CanvasTexture(grCanvas);
const godRayPlane=new THREE.Mesh(godRayGeo,new THREE.MeshBasicMaterial({map:grTex,transparent:true,opacity:.35,blending:THREE.AdditiveBlending,depthWrite:false}));
godRayPlane.position.set(55,55,-75);scene.add(godRayPlane);

// Flashlight with realistic falloff
const flashLight=new THREE.SpotLight('#ffe8c8',3.5,45,Math.PI/7,.25,.8);
flashLight.position.copy(camera.position);flashLight.castShadow=true;
flashLight.shadow.mapSize.set(1024,1024);flashLight.shadow.bias=-.00008;
scene.add(flashLight);
const flashTarget=new THREE.Object3D();flashTarget.position.set(0,0,-15);
scene.add(flashTarget);flashLight.target=flashTarget;

// ─── STARS (HDR) ───
const starsGeo=new THREE.BufferGeometry();const starsArr=[];
for(let i=0;i<5000;i++)starsArr.push((Math.random()-.5)*400,30+Math.random()*110,-(Math.random()*.8+.2)*200);
starsGeo.setAttribute('position',new THREE.Float32BufferAttribute(starsArr,3));
const stars=new THREE.Points(starsGeo,new THREE.PointsMaterial({color:'#fff',size:.24,transparent:true,opacity:.7,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(stars);

// ─── PROCEDURAL TEXTURES (GTA V quality) ───
function createGroundTex(){
  const c=document.createElement('canvas');c.width=1024;c.height=1024;
  const ctx=c.getContext('2d');
  // Base
  ctx.fillStyle='#110902';ctx.fillRect(0,0,1024,1024);
  // Dirt particles
  for(let i=0;i<10000;i++){ctx.fillStyle=`rgba(${10+Math.random()*30},${5+Math.random()*16},${1+Math.random()*7},.45)`;ctx.fillRect(Math.random()*1024,Math.random()*1024,2+Math.random()*7,2+Math.random()*7)}
  // Cracks
  for(let i=0;i<200;i++){ctx.strokeStyle=`rgba(8,4,0,.25)`;ctx.lineWidth=.5+Math.random()*1.5;ctx.beginPath();ctx.moveTo(Math.random()*1024,Math.random()*1024);ctx.lineTo(Math.random()*1024,Math.random()*1024);ctx.stroke()}
  // Dark wet patches
  for(let i=0;i<25;i++){const g=ctx.createRadialGradient(Math.random()*1024,Math.random()*1024,0,Math.random()*1024,Math.random()*1024,40+Math.random()*60);g.addColorStop(0,'rgba(2,1,0,.45)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,1024,1024)}
  // Small pebbles
  for(let i=0;i<500;i++){ctx.fillStyle=`rgba(${40+Math.random()*40},${35+Math.random()*30},${30+Math.random()*25},.5)`;ctx.beginPath();ctx.arc(Math.random()*1024,Math.random()*1024,1+Math.random()*4,0,Math.PI*2);ctx.fill()}
  // Roots
  for(let i=0;i<30;i++){ctx.strokeStyle='rgba(20,8,2,.3)';ctx.lineWidth=1+Math.random()*3;ctx.beginPath();let x=Math.random()*1024,y=Math.random()*1024;ctx.moveTo(x,y);for(let j=0;j<8;j++){x+=Math.cos(j*.5+Math.random())*40;y+=Math.sin(j*.4+Math.random())*30;ctx.lineTo(x,y)}ctx.stroke()}
  const tex=new THREE.CanvasTexture(c);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(18,18);tex.colorSpace=THREE.SRGBColorSpace;
  return tex;
}
function createBarkTex(){
  const c=document.createElement('canvas');c.width=256;c.height=512;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#150a03';ctx.fillRect(0,0,256,512);
  for(let i=0;i<300;i++){ctx.strokeStyle=`rgba(${12+Math.random()*22},${5+Math.random()*12},${1+Math.random()*6},.6)`;ctx.lineWidth=1+Math.random()*4;ctx.beginPath();ctx.moveTo(Math.random()*256,Math.random()*512);ctx.lineTo(Math.random()*256,Math.random()*512);ctx.stroke()}
  for(let i=0;i<50;i++){ctx.strokeStyle='rgba(8,3,0,.5)';ctx.lineWidth=2+Math.random()*5;ctx.beginPath();let y=i*10+Math.random()*8;ctx.moveTo(0,y);for(let x=0;x<256;x+=18)ctx.lineTo(x+Math.random()*18,y+Math.random()*10-Math.random()*10);ctx.stroke()}
  // Knots
  for(let i=0;i<8;i++){ctx.fillStyle='rgba(8,2,0,.7)';ctx.beginPath();ctx.ellipse(40+Math.random()*180,80+Math.random()*350,8+Math.random()*12,5+Math.random()*8,Math.random()*Math.PI,0,Math.PI*2);ctx.fill()}
  const tex=new THREE.CanvasTexture(c);tex.wrapS=THREE.RepeatWrapping;tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(2,3);tex.colorSpace=THREE.SRGBColorSpace;
  return tex;
}
function createPBRGround(){
  const c=document.createElement('canvas');c.width=512;c.height=512;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#0a0602';ctx.fillRect(0,0,512,512);
  for(let i=0;i<8000;i++){ctx.fillStyle=`rgba(${110+Math.random()*40},${100+Math.random()*30},${90+Math.random()*25},.3)`;ctx.fillRect(Math.random()*512,Math.random()*512,2+Math.random()*5,2+Math.random()*5)}
  for(let i=0;i<150;i++){ctx.strokeStyle=`rgba(80,70,60,.3)`;ctx.lineWidth=.5+Math.random();ctx.beginPath();ctx.moveTo(Math.random()*512,Math.random()*512);ctx.lineTo(Math.random()*512,Math.random()*512);ctx.stroke()}
  const tex=new THREE.CanvasTexture(c);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(20,20);tex.colorSpace=THREE.SRGBColorSpace;
  return tex;
}
const groundTex=createGroundTex();
const barkTex=createBarkTex();
const roughTex=createPBRGround();

// ─── TERRAIN (GTA V terrain quality) ───
const groundGeo=new THREE.PlaneGeometry(350,350,100,100);
const pos=groundGeo.attributes.position;
for(let i=0;i<pos.count;i++){
  const x=pos.getX(i),y=pos.getY(i);
  const dist=Math.sqrt(x*x+y*y);
  const h=Math.sin(x*.02)*Math.cos(y*.028)*3.5+Math.sin(x*.06+y*.045)*1.8+Math.cos(x*.035)*Math.sin(y*.05)*1.2+Math.sin(x*.1+y*.07)*.6+Math.cos(dist*.03)*.5;
  if(Math.abs(x)<5&&Math.abs(y)<5)pos.setZ(i,Math.max(h,-.1));
  else pos.setZ(i,h);
}
groundGeo.computeVertexNormals();
const groundMat=new THREE.MeshStandardMaterial({map:groundTex,roughness:.78,metalness:.03,roughnessMap:roughTex,color:'#0d0803'});
const ground=new THREE.Mesh(groundGeo,groundMat);
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;ground.position.y=-.5;
scene.add(ground);

// ─── PATH (worn trail) ───
const pathGeo=new THREE.PlaneGeometry(3.8,350,3,80);
const pathCanvas=document.createElement('canvas');pathCanvas.width=256;pathCanvas.height=64;
const pCtx=pathCanvas.getContext('2d');pCtx.fillStyle='#140c04';pCtx.fillRect(0,0,256,64);
for(let i=0;i<800;i++){pCtx.fillStyle=`rgba(${15+Math.random()*18},${8+Math.random()*12},${2+Math.random()*6},.45)`;pCtx.fillRect(Math.random()*256,Math.random()*64,2+Math.random()*5,1+Math.random()*3)}
// Tire tracks / wear
for(let i=0;i<3;i++){pCtx.strokeStyle='rgba(8,4,1,.3)';pCtx.lineWidth=2+Math.random()*2;pCtx.setLineDash([8,12]);pCtx.beginPath();pCtx.moveTo(10+i*10,10);pCtx.lineTo(240+i*5,54);pCtx.stroke();pCtx.setLineDash([])}
const pathTex=new THREE.CanvasTexture(pathCanvas);pathTex.wrapS=THREE.RepeatWrapping;pathTex.repeat.set(16,1);
const path=new THREE.Mesh(pathGeo,new THREE.MeshStandardMaterial({map:pathTex,roughness:.88,transparent:true,opacity:.45,color:'#140c04'}));
path.rotation.x=-Math.PI/2;path.position.y=.04;path.position.z=-70;path.receiveShadow=true;scene.add(path);

// ─── WATER PUDDLES (screen-space reflection quality) ───
for(let i=0;i<35;i++){
  const px=(Math.random()-.5)*110,pz=-(Math.random()*.45+.03)*120;
  if(Math.abs(px)<3&&pz>-5)continue;
  const pc=document.createElement('canvas');pc.width=64;pc.height=64;
  const pcx=pc.getContext('2d');pcx.fillStyle='#0a0e1a';pcx.fillRect(0,0,64,64);
  pcx.fillStyle='rgba(40,50,70,.25)';pcx.beginPath();pcx.arc(32,32,28,0,Math.PI*2);pcx.fill();
  // Reflection shimmer
  pcx.fillStyle='rgba(180,200,230,.08)';pcx.fillRect(10,15,15,8);
  const pt=new THREE.CanvasTexture(pc);
  const puddle=new THREE.Mesh(new THREE.CircleGeometry(.25+Math.random()*.9,12),new THREE.MeshStandardMaterial({map:pt,roughness:.08,metalness:.85,color:'#1a2a3a',transparent:true,opacity:.65}));
  puddle.rotation.x=-Math.PI/2;puddle.position.set(px,.025,pz);puddle.receiveShadow=true;scene.add(puddle);
}

// ─── TREES (GTA V flora) ───
const treeGroup=new THREE.Group();
for(let i=0;i<200;i++){
  const tx=(Math.random()-.5)*280,tz=-(Math.random()*.6+.04)*175;
  if(Math.abs(tx)<2.5&&tz>-8&&tz<0)continue;
  const h=2+Math.random()*18,v=Math.floor(Math.random()*3);
  const trunkGeo=new THREE.CylinderGeometry(.08+Math.random()*.38,.18+Math.random()*.5,h,12,8);
  const trunk=new THREE.Mesh(trunkGeo,new THREE.MeshStandardMaterial({map:barkTex,roughness:.88,metalness:.01,color:`rgb(${22+Math.random()*28},${10+Math.random()*16},${3+Math.random()*9})`}));

// ═══════════════════════════════════════════════
//  REALISTIC CARTOON CAT (Trevor Henderson design)
//  Tall, lanky black cat with white cartoon face,
//  huge glowing eyes, wide smile, white gloves
// ═══════════════════════════════════════════════
function createCartoonCat(){
  const g=new THREE.Group();
  const blackFur=new THREE.MeshStandardMaterial({color:'#0d0d0d',roughness:.35,metalness:.04});
  const darkFur=new THREE.MeshStandardMaterial({color:'#1a1a1a',roughness:.4,metalness:.05});

  // ELONGATED TORSO — cat-like but very tall and slender
  const torsoGeo=new THREE.CapsuleGeometry(.55,4,8,12); // tall thin body
  const torso=new THREE.Mesh(torsoGeo,blackFur);
  torso.position.y=3.2;torso.castShadow=true;torso.name='torso';g.add(torso);

  // Upper chest / shoulders (wider)
  const chest=new THREE.Mesh(new THREE.SphereGeometry(.7,.65,.6,12,8),darkFur);
  chest.position.y=5.5;chest.scale.set(1,.8,1);g.add(chest);

  // HIPS
  const hips=new THREE.Mesh(new THREE.SphereGeometry(.55,.5,.5,12,8),blackFur);
  hips.position.y=1.2;g.add(hips);

  // NECK — long and thin
  const neck=new THREE.Mesh(new THREE.CylinderGeometry(.18,.22,2,10),darkFur);
  neck.position.y=6.6;neck.castShadow=true;g.add(neck);

  // HEAD — cat-shaped with cartoon face
  const headGroup=new THREE.Group();
  headGroup.position.y=7.8;

  // Back of head (black fur)
  const headBack=new THREE.Mesh(new THREE.SphereGeometry(.7,.55,.55,16,12),blackFur);
  headBack.position.z=.15;headGroup.add(headBack);

  // WHITE CARTOON FACE (front mask)
  const faceGeo=new THREE.SphereGeometry(.6,.4,.55,16,10);
  const faceCanvas=document.createElement('canvas');faceCanvas.width=256;faceCanvas.height=256;
  const fCtx=faceCanvas.getContext('2d');
  // White base
  const fGrad=fCtx.createRadialGradient(128,140,10,128,128,200);
  fGrad.addColorStop(0,'#ffffff');fGrad.addColorStop(.6,'#fafafa');fGrad.addColorStop(.85,'#e8e0d8');fGrad.addColorStop(1,'#0d0d0d');
  fCtx.fillStyle=fGrad;fCtx.fillRect(0,0,256,256);
  // Eye sockets (dark)
  fCtx.fillStyle='rgba(20,20,20,.4)';fCtx.beginPath();fCtx.ellipse(90,110,38,35,0,0,Math.PI*2);fCtx.fill();
  fCtx.beginPath();fCtx.ellipse(166,110,38,35,0,0,Math.PI*2);fCtx.fill();
  // Mouth area
  fCtx.fillStyle='rgba(10,10,10,.3)';fCtx.beginPath();fCtx.ellipse(128,175,55,28,0,Math.PI,Math.PI);fCtx.fill();
  const faceTex=new THREE.CanvasTexture(faceCanvas);faceTex.colorSpace=THREE.SRGBColorSpace;
  const face=new THREE.Mesh(faceGeo,new THREE.MeshStandardMaterial({map:faceTex,roughness:.3,metalness:.02,color:'#faf8f0'}));
  face.position.z=-.25;headGroup.add(face);

  // EARS (cat ears, tall and pointed)
  for(let s=-1;s<=1;s+=2){
    const earGeo=new THREE.ConeGeometry(.28,.9,8);
    const earCanvas=document.createElement('canvas');earCanvas.width=64;earCanvas.height=128;
    const eCtx=earCanvas.getContext('2d');eCtx.fillStyle='#0d0d0d';eCtx.fillRect(0,0,64,128);
    eCtx.fillStyle='#2a1010';eCtx.beginPath();eCtx.moveTo(32,20);eCtx.lineTo(20,60);eCtx.lineTo(44,60);eCtx.fill();
    const earTex=new THREE.CanvasTexture(earCanvas);earTex.colorSpace=THREE.SRGBColorSpace;
    const ear=new THREE.Mesh(earGeo,new THREE.MeshStandardMaterial({map:earTex,roughness:.35,color:'#0d0d0d'}));
    ear.position.set(s*.5,0.5,0);ear.rotation.z=s*.3;ear.castShadow=true;headGroup.add(ear);
  }

  // EYES — huge, glowing yellow
  for(let s=-1;s<=1;s+=2){
    const eyeCanvas=document.createElement('canvas');eyeCanvas.width=64;eyeCanvas.height=64;
    const eyCtx=eyeCanvas.getContext('2d');
    eyCtx.fillStyle='#ffff00';eyCtx.beginPath();eyCtx.arc(32,32,30,0,Math.PI*2);eyCtx.fill();
    eyCtx.fillStyle='#ffcc00';eyCtx.beginPath();eyCtx.arc(32,32,26,0,Math.PI*2);eyCtx.fill();
    const eyeTex=new THREE.CanvasTexture(eyeCanvas);
    const eye=new THREE.Mesh(new THREE.SphereGeometry(.25,.22,.2,16,8),new THREE.MeshBasicMaterial({map:eyeTex}));
    eye.position.set(s*.28,0.05,-.55);eye.name='eye';headGroup.add(eye);
    // Pupil
    const pup=new THREE.Mesh(new THREE.SphereGeometry(.1,8),new THREE.MeshBasicMaterial({color:'#000'}));
    pup.position.set(s*.28,0.05,-.72);pup.name='pupil';pup.scale.set(.7,.9,1);headGroup.add(pup);
  }

  // NOSE (cat nose)
  const nose=new THREE.Mesh(new THREE.ConeGeometry(.08,.15,6),new THREE.MeshStandardMaterial({color:'#333'}));
  nose.position.set(0,-.05,-.5);nose.rotation.x=Math.PI/2;headGroup.add(nose);

  // WIDE GRIN
  const grinGeo=new THREE.TorusGeometry(.4,.06,8,14,Math.PI);
  const grin=new THREE.Mesh(grinGeo,new THREE.MeshBasicMaterial({color:'#111'}));
  grin.position.set(0,-.15,-.48);grin.rotation.x=Math.PI;grin.rotation.z=Math.PI;headGroup.add(grin);
  // Teeth
  for(let i=-5;i<=5;i+=1.5){
    const tooth=new THREE.Mesh(new THREE.BoxGeometry(.04,.18,.04),new THREE.MeshStandardMaterial({color:'#fff',roughness:.15}));
    tooth.position.set(i*.16,-.05,-.52);headGroup.add(tooth);
  }

  // WHISKERS
  for(let s=-1;s<=1;s+=2){
    for(let j=-1;j<=1;j++){
      const w=new THREE.Mesh(new THREE.CylinderGeometry(.008,.008,.7,4),new THREE.MeshBasicMaterial({color:'#333'}));
      w.position.set(s*.18,.05,j*.2-.45);w.rotation.z=Math.PI/2;w.rotation.y=j*.25;headGroup.add(w);
    }
  }

  g.add(headGroup);

  // LONG SPINDLY ARMS
  for(let s=-1;s<=1;s+=2){
    // Upper arm
    const upperArm=new THREE.Mesh(new THREE.CylinderGeometry(.12,.15,2.2,8),blackFur);
    upperArm.position.set(s*.85,5.2,0);upperArm.rotation.z=s*.25;upperArm.castShadow=true;g.add(upperArm);
    // Forearm (longer, thinner)
    const forearm=new THREE.Mesh(new THREE.CylinderGeometry(.08,.12,2.8,8),blackFur);
    forearm.position.set(s*2.2,4,0);forearm.rotation.z=s*.35;forearm.name=s>0?'rArm':'lArm';forearm.castShadow=true;g.add(forearm);
    // WHITE GLOVE HAND
    const gloveCanvas=document.createElement('canvas');gloveCanvas.width=64;gloveCanvas.height=64;
    const glCtx=gloveCanvas.getContext('2d');glCtx.fillStyle='#faf8f0';glCtx.fillRect(0,0,64,64);
    glCtx.fillStyle='#e8e0d8';glCtx.beginPath();glCtx.arc(32,32,28,0,Math.PI*2);glCtx.fill();
    glCtx.strokeStyle='#ccc';glCtx.lineWidth=2;for(let g=0;g<3;g++){glCtx.beginPath();glCtx.moveTo(10+g*5,15);glCtx.lineTo(10+g*5,45);glCtx.stroke()}
    const gloveTex=new THREE.CanvasTexture(gloveCanvas);gloveTex.colorSpace=THREE.SRGBColorSpace;
    const glove=new THREE.Mesh(new THREE.SphereGeometry(.28,.25,.28,10,8),new THREE.MeshStandardMaterial({map:gloveTex,roughness:.25,metalness:.02,color:'#faf8f0'}));
    glove.position.set(s*3.2,2.5,-.1);glove.name=s>0?'rGlove':'lGlove';g.add(glove);
    // Claws (retracted in glove, implied)
    for(let c=0;c<3;c++){
      const claw=new THREE.Mesh(new THREE.ConeGeometry(.02,.12,4),new THREE.MeshStandardMaterial({color:'#ddd',roughness:.3}));
      claw.position.set(s*3.35,2.25+c*.06,-.25);claw.rotation.z=Math.PI/2;g.add(claw);
    }
  }

  // LONG SPINDLY LEGS
  for(let s=-1;s<=1;s+=2){
    const thigh=new THREE.Mesh(new THREE.CylinderGeometry(.16,.2,2,8),blackFur);
    thigh.position.set(s*.35,1.8,0);thigh.rotation.z=s*.15;thigh.castShadow=true;g.add(thigh);
    const shin=new THREE.Mesh(new THREE.CylinderGeometry(.1,.14,2.5,8),blackFur);
    shin.position.set(s*.5,.5,0);shin.rotation.z=s*.1;shin.castShadow=true;g.add(shin);
    // Large cat paw (black, not gloved)
    const paw=new THREE.Mesh(new THREE.SphereGeometry(.2,.15,.2,8),darkFur);
    paw.position.set(s*.55,-.4,.05);g.add(paw);
  }

  // LONG TAIL (curving)
  const tailPts=[new THREE.Vector3(0,1.1,.5),new THREE.Vector3(-1.5,.8,1.5),new THREE.Vector3(-3.5,.5,1),new THREE.Vector3(-5,-.2,.3),new THREE.Vector3(-4.5,-1.2,.1)];
  const tailCurve=new THREE.CatmullRomCurve3(tailPts);
  const tailGeo=new THREE.TubeGeometry(tailCurve,20,.08,8,false);
  const tail=new THREE.Mesh(tailGeo,blackFur);g.add(tail);

  g.scale.set(1.3,1.3,1.3); // Make it TALL — ~15 feet
  g.visible=false;g.position.set(0,0,-45);
  scene.add(g);return g;
}
const catBoss=createCartoonCat();

// ═══════════════════════════════════════════════
//  REALISTIC SIREN HEAD (enhanced)
// ═══════════════════════════════════════════════
function createSirenHead(){
  const g=new THREE.Group();
  const rusty=new THREE.MeshStandardMaterial({color:'#4a3520',roughness:.6,metalness:.1});
  const darkRust=new THREE.MeshStandardMaterial({color:'#3a2515',roughness:.7,metalness:.08});

  // Legs
  for(let s=-1;s<=1;s+=2){
    const legGeo=new THREE.CylinderGeometry(.25,.3,10,8);
    const legCanvas=document.createElement('canvas');legCanvas.width=64;legCanvas.height=256;
    const lCtx=legCanvas.getContext('2d');lCtx.fillStyle='#3a2515';lCtx.fillRect(0,0,64,256);

function spawnParts(pos,color,n=25,spd=4,life=55,blood=false){
  const g=new THREE.Group();
  for(let i=0;i<n;i++){
    const size=blood?.05+.18*Math.random():.04+.14*Math.random();
    const p=new THREE.Mesh(new THREE.SphereGeometry(size,5),new THREE.MeshBasicMaterial({color,transparent:true,opacity:1}));
    p.position.copy(pos);p.userData={vx:(Math.random()-.5)*spd,vy:Math.random()*spd*.7,vz:(Math.random()-.5)*spd,life,blood};g.add(p);
  }
  scene.add(g);let t=0;
  const iv=setInterval(()=>{t+=16;let alive=false;g.children.forEach(p=>{p.userData.life-=16;p.position.x+=p.userData.vx*.016;p.position.y+=p.userData.vy*.016;p.position.z+=p.userData.vz*.016;p.userData.vy-=3.5*.016;p.material.opacity=Math.max(0,p.userData.life/life);if(p.userData.life>0)alive=true;if(p.userData.blood&&p.position.y<.08&&p.userData.life>life*.25){addBloodDecal(p.position);p.userData.life=0}});if(!alive){clearInterval(iv);scene.remove(g);g.children.forEach(c=>{c.material.dispose();c.geometry.dispose()})}},16);
  return g;
}

  if(sirenBoss.visible&&!sirDefeated)targets.push(...sirenBoss.children);
  const hits=raycaster.intersectObjects(targets,true);
  if(hits.length>0){
    const point=hits[0].point;spawnParts(point,'#ff5533',28,6,50);sHit();screenBlood(.5);
    let hitCat=false,hitSir=false,obj=hits[0].object;

  requestAnimationFrame(gameLoop);const dt=Math.min(clock.getDelta(),.12);frameCount++;
  if(damageFlash>0){damageFlash--;renderer.domElement.style.filter=`brightness(${1+damageFlash*.03})`}else renderer.domElement.style.filter='';

  // Rain
  rainI+=(targetRain-rainI)*dt*.4;rainSystem.material.opacity=.06+.16*rainI;rainSystem.visible=rainI>.02;
  const rpos=rainSystem.geometry.attributes.position;for(let i=0;i<rainCount;i++){rpos.array[i*3+1]-=16*dt*rainI;if(rpos.array[i*3+1]<-1){rpos.array[i*3+1]=28+Math.random()*6;rpos.array[i*3]=(Math.random()-.5)*110;rpos.array[i*3+2]=-(Math.random()*.75+.05)*150}}rpos.needsUpdate=true;
  thunderTimer-=dt;if(thunderTimer<=0&&rainI>.3&&Math.random()<.004){thunderTimer=7+Math.random()*18;thunderFlash=.9+Math.random()*.6;sThunder();renderer.toneMappingExposure=1.4}
  if(thunderFlash>0){thunderFlash=Math.max(0,thunderFlash-dt*4.5);renderer.toneMappingExposure=.55+thunderFlash*1.3}
  // Wind + tree sway
  const wS=.04+.12*rainI;
  treeGroup.children.forEach(c=>{if(c.userData&&c.userData.bx!==undefined){c.position.x=c.userData.bx+Math.sin(frameCount*.008+c.userData.so)*wS;c.position.z=c.userData.bz+Math.cos(frameCount*.01+c.userData.so)*wS*.5}});
  grassGroup.children.forEach(c=>{if(c.userData&&c.userData.bx!==undefined){c.position.x=c.userData.bx+Math.sin(frameCount*.012+c.userData.so)*wS*1.8}});

  if(gameState==='playing'){
    if(mouseLocked){euler.set(cameraPitch,cameraYaw,0);camera.quaternion.setFromEuler(euler)}
    velocity.x=0;velocity.z=0;
    if(keys['w']||touchState.move.y<-0.3)velocity.z-=1;if(keys['s']||touchState.move.y>0.3)velocity.z+=1;
    if(keys['a']||touchState.move.x<-0.3)velocity.x-=1;if(keys['d']||touchState.move.x>0.3)velocity.x+=1;
    direction.set(velocity.x,0,velocity.z).normalize();sprinting=keys['shift'];const speed=sprinting?7.8:4.2;
    if(velocity.length()>0){headBob+=dt*12;const fwd=direction.clone().applyQuaternion(camera.quaternion);fwd.y=0;fwd.normalize();camera.position.x+=fwd.x*speed*dt;camera.position.z+=fwd.z*speed*dt}
    if(!grounded)velocity.y-=17*dt;
    const bob=velocity.length()>0?Math.sin(headBob)*.055:0;camera.position.y+=bob;
    if((keys[' ']||touchState.jump)&&grounded){velocity.y=9;grounded=false;sfx(125,'sine',.025,.05)}
    camera.position.y+=velocity.y*dt;
    const ty=getTerrainHeight(camera.position.x,camera.position.z);
    if(camera.position.y<=ty+1.6){camera.position.y=ty+1.6;velocity.y=0;grounded=true}
    camera.position.x=Math.max(-130,Math.min(130,camera.position.x));camera.position.z=Math.max(-165,Math.min(14,camera.position.z));
    flashLight.intensity=flashlightOn?3.5:0;flashLight.position.copy(camera.position);flashLight.position.y+=.5;
    const lookT=new THREE.Vector3();camera.getWorldDirection(lookT);flashTarget.position.copy(camera.position).add(lookT.multiplyScalar(16));
    checkLore();
    if(Math.random()<.003){sCreak();if(Math.random()<.3&&rainI>.15)sRain_hit()}
    const cz=camera.position.z;
    if(cz<-30&&!catActive&&!catDefeated){catActive=true;catBoss.visible=true;catBoss.position.set(camera.position.x+(Math.random()-.5)*6,getTerrainHeight(camera.position.x,camera.position.z),camera.position.z-13);showMsg('\uD83D\uDC31 CARTOON CAT: "Another fool wanders into my hunting grounds. Your fear... is delicious."',5000);showBossBar(catHP,catMHP,'\uD83D\uDC31 CARTOON CAT');sRoar();sStretch();targetRain=.45}
    if(cz<-60&&!sirActive&&!sirDefeated&&catDefeated){sirActive=true;sirenBoss.visible=true;sirenBoss.position.set(camera.position.x+(Math.random()-.5)*8,getTerrainHeight(camera.position.x,camera.position.z),camera.position.z-11);showMsg('\uD83D\uDCE2 SIREN HEAD: *DEAFENING RADIO SCREECH* ...I was once a man. Now I am the frequency of death...',5500);showBossBar(sirHP,sirMHP,'\uD83D\uDCE2 SIREN HEAD');sRoar();targetRain=.65}
    // Cat AI
    if(catActive&&!catDefeated&&catBoss.visible){bossTimers.cat++;catBoss.lookAt(camera.position);const dist=camera.position.distanceTo(catBoss.position);catBoss.position.y=getTerrainHeight(catBoss.position.x,catBoss.position.z)+Math.sin(frameCount*.03)*.5;
      // Arm stretch (right arm extends across screen)
      if(bossTimers.cat>85&&dist<17&&!stretchActive){stretchActive=true;bossTimers.cat=0;const rArm=catBoss.getObjectByName('rArm');if(rArm){rArm.scale.y=5;rArm.position.z=-3.5}const rGlove=catBoss.getObjectByName('rGlove');if(rGlove)rGlove.position.z=-16;sStretch();spawnParts(catBoss.position.clone().add(new THREE.Vector3(0,4,0)),'#ff0',20,5,40);setTimeout(()=>{const ra=catBoss.getObjectByName('rArm');if(ra){ra.scale.y=1;ra.position.z=0}const rg=catBoss.getObjectByName('rGlove');if(rg)rg.position.z=-.1;stretchActive=false;if(dist<10)takeDamage(24)},1200)}
      if(bossTimers.cat>125&&!stretchActive){bossTimers.cat=0;const mv=camera.position.clone().sub(catBoss.position).normalize().multiplyScalar(2);catBoss.position.add(mv);if(dist<7){takeDamage(20);addBloodDecal(camera.position.clone())}}
      const eyes=catBoss.children.filter(c=>c.name==='eye');eyes.forEach(e=>e.material.color.setHSL(.15,.85,.4+.45*Math.sin(frameCount*.0035)));showBossBar(catHP,catMHP,'\uD83D\uDC31 CARTOON CAT')}
    // Siren AI
    if(sirActive&&!sirDefeated&&sirenBoss.visible){bossTimers.sir++;sirenBoss.lookAt(camera.position);const dist=camera.position.distanceTo(sirenBoss.position);sirenBoss.position.y=getTerrainHeight(sirenBoss.position.x,sirenBoss.position.z);
      if(sirHP<sirMHP*.35&&!sirSSJ){sirSSJ=true;const a=sirenBoss.getObjectByName('ssjAura');if(a)a.intensity=6;const g=sirenBoss.getObjectByName('ssjGlow');if(g)g.material.opacity=.6;const r=sirenBoss.getObjectByName('ssjRing');if(r)r.material.opacity=.65;sSSJ();spawnParts(sirenBoss.position.clone().add(new THREE.Vector3(0,16,0)),'#ffd700',90,10,110,true);showMsg('\u26a1\u26a1 SIREN HEAD AWAKENS SUPER SAIYAN POWER!!! \u26a1\u26a1',5500);targetRain=.85;thunderTimer=1}
      if(bossTimers.sir>75){bossTimers.sir=0;const rush=camera.position.clone().sub(sirenBoss.position).normalize().multiplyScalar(sirSSJ?3.5:1.8);sirenBoss.position.add(rush);if(dist<8){takeDamage(sirSSJ?38:22);addBloodDecal(camera.position.clone())}if(Math.random()<.5){sfx(26,'sawtooth',.1,.4);spawnParts(sirenBoss.position.clone().add(new THREE.Vector3(0,9,0)),'#ff5500',28,7,50,true)}}
      if(sirSSJ){const a=sirenBoss.getObjectByName('ssjAura');if(a)a.intensity=4.5+Math.sin(frameCount*.005)*1.8;const r=sirenBoss.getObjectByName('ssjRing');if(r){r.rotation.z+=.06;r.material.opacity=.55+.3*Math.sin(frameCount*.007)}const hl=sirenBoss.children.filter(c=>c.name==='hornLight');hl.forEach(h=>h.material.color.setHSL(.15,.9,.4+.5*Math.sin(frameCount*.009)))}
      showBossBar(sirHP,sirMHP,(sirSSJ?'\u26a1':'\uD83D\uDCE2')+' SIREN HEAD',sirSSJ)}
  }

  // Ending
  if(gameState==='ending'){endTimer+=dt;const t=endTimer,orR=17;camera.position.x=Math.sin(t*.26)*orR;camera.position.z=-72+Math.cos(t*.26)*orR;camera.position.y=4.5+Math.sin(t*.16)*3;camera.lookAt(0,3,-72);endingObjects.forEach(o=>{if(o.type==='Group'){o.position.y+=Math.sin(t*3.2+o.position.x)*.7;o.rotation.y+=dt*1.3}});rainI=Math.max(0,rainI-dt*.35);targetRain=0;
    if(t>2&&Math.floor(t*2)%3===0)sDance();if(t>2.5&&Math.floor(t*5)%2===0)spawnParts(new THREE.Vector3(0,2.5,-70),'#ffaa00',10,4,40);
    if(t>3)showMsg('\uD83D\uDD7A BENDY HITS THE GRIDDY! \uD83E\uDD80 KRABS: "MONEY!" \uD83D\uDD25 FRIED & COOKED!',5000);
    if(t>15){document.getElementById('overlay').classList.remove('hidden');document.getElementById('overlay').querySelector('h1').textContent='YOU SURVIVED';document.getElementById('overlay').querySelector('.sub').textContent='The Blackwood is FREE';document.getElementById('overlay').querySelector('.blink').textContent='CLICK TO PLAY AGAIN';document.getElementById('overlay').querySelector('.tagline').textContent='Bendy Griddy \u2705  Cuphead Censored \u2705  Krabs Fried \u2705  Blood \uD83E\uDE78';document.getElementById('overlay').onclick=()=>location.reload()}}
  if(gameState==='gameover'){endTimer+=dt;if(endTimer>6){document.getElementById('overlay').onclick=()=>location.reload()}}

  // Cleanup
  for(let i=bloodDecals.length-1;i>=0;i--){bloodDecals[i].timer--;if(bloodDecals[i].timer<=0){scene.remove(bloodDecals[i].mesh);bloodDecals.splice(i,1)}}
  mistGroup.children.forEach(m=>{m.position.x+=m.userData.vx*dt;m.position.y+=m.userData.vy*dt;m.position.z+=m.userData.vz*dt;if(m.position.x>65)m.position.x=-65;if(m.position.x<-65)m.position.x=65;if(m.position.y>11)m.position.y=.2;if(m.position.z>5)m.position.z=-150});
  fireflyData.forEach(ff=>{ff.mesh.position.x=ff.bx+Math.sin(frameCount*.007*ff.speed+ff.phase)*3;ff.mesh.position.y=ff.h+Math.sin(frameCount*.011*ff.speed+ff.phase)*2.5;ff.mesh.material.opacity=.2+.6*Math.sin(frameCount*.022*ff.speed+ff.phase)});
  loreStones.forEach(s=>{if(!s.collected){s.stone.material.emissiveIntensity=.45+.45*Math.sin(frameCount*.035);s.glow.material.opacity=.12+.25*Math.sin(frameCount*.045);s.light.intensity=.8+.6*Math.sin(frameCount*.055)}});
  document.getElementById('map').style.display=showMap?'block':'none';if(showMap)drawMap();
  renderer.render(scene,camera);
}

document.getElementById('overlay').addEventListener('click',()=>{AC.resume();if(gameState==='title')startGame();else if(gameState==='gameover'||gameState==='ending')location.reload()});
document.addEventListener('click',()=>{AC.resume()},{once:true});
gameLoop();
