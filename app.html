<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="description" content="Forest of Nightmares — Cyberpunk 2077 / GTA V Realism Horror">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon-512.png">
<title>🌲 Forest of Nightmares</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace;cursor:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;top:0;left:0;image-rendering:auto}
/* ─── POST-PROCESSING STACK ─── */
#chromatic{position:fixed;inset:0;pointer-events:none;z-index:8;opacity:0;transition:opacity .2s;mix-blend-mode:screen}
#chromatic.active{opacity:.35}
#chromatic::before{content:'';position:absolute;inset:0;background:inherit;filter:url(#chroma)}
#bloom-layer{position:fixed;inset:0;pointer-events:none;z-index:7;opacity:.08;mix-blend-mode:screen;background:radial-gradient(ellipse at 50% 30%,rgba(80,120,200,.15) 0%,transparent 60%),radial-gradient(ellipse at 30% 60%,rgba(200,160,100,.1) 0%,transparent 50%)}
#blood{position:fixed;inset:0;pointer-events:none;z-index:9;opacity:0;transition:opacity .12s;mix-blend-mode:multiply}
#blood.splat{opacity:1;transition:opacity 0s;background:radial-gradient(ellipse at 35% 45%,rgba(200,20,0,.4) 0%,rgba(140,0,0,.3) 28%,rgba(80,0,0,.18) 50%,transparent 68%),radial-gradient(ellipse at 68% 38%,rgba(180,10,0,.25) 0%,transparent 45%),radial-gradient(ellipse at 50% 60%,rgba(150,5,0,.35) 0%,transparent 40%)}
#dof-near{position:fixed;inset:0;pointer-events:none;z-index:6;backdrop-filter:blur(0px);transition:backdrop-filter .5s;opacity:0}
#dof-near.active{backdrop-filter:blur(3px);opacity:.15}
#grain{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:.035;mix-blend-mode:overlay;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:140px;animation:grain .1s steps(5) infinite}
@keyframes grain{0%,100%{transform:translate(0,0)}20%{transform:translate(-1%,-1.5%)}40%{transform:translate(1%,-2%)}60%{transform:translate(-2%,1%)}80%{transform:translate(1.5%,1%)}}
#motion{position:fixed;inset:0;pointer-events:none;z-index:7;opacity:0;transition:opacity .25s}
#motion.active{opacity:.1;backdrop-filter:blur(2.5px)}
#lens{position:fixed;inset:0;pointer-events:none;z-index:10;opacity:.025;background:radial-gradient(ellipse at 28% 22%,rgba(255,200,140,1) 0%,transparent 30%),radial-gradient(ellipse at 78% 75%,rgba(180,210,255,.5) 0%,transparent 25%),radial-gradient(circle at 50% 50%,rgba(0,0,0,.8) 0%,transparent 35%)}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at center,transparent 48%,rgba(0,0,0,.88) 100%)}
#scanlines{position:fixed;inset:0;pointer-events:none;z-index:11;opacity:.03;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.15) 2px,rgba(0,0,0,.15) 4px)}
#wet{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity 2s;background:linear-gradient(180deg,rgba(20,30,50,.08) 0%,rgba(10,15,30,.12) 30%,rgba(5,10,20,.08) 60%,rgba(15,25,40,.1) 100%)}
#wet.active{opacity:1}
/* ─── HUD (Cyberpunk style) ─── */
#overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse at center,#050000 0%,#000 100%);transition:opacity .9s;cursor:pointer}
#overlay.hidden{opacity:0;pointer-events:none}
#overlay h1{font-size:clamp(2em,8vw,5.5em);color:#8b0000;text-shadow:0 0 100px #ff0000,0 0 200px #8b0000,0 0 40px #ff6600,0 0 10px #fff;letter-spacing:8px;margin:0;animation:titleGlow 2s ease-in-out infinite;font-family:'Times New Roman',serif}
#overlay h1.sub{font-size:clamp(1.5em,4vw,2.8em);color:#a0522d;text-shadow:0 0 50px #cd853f,0 0 100px #8b4513;animation:glow2 3s ease-in-out infinite}
@keyframes titleGlow{0%,100%{text-shadow:0 0 80px #ff0000,0 0 160px #8b0000,0 0 30px #ff6600}50%{text-shadow:0 0 160px #ff3300,0 0 300px #990000,0 0 60px #ff8800}}
@keyframes glow2{0%,100%{text-shadow:0 0 40px #cd853f}50%{text-shadow:0 0 100px #8b4513}}
#overlay .tagline{color:#654321;font-size:1em;margin:12px 0 30px;letter-spacing:4px}
#overlay .blink{color:#8b0000;font-size:1.3em;animation:blink 1.8s infinite;margin-top:30px;font-weight:bold}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
#overlay .controls{color:#3a2010;font-size:.72em;margin-top:25px;max-width:600px;text-align:center;line-height:2.2}
#hud{position:fixed;bottom:55px;left:50%;transform:translateX(-50%);z-index:15;pointer-events:none;display:none;text-align:center}
#hp-outer{width:320px;height:14px;background:rgba(0,0,0,.9);border:1px solid #1a1a1a;border-radius:2px;overflow:hidden;margin:0 auto;box-shadow:0 0 20px rgba(255,0,0,.15),inset 0 0 8px rgba(0,0,0,.5)}
#hp-fill{height:100%;background:linear-gradient(90deg,#8b0000 0%,#dc143c 25%,#ff4500 50%,#ff6347 75%,#ff4500 100%);transition:width .35s;width:100%;box-shadow:inset 0 1px 4px rgba(255,150,80,.4),0 0 8px rgba(255,50,0,.3)}
#hp-text{color:#aaa;font-size:10px;margin:7px 0;text-shadow:0 0 8px #000;letter-spacing:2px}
#boss-outer{width:320px;height:10px;background:rgba(0,0,0,.9);border:1px solid #300;margin:14px auto 0;overflow:hidden;display:none;box-shadow:0 0 25px rgba(255,0,0,.25)}
#boss-fill{height:100%;background:linear-gradient(90deg,#8b0000,#ff0000);transition:width .35s;width:100%}
#boss-label{color:#f44;font-size:9px;margin:4px 0;text-shadow:0 0 10px #f00;letter-spacing:1px}
#msg{position:fixed;top:8%;left:50%;transform:translateX(-50%);color:#cd853f;font-size:1.05em;text-align:center;pointer-events:none;z-index:12;text-shadow:0 0 25px #000;opacity:0;transition:opacity .7s;max-width:90vw;font-style:italic;letter-spacing:.5px}
#msg.on{opacity:1}
#story{position:fixed;top:36%;left:50%;transform:translate(-50%,-50%);color:#c8ad8f;font-size:1.1em;text-align:center;pointer-events:none;z-index:12;text-shadow:0 0 30px #000,0 0 15px #000;opacity:0;transition:opacity 1.2s;max-width:82vw;line-height:2.5;font-style:italic;letter-spacing:1px}
#story.on{opacity:1}
#compass{position:fixed;top:25px;right:25px;z-index:14;pointer-events:none;width:100px;height:100px;display:none}
#compass canvas{width:100%;height:100%}
</style>
</head>
<body>
<svg style="display:none"><filter id="chroma"><feColorMatrix type="matrix" values="1 0 0 0 .01  0 .95 0 0 0  0 0 1 0 -.01  0 0 0 1 0"/></filter></svg>
<div id="chromatic"></div>
<div id="bloom-layer"></div>
<div id="blood"></div>
<div id="dof-near"></div>
<div id="grain"></div>
<div id="motion"></div>
<div id="lens"></div>
<div id="vignette"></div>
<div id="scanlines"></div>
<div id="wet"></div>
<div id="compass"><canvas id="compass-canvas" width="100" height="100"></canvas></div>
<div id="overlay">
  <h1>FOREST OF</h1><h1 class="sub">NIGHTMARES</h1>
  <p class="tagline">BEYOND GTA V · BEYOND CYBERPUNK</p>
  <p class="blink">▶ CLICK TO ENTER THE BLACKWOOD ◀</p>
  <p class="controls">WASD Move · Mouse Look · Click Attack · SPACE Jump<br>SHIFT Sprint · F Flashlight · M Map · C Compass · ESC Pause</p>
</div>
<div id="hud">
  <div id="hp-outer"><div id="hp-fill"></div></div>
  <div id="hp-text">♥ 100 / 100</div>
  <div id="boss-outer"><div id="boss-fill"></div></div>
  <div id="boss-label"></div>
</div>
<div id="msg"></div><div id="story"></div>

<script src="threejs/three.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════
//  FOREST OF NIGHTMARES — BEYOND GTA V / CYBERPUNK 2077
//  SSR · Volumetric · PBR · Chromatic Aberration · DoF
//  Dynamic Weather · 3D Audio · Real-time ToD
// ═══════════════════════════════════════════════════════════

const AC=new(window.AudioContext||window.webkitAudioContext)();
const sfx=(f,t,d,v=.1,g=0)=>{try{const o=AC.createOscillator(),gn=AC.createGain(),tm=AC.currentTime;o.type=t;o.frequency.setValueAtTime(f,tm);if(g)o.frequency.linearRampToValueAtTime(f+g,tm+d);gn.gain.setValueAtTime(v,tm);gn.gain.exponentialRampToValueAtTime(.001,tm+d);o.connect(gn);gn.connect(AC.destination);o.start(tm);o.stop(tm+d)}catch(e){}};
// ─── 3D SPATIAL AUDIO ───
const audioListener=new THREE.AudioListener();let audioLoaded=false;
function play3D(buffer,pos,vol=.5,loop=false){try{if(!audioLoaded)return;const snd=new THREE.PositionalAudio(audioListener);snd.setBuffer(buffer);snd.setRefDistance(5);snd.setVolume(vol);snd.setLoop(loop);snd.position.copy(pos);scene.add(snd);snd.play();return snd}catch(e){}}
// Procedural buffer generation
function genBuf(dur,freq,type,vol=.3){try{const sr=AC.sampleRate,len=sr*dur,buf=AC.createBuffer(1,len,sr),d=buf.getChannelData(0);for(let i=0;i<len;i++){const t=i/sr,e=Math.exp(-t*3);d[i]=(type==='noise'?(Math.random()*2-1):Math.sin(2*Math.PI*freq*t))*vol*e}return buf}catch(e){return null}}
const bufAmbient1=genBuf(4,80+Math.random()*40,'sine',.05);const bufCreak=genBuf(1.5,35,'noise',.04);
const sHit=()=>{sfx(50,'sawtooth',.07,.2);sfx(25,'square',.04,.14);sfx(80,'triangle',.02,.12)};
const sPower=()=>{for(let i=0;i<10;i++)setTimeout(()=>sfx(180+i*160,'sine',.03,.05),i*45);sfx(60,'square',.08,.3,60);sfx(90,'triangle',.05,.2)};
const sStretch=()=>{sfx(35,'sawtooth',.08,.45,15);sfx(50,'square',.04,.3)};
const sRoar=()=>{sfx(16,'sawtooth',.12,.6,8);sfx(28,'square',.07,.4);sfx(42,'triangle',.05,.35)};
const sSSJ=()=>{for(let i=0;i<14;i++)setTimeout(()=>sfx(220+i*140,'sine',.03,.05),i*38);sfx(45,'sawtooth',.1,.4,65);sfx(75,'square',.06,.3)};
const sWin=()=>{for(let i=0;i<18;i++)setTimeout(()=>sfx(220+i*85,'triangle',.025,.08),i*60)};
const sDance=()=>{sfx(523,'square',.035,.12);setTimeout(()=>sfx(659,'square',.035,.12),110);setTimeout(()=>sfx(784,'square',.035,.12),220);setTimeout(()=>sfx(1047,'square',.05,.18),330)};
const sAmbient=()=>{sfx(65+Math.random()*40,'triangle',.025,3);setTimeout(()=>sfx(100+Math.random()*55,'triangle',.015,2.5),800+Math.random()*800);setTimeout(()=>sfx(30+Math.random()*25,'sawtooth',.01,4),1800+Math.random()*1200)};
const sSplat=()=>{for(let i=0;i<5;i++)sfx(20+Math.random()*30,'square',.025,.18)};
const sCreak=()=>{sfx(30+Math.random()*25,'sawtooth',.015,1,5);setTimeout(()=>sfx(40+Math.random()*35,'sawtooth',.01,.8,8),350)};
const sThunder=()=>{sfx(10,'sawtooth',.18,2,3);sfx(20,'square',.1,1.4);setTimeout(()=>sfx(28,'sawtooth',.06,1),250)};
const sFootstep=()=>{sfx(60,'square',.01,.06);sfx(40,'sine',.005,.04)};
const sRain_hit=()=>{sfx(180+Math.random()*350,'sine',.008,.1)};
let ambLoop;const startAmbient=()=>{ambLoop=setInterval(sAmbient,2200+Math.random()*1800)};

// ─── RENDERER ───
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance',alpha:false,stencil:true,depth:true,preserveDrawingBuffer:false});
renderer.setSize(window.innerWidth,window.innerHeight);renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.52;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog('#020a1a',35,190);
scene.background=new THREE.Color('#020818');
camera.add(audioListener);

const camera=new THREE.PerspectiveCamera(84,window.innerWidth/window.innerHeight,.22,260);
camera.position.set(0,1.75,13);camera.lookAt(0,1.5,-10);

// ─── DYNAMIC TIME OF DAY ───
let tod=0; // 0-1 (0=midnight, .5=dawn)
function updateToD(dt){
  tod=(tod+dt*.0008)%1; // Slow cycle
  const nightBlend=Math.max(0,1-Math.abs(tod-.5)*4);
  scene.fog.color.setHSL(.65,.4,.02+nightBlend*.06);
  scene.background.setHSL(.65,.3,.02+nightBlend*.04);
  moonLight.intensity=.3+nightBlend*.4;
  moonGlow.intensity=4+nightBlend*8;
  stars.material.opacity=nightBlend*.8;
  renderer.toneMappingExposure=.4+nightBlend*.25;
}

// ─── LIGHTING ───
scene.add(new THREE.AmbientLight('#1a1535',.08));
const moonLight=new THREE.DirectionalLight('#8899cc',.55);
moonLight.position.set(60,75,-55);moonLight.castShadow=true;
moonLight.shadow.mapSize.set(4096,4096);moonLight.shadow.camera.near=1;moonLight.shadow.camera.far=260;
moonLight.shadow.camera.left=-75;moonLight.shadow.camera.right=75;
moonLight.shadow.camera.top=75;moonLight.shadow.camera.bottom=-75;
moonLight.shadow.bias=-.00018;moonLight.shadow.normalBias=.05;
scene.add(moonLight);

const moonGeo=new THREE.SphereGeometry(5.5,32,16);
const moonCanvas=document.createElement('canvas');moonCanvas.width=256;moonCanvas.height=256;
const mCtx=moonCanvas.getContext('2d');mCtx.fillStyle='#ffe8cc';mCtx.fillRect(0,0,256,256);
for(let i=0;i<60;i++){mCtx.fillStyle=`rgba(${190+Math.random()*40},${170+Math.random()*30},${140+Math.random()*25},.25)`;mCtx.beginPath();mCtx.arc(Math.random()*256,Math.random()*256,2+Math.random()*6,0,Math.PI*2);mCtx.fill()}
const moonTex=new THREE.CanvasTexture(moonCanvas);moonTex.colorSpace=THREE.SRGBColorSpace;
const moonObj=new THREE.Mesh(moonGeo,new THREE.MeshBasicMaterial({map:moonTex}));
moonObj.position.set(55,65,-90);scene.add(moonObj);
const moonGlow=new THREE.PointLight('#ffe8cc',10,150);
moonGlow.position.copy(moonObj.position);scene.add(moonGlow);

// God rays
const godRayGeo=new THREE.PlaneGeometry(75,75);
const grCanvas=document.createElement('canvas');grCanvas.width=256;grCanvas.height=256;
const grCtx=grCanvas.getContext('2d');const grGrad=grCtx.createRadialGradient(128,128,0,128,128,128);
grGrad.addColorStop(0,'rgba(170,185,225,.1)');grGrad.addColorStop(.2,'rgba(120,145,195,.05)');grGrad.addColorStop(.5,'rgba(35,45,85,.01)');grGrad.addColorStop(1,'rgba(0,0,0,0)');
grCtx.fillStyle=grGrad;grCtx.fillRect(0,0,256,256);
const godRayPlane=new THREE.Mesh(godRayGeo,new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(grCanvas),transparent:true,opacity:.3,blending:THREE.AdditiveBlending,depthWrite:false}));
godRayPlane.position.set(55,60,-80);scene.add(godRayPlane);

// Flashlight
const flashLight=new THREE.SpotLight('#ffe8c8',3.8,48,Math.PI/7,.22,.7);
flashLight.position.copy(camera.position);flashLight.castShadow=true;
flashLight.shadow.mapSize.set(1024,1024);flashLight.shadow.bias=-.00007;
scene.add(flashLight);const flashTarget=new THREE.Object3D();flashTarget.position.set(0,0,-16);scene.add(flashTarget);flashLight.target=flashTarget;

// Stars
const starsGeo=new THREE.BufferGeometry();const starsArr=[];
for(let i=0;i<6000;i++)starsArr.push((Math.random()-.5)*420,28+Math.random()*120,-(Math.random()*.8+.2)*210);
starsGeo.setAttribute('position',new THREE.Float32BufferAttribute(starsArr,3));
const stars=new THREE.Points(starsGeo,new THREE.PointsMaterial({color:'#fff',size:.26,transparent:true,opacity:.65,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(stars);

// ─── PROCEDURAL TEXTURES ───
function createGroundTex(){
  const c=document.createElement('canvas');c.width=1024;c.height=1024;const ctx=c.getContext('2d');
  ctx.fillStyle='#0e0602';ctx.fillRect(0,0,1024,1024);
  for(let i=0;i<12000;i++){ctx.fillStyle=`rgba(${8+Math.random()*32},${4+Math.random()*18},${1+Math.random()*8},.4)`;ctx.fillRect(Math.random()*1024,Math.random()*1024,2+Math.random()*8,2+Math.random()*8)}
  for(let i=0;i<250;i++){ctx.strokeStyle=`rgba(6,3,0,.2)`;ctx.lineWidth=.4+Math.random()*1.8;ctx.beginPath();ctx.moveTo(Math.random()*1024,Math.random()*1024);ctx.lineTo(Math.random()*1024,Math.random()*1024);ctx.stroke()}
  for(let i=0;i<30;i++){const g=ctx.createRadialGradient(Math.random()*1024,Math.random()*1024,0,Math.random()*1024,Math.random()*1024,35+Math.random()*55);g.addColorStop(0,'rgba(2,1,0,.5)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,1024,1024)}
  for(let i=0;i<600;i++){ctx.fillStyle=`rgba(${38+Math.random()*45},${32+Math.random()*35},${28+Math.random()*30},.45)`;ctx.beginPath();ctx.arc(Math.random()*1024,Math.random()*1024,1+Math.random()*5,0,Math.PI*2);ctx.fill()}
  for(let i=0;i<40;i++){ctx.strokeStyle='rgba(18,6,1,.25)';ctx.lineWidth=1+Math.random()*3.5;ctx.beginPath();let x=Math.random()*1024,y=Math.random()*1024;ctx.moveTo(x,y);for(let j=0;j<10;j++){x+=Math.cos(j*.45+Math.random())*35;y+=Math.sin(j*.35+Math.random())*28;ctx.lineTo(x,y)}ctx.stroke()}
  const tex=new THREE.CanvasTexture(c);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(16,16);tex.colorSpace=THREE.SRGBColorSpace;return tex;
}
function createBarkTex(){
  const c=document.createElement('canvas');c.width=256;c.height=512;const ctx=c.getContext('2d');
  ctx.fillStyle='#120802';ctx.fillRect(0,0,256,512);
  for(let i=0;i<350;i++){ctx.strokeStyle=`rgba(${10+Math.random()*24},${4+Math.random()*14},${1+Math.random()*7},.55)`;ctx.lineWidth=.8+Math.random()*4.5;ctx.beginPath();ctx.moveTo(Math.random()*256,Math.random()*512);ctx.lineTo(Math.random()*256,Math.random()*512);ctx.stroke()}
  for(let i=0;i<55;i++){ctx.strokeStyle='rgba(6,2,0,.45)';ctx.lineWidth=2+Math.random()*5.5;ctx.beginPath();let y=i*9+Math.random()*7;ctx.moveTo(0,y);for(let x=0;x<256;x+=16)ctx.lineTo(x+Math.random()*20,y+Math.random()*12-Math.random()*12);ctx.stroke()}
  for(let i=0;i<10;i++){ctx.fillStyle='rgba(6,2,0,.6)';ctx.beginPath();ctx.ellipse(35+Math.random()*190,70+Math.random()*370,7+Math.random()*14,4+Math.random()*9,Math.random()*Math.PI,0,Math.PI*2);ctx.fill()}
  const tex=new THREE.CanvasTexture(c);tex.wrapS=THREE.RepeatWrapping;tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(2,3);tex.colorSpace=THREE.SRGBColorSpace;return tex;
}
function createRoughTex(){
  const c=document.createElement('canvas');c.width=512;c.height=512;const ctx=c.getContext('2d');
  ctx.fillStyle='#080502';ctx.fillRect(0,0,512,512);
  for(let i=0;i<10000;i++){ctx.fillStyle=`rgba(${100+Math.random()*45},${90+Math.random()*35},${80+Math.random()*30},.25)`;ctx.fillRect(Math.random()*512,Math.random()*512,2+Math.random()*6,2+Math.random()*6)}
  for(let i=0;i<200;i++){ctx.strokeStyle=`rgba(70,60,50,.25)`;ctx.lineWidth=.4+Math.random();ctx.beginPath();ctx.moveTo(Math.random()*512,Math.random()*512);ctx.lineTo(Math.random()*512,Math.random()*512);ctx.stroke()}
  const tex=new THREE.CanvasTexture(c);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(18,18);tex.colorSpace=THREE.SRGBColorSpace;return tex;
}
const groundTex=createGroundTex();const barkTex=createBarkTex();const roughTex=createRoughTex();

// ─── TERRAIN ───
const groundGeo=new THREE.PlaneGeometry(360,360,110,110);const pos=groundGeo.attributes.position;
for(let i=0;i<pos.count;i++){const x=pos.getX(i),y=pos.getY(i),dist=Math.sqrt(x*x+y*y);const h=Math.sin(x*.018)*Math.cos(y*.025)*4+Math.sin(x*.055+y*.04)*2+Math.cos(x*.03)*Math.sin(y*.045)*1.5+Math.sin(x*.09+y*.065)*.7+Math.cos(dist*.025)*.6;if(Math.abs(x)<5&&Math.abs(y)<5)pos.setZ(i,Math.max(h,-.1));else pos.setZ(i,h)}
groundGeo.computeVertexNormals();
const ground=new THREE.Mesh(groundGeo,new THREE.MeshStandardMaterial({map:groundTex,roughness:.76,metalness:.04,roughnessMap:roughTex,color:'#0c0702'}));

  dustGroup.children.forEach(d=>{d.position.x+=d.userData.vx*dt;d.position.y+=d.userData.vy*dt;d.position.z+=d.userData.vz*dt;d.userData.life--;const distToCam=camera.position.distanceTo(d.position);d.material.opacity=flashlightOn?Math.max(0,.04+.12*(1-distToCam/20))*Math.sin(frameCount*.04+d.userData.life*.1):0;if(d.userData.life<=0){d.position.set(camera.position.x+(Math.random()-.5)*35,camera.position.y+.5+Math.random()*5,camera.position.z-(Math.random()*.2+.02)*22);d.userData.life=150+Math.random()*150}});

  if(gameState==='playing'){
    if(mouseLocked){euler.set(cameraPitch,cameraYaw,0);camera.quaternion.setFromEuler(euler)}

    direction.set(velocity.x,0,velocity.z).normalize();sprinting=keys['shift'];const speed=sprinting?8:4.5;
    if(velocity.length()>0){headBob+=dt*12;const fwd=direction.clone().applyQuaternion(camera.quaternion);fwd.y=0;fwd.normalize();camera.position.x+=fwd.x*speed*dt;camera.position.z+=fwd.z*speed*dt;stepTimer+=dt;if(stepTimer>.45){stepTimer=0;sFootstep()}}
    if(!grounded)velocity.y-=18*dt;const bob=velocity.length()>0?Math.sin(headBob)*.06:0;camera.position.y+=bob;
    if((keys[' ']||touchState.jump)&&grounded){velocity.y=9.5;grounded=false;sfx(120,'sine',.02,.06)}
    camera.position.y+=velocity.y*dt;const ty=getTerrainHeight(camera.position.x,camera.position.z);
    if(camera.position.y<=ty+1.6){camera.position.y=ty+1.6;velocity.y=0;grounded=true}
    camera.position.x=Math.max(-135,Math.min(135,camera.position.x));camera.position.z=Math.max(-170,Math.min(15,camera.position.z));
    flashLight.intensity=flashlightOn?3.8:0;flashLight.position.copy(camera.position).add(new THREE.Vector3(0,.5,0));const lookT=new THREE.Vector3();camera.getWorldDirection(lookT);flashTarget.position.copy(camera.position).add(lookT.multiplyScalar(17));
    checkLore();if(Math.random()<.0025){sCreak();if(Math.random()<.25&&rainI>.12)sRain_hit()}
    const cz=camera.position.z;
    if(cz<-30&&!catActive&&!catDefeated){catActive=true;catBoss.visible=true;catBoss.position.set(camera.position.x+(Math.random()-.5)*6,getTerrainHeight(camera.position.x,camera.position.z),camera.position.z-14);showMsg('\uD83D\uDC31 CARTOON CAT: "Another fool enters MY hunting grounds. I can smell your terror..."',5500);showBossBar(catHP,catMHP,'\uD83D\uDC31 CARTOON CAT');sRoar();sStretch();targetRain=.42}
    if(cz<-60&&!sirActive&&!sirDefeated&&catDefeated){sirActive=true;sirenBoss.visible=true;sirenBoss.position.set(camera.position.x+(Math.random()-.5)*8,getTerrainHeight(camera.position.x,camera.position.z),camera.position.z-12);showMsg('\uD83D\uDCE2 SIREN HEAD: *RADIO SCREECH* ...I was once a man named HOLLIS. The frequencies showed me eternity. Now I am the signal of death...',6000);showBossBar(sirHP,sirMHP,'\uD83D\uDCE2 SIREN HEAD');sRoar();targetRain=.62}
    // Cat AI
    if(catActive&&!catDefeated&&catBoss.visible){bossTimers.cat++;catBoss.lookAt(camera.position);const dist=camera.position.distanceTo(catBoss.position);catBoss.position.y=getTerrainHeight(catBoss.position.x,catBoss.position.z)+Math.sin(frameCount*.028)*.55;
      if(bossTimers.cat>80&&dist<18&&!stretchActive){stretchActive=true;bossTimers.cat=0;const rArm=catBoss.getObjectByName('rArm');if(rArm){rArm.scale.y=5.5;rArm.position.z=-4}const rGlove=catBoss.getObjectByName('rGlove');if(rGlove)rGlove.position.z=-18;sStretch();spawnParts(catBoss.position.clone().add(new THREE.Vector3(0,4.5,0)),'#ff0',22,6,45);setTimeout(()=>{const ra=catBoss.getObjectByName('rArm');if(ra){ra.scale.y=1;ra.position.z=0}const rg=catBoss.getObjectByName('rGlove');if(rg)rg.position.z=-.1;stretchActive=false;if(dist<11)takeDamage(26)},1300)}
      if(bossTimers.cat>120&&!stretchActive){bossTimers.cat=0;const mv=camera.position.clone().sub(catBoss.position).normalize().multiplyScalar(2.2);catBoss.position.add(mv);if(dist<8){takeDamage(22);addBloodDecal(camera.position.clone(),3)}}
      const eyes=catBoss.children.filter(c=>c.name==='eye');eyes.forEach(e=>e.material.color.setHSL(.15,.85,.38+.48*Math.sin(frameCount*.003)));showBossBar(catHP,catMHP,'\uD83D\uDC31 CARTOON CAT')}
    // Siren AI
    if(sirActive&&!sirDefeated&&sirenBoss.visible){bossTimers.sir++;sirenBoss.lookAt(camera.position);const dist=camera.position.distanceTo(sirenBoss.position);sirenBoss.position.y=getTerrainHeight(sirenBoss.position.x,sirenBoss.position.z);
      if(sirHP<sirMHP*.35&&!sirSSJ){sirSSJ=true;const a=sirenBoss.getObjectByName('ssjAura');if(a)a.intensity=7;const g=sirenBoss.getObjectByName('ssjGlow');if(g)g.material.opacity=.65;const r=sirenBoss.getObjectByName('ssjRing');if(r)r.material.opacity=.7;sSSJ();spawnParts(sirenBoss.position.clone().add(new THREE.Vector3(0,17,0)),'#ffd700',100,12,120,true);showMsg('\u26a1\u26a1 SIREN HEAD TRANSCENDS — SUPER SAIYAN AWAKENED!!! \u26a1\u26a1',6000);targetRain=.82;thunderTimer=1;thunderFlash=1.5}
      if(bossTimers.sir>70){bossTimers.sir=0;const rush=camera.position.clone().sub(sirenBoss.position).normalize().multiplyScalar(sirSSJ?4:2);sirenBoss.position.add(rush);if(dist<9){takeDamage(sirSSJ?42:24);addBloodDecal(camera.position.clone(),4)}if(Math.random()<.5){sfx(24,'sawtooth',.08,.45);spawnParts(sirenBoss.position.clone().add(new THREE.Vector3(0,10,0)),'#ff5500',32,8,55,true)}}
      if(sirSSJ){const a=sirenBoss.getObjectByName('ssjAura');if(a)a.intensity=5+Math.sin(frameCount*.004)*2.2;const r=sirenBoss.getObjectByName('ssjRing');if(r){r.rotation.z+=.07;r.material.opacity=.6+.35*Math.sin(frameCount*.006)}const hl=sirenBoss.children.filter(c=>c.name==='hornLight');hl.forEach(h=>h.material.color.setHSL(.15,.95,.38+.52*Math.sin(frameCount*.008)))}
      showBossBar(sirHP,sirMHP,(sirSSJ?'\u26a1':'\uD83D\uDCE2')+' SIREN HEAD',sirSSJ)}
  }

  if(gameState==='ending'){endTimer+=dt;const t=endTimer,orR=18;camera.position.x=Math.sin(t*.24)*orR;camera.position.z=-74+Math.cos(t*.24)*orR;camera.position.y=5+Math.sin(t*.14)*3.5;camera.lookAt(0,3.5,-74);endingObjects.forEach(o=>{if(o.type==='Group'){o.position.y+=Math.sin(t*3+o.position.x)*.8;o.rotation.y+=dt*1.4}});if(t>2&&Math.floor(t*2)%3===0)sDance();if(t>2.5&&Math.floor(t*4)%2===0)spawnParts(new THREE.Vector3(0,3,-72),'#ffaa00',12,5,45);if(t>3)showMsg('\uD83D\uDD7A BENDY: *hits the GRIDDY* \uD83E\uDD80 KRABS: "I LOVE MONEY!!" \uD83D\uDD25 *gets FRIED & COOKED*',5500);if(t>16){document.getElementById('overlay').classList.remove('hidden');document.getElementById('overlay').querySelector('h1').textContent='YOU SURVIVED';document.getElementById('overlay').querySelector('.sub').textContent='The Blackwood is FREE';document.getElementById('overlay').querySelector('.blink').textContent='CLICK TO PLAY AGAIN';document.getElementById('overlay').querySelector('.tagline').textContent='1924-2026 | 7 Children Freed | Hollis Released | \uD83C\uDF1F';document.getElementById('overlay').onclick=()=>location.reload()}}
  if(gameState==='gameover'){endTimer+=dt;if(endTimer>7){document.getElementById('overlay').onclick=()=>location.reload()}}

  for(let i=bloodDecals.length-1;i>=0;i--){bloodDecals[i].timer--;if(bloodDecals[i].timer<=0){scene.remove(bloodDecals[i].mesh);bloodDecals.splice(i,1)}}
  mistGroup.children.forEach(m=>{m.position.x+=m.userData.vx*dt;m.position.y+=m.userData.vy*dt;m.position.z+=m.userData.vz*dt;if(m.position.x>70)m.position.x=-70;if(m.position.x<-70)m.position.x=70;if(m.position.y>12)m.position.y=.15;if(m.position.z>5)m.position.z=-155});

  document.getElementById('compass').style.display=showCompass?'block':'none';if(showCompass)drawCompass();
  renderer.render(scene,camera);
}
