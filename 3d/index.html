<!DOCTYPE html>

<title>🌲 FOREST OF NIGHTMARES 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace}
canvas{display:block}
#xhair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:10}
#xhair::before,#xhair::after{content:'';position:absolute;background:rgba(255,200,150,.6)}
#xhair::before{width:1.5px;height:18px;left:8px;top:-1px}
#xhair::after{width:18px;height:1.5px;left:-1px;top:8px}
#hud{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);pointer-events:none;z-index:10;text-align:center}
#hp-outer{width:320px;height:20px;background:rgba(0,0,0,.8);border:2px solid #333;border-radius:4px;overflow:hidden}
#hp-inner{height:100%;background:linear-gradient(90deg,#c0392b,#e74c3c,#f39c12,#2ecc71);transition:width .4s;border-radius:2px}
#hp-label{color:#ddd;font-size:11px;margin-top:4px;text-shadow:0 0 8px rgba(0,0,0,.9)}
#boss-ui{display:none;margin-top:6px}
#boss-outer{width:320px;height:16px;background:rgba(0,0,0,.8);border:2px solid #600;border-radius:4px;overflow:hidden}
#boss-inner{height:100%;background:#e74c3c;transition:width .4s;border-radius:2px}
#boss-label{color:#f66;font-size:10px;margin-top:2px}
#msg{position:fixed;top:80px;left:50%;transform:translateX(-50%);color:#ff8844;font-size:16px;text-align:center;pointer-events:none;z-index:10;text-shadow:0 0 12px #000;opacity:0;transition:opacity .4s}
#msg.on{opacity:1}
#ol{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:100;flex-direction:column;cursor:pointer}
#ol h1{font-size:4em;color:#f30;text-shadow:0 0 60px #f40,0 0 120px #800;margin:0}
#ol p{color:#864;font-size:1.2em;margin:6px 0}
#ol .blink{color:#f62;font-size:2em;animation:bl 1.4s infinite}
@keyframes bl{0%,100%{opacity:.4}50%{opacity:1}}
#ol .info{color:#543;font-size:.85em;margin-top:30px}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.7) 100%)}
</style>
</head>
<body>
<div id="vignette"></div>
<div id="xhair"><div></div><div></div></div>
<div id="hud">
  <div id="hp-outer"><div id="hp-inner" style="width:100%"></div></div>
  <div id="hp-label">HP 100 / 100</div>
  <div id="boss-ui">
    <div id="boss-outer"><div id="boss-inner" style="width:100%"></div></div>
    <div id="boss-label"></div>
  </div>
</div>
<div id="msg"></div>
<div id="ol">
  <h1>🌲 FOREST OF</h1><h1>NIGHTMARES</h1>
  <p>3D Realistic Horror Survival</p>
  <p class="blink">CLICK TO ENTER THE FOREST</p>
  <p class="info">WASD Move · Mouse Look · Click Attack · SPACE Jump · ESC Pause</p>
</div>

<script type="module">
import * as THREE from 'three';

// ═══════════ AUDIO ═══════════
const aCtx=new(window.AudioContext||window.webkitAudioContext)();
function sfx(f,t,d,v=.1,g=0){try{const o=aCtx.createOscillator(),g2=aCtx.createGain(),tm=aCtx.currentTime;o.type=t;o.frequency.setValueAtTime(f,tm);if(g)o.frequency.linearRampToValueAtTime(f+g,tm+d);g2.gain.setValueAtTime(v,tm);g2.gain.exponentialRampToValueAtTime(.001,tm+d);o.connect(g2);g2.connect(aCtx.destination);o.start(tm);o.stop(tm+d)}catch(e){}}
function sHit(){sfx(55,'sawtooth',.12,.2);sfx(25,'square',.06,.15)}
function sPower(){for(let i=0;i<6;i++)setTimeout(()=>sfx(200+i*150,'sine',.06,.05),i*50);sfx(80,'square',.15,.3,60)}
function sStretch(){sfx(40,'sawtooth',.12,.45,20);sfx(60,'square',.08,.3)}
function sRoar(){sfx(22,'sawtooth',.2,.6,10);sfx(38,'square',.12,.4)}
function sDance(){sfx(523,'square',.05,.1);setTimeout(()=>sfx(659,'square',.05,.1),120);setTimeout(()=>sfx(784,'square',.05,.1),240);setTimeout(()=>sfx(1047,'square',.07,.15),360)}
function sSSJ(){for(let i=0;i<10;i++)setTimeout(()=>sfx(250+i*120,'sine',.06,.06),i*50);sfx(55,'sawtooth',.18,.4,70)}
function sWin(){for(let i=0;i<14;i++)setTimeout(()=>sfx(240+i*90,'triangle',.05,.08),i*80)}

// ═══════════ RENDERER ═══════════
const r=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
r.setSize(window.innerWidth,window.innerHeight);
r.setPixelRatio(Math.min(window.devicePixelRatio,2));
r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;
r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=.7;
r.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2('#030008',.00006);
scene.background=new THREE.Color('#030010');

const cam=new THREE.PerspectiveCamera(78,window.innerWidth/window.innerHeight,.2,250);
cam.position.set(0,1.65,8);cam.lookAt(0,1.6,-5);

// ═══════════ LIGHTING ═══════════
scene.add(new THREE.AmbientLight('#151030',.25));
const moonL=new THREE.DirectionalLight('#8899cc',.45);
moonL.position.set(40,50,-30);moonL.castShadow=true;
moonL.shadow.mapSize.set(2048,2048);moonL.shadow.camera.near=.5;moonL.shadow.camera.far=150;
moonL.shadow.camera.left=-40;moonL.shadow.camera.right=40;
moonL.shadow.camera.top=40;moonL.shadow.camera.bottom=-40;
moonL.shadow.bias=-.0002;moonL.shadow.normalBias=.02;
scene.add(moonL);

const flash=new THREE.SpotLight('#ffe8c0',2.5,30,Math.PI/7,.25,1);
flash.position.copy(cam.position);flash.target.position.set(0,0,-20);
flash.castShadow=true;flash.shadow.mapSize.set(512,512);
scene.add(flash);scene.add(flash.target);

// Moon
const moonG=new THREE.SphereGeometry(3.5,32,16);
const moonM=new THREE.MeshBasicMaterial({color:'#ffe0c8'});
const moonObj=new THREE.Mesh(moonG,moonM);
moonObj.position.set(35,40,-60);scene.add(moonObj);
const moonGlow=new THREE.PointLight('#ffe0c8',4,80);
moonGlow.position.copy(moonObj.position);scene.add(moonGlow);

// Stars
const sGeo=new THREE.BufferGeometry();const sArr=[];
for(let i=0;i<2500;i++)sArr.push((Math.random()-.5)*250,30+Math.random()*80,-(Math.random()*.8+.1)*140);
sGeo.setAttribute('position',new THREE.Float32BufferAttribute(sArr,3));
const stars=new THREE.Points(sGeo,new THREE.PointsMaterial({color:'#fff',size:.18,transparent:true,opacity:.85,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(stars);

// ═══════════ GROUND ═══════════
// Create canvas texture for ground
const gCanvas=document.createElement('canvas');gCanvas.width=512;gCanvas.height=512;
const gCtx=gCanvas.getContext('2d');
gCtx.fillStyle='#1a1006';gCtx.fillRect(0,0,512,512);
for(let i=0;i<3000;i++){gCtx.fillStyle=`rgba(${20+Math.random()*30},${12+Math.random()*20},${3+Math.random()*8},.7)`;gCtx.fillRect(Math.random()*512,Math.random()*512,3+Math.random()*4,3+Math.random()*4)}
for(let i=0;i<200;i++){gCtx.strokeStyle=`rgba(25,${15+Math.random()*10},5,.5)`;gCtx.lineWidth=.5+Math.random();gCtx.beginPath();gCtx.moveTo(Math.random()*512,Math.random()*512);gCtx.lineTo(Math.random()*512,Math.random()*512);gCtx.stroke()}
const gTex=new THREE.CanvasTexture(gCanvas);gTex.wrapS=gTex.wrapT=THREE.RepeatWrapping;gTex.repeat.set(30,30);

const gnd=new THREE.Mesh(new THREE.PlaneGeometry(250,250),new THREE.MeshStandardMaterial({map:gTex,roughness:.9,metalness:0,color:'#1a1008'}));
gnd.rotation.x=-Math.PI/2;gnd.receiveShadow=true;scene.add(gnd);

// Path texture
const pCanvas=document.createElement('canvas');pCanvas.width=256;pCanvas.height=32;
const pCtx=pCanvas.getContext('2d');
pCtx.fillStyle='#1a1208';pCtx.fillRect(0,0,256,32);for(let i=0;i<400;i++){pCtx.fillStyle=`rgba(${25+Math.random()*15},${15+Math.random()*10},${5+Math.random()*5},.5)`;pCtx.fillRect(Math.random()*256,Math.random()*32,2+Math.random()*3,1+Math.random()*2)}
const pTex=new THREE.CanvasTexture(pCanvas);pTex.wrapS=THREE.RepeatWrapping;pTex.repeat.set(20,1);

const path=new THREE.Mesh(new THREE.PlaneGeometry(4,250),new THREE.MeshStandardMaterial({map:pTex,roughness:.8,transparent:true,opacity:.6,color:'#1a1208'}));
path.rotation.x=-Math.PI/2;path.position.y=.01;path.position.z=-60;path.receiveShadow=true;scene.add(path);

// ═══════════ TREES ═══════════
const treesG=new THREE.Group();
for(let i=0;i<150;i++){
  const tx=(Math.random()-.5)*180,tz=-(Math.random()*.75+.05)*150;
  if(Math.abs(tx)<2.5&&tz>-6&&tz<0)continue;
  const h=3+Math.random()*12;
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.15+Math.random()*.3,.25+Math.random()*.4,h,8,4),new THREE.MeshStandardMaterial({color:`rgb(${35+Math.random()*25},${20+Math.random()*15},${8+Math.random()*8})`,roughness:.95}));
  trunk.position.set(tx,h/2,tz);trunk.castShadow=true;trunk.receiveShadow=true;treesG.add(trunk);
  const leaves=2+Math.floor(Math.random()*3);
  for(let l=0;l<leaves;l++){
    const cy=h*.45+l*1.5,cr=1.5+l*.8+(Math.random()-.5)*.5;
    const cone=new THREE.Mesh(new THREE.ConeGeometry(cr,2.5+Math.random()*2,8,4),new THREE.MeshStandardMaterial({color:`rgb(${6+Math.random()*8},${12+Math.random()*16},${3+Math.random()*6})`,roughness:.9}));
    cone.position.set(tx,cy,tz);cone.castShadow=true;cone.receiveShadow=true;treesG.add(cone);
  }
  // Dead branch
  if(Math.random()<.3){
    const branch=new THREE.Mesh(new THREE.CylinderGeometry(.05,.08,1+Math.random()*2,6),new THREE.MeshStandardMaterial({color:'#2a1a08',roughness:.9}));
    branch.position.set(tx+(Math.random()-.5)*.8,h*.6,tz);branch.rotation.z=(Math.random()-.5)*1.2;branch.rotation.x=(Math.random()-.5)*.8;branch.castShadow=true;treesG.add(branch);
  }
}
scene.add(treesG);

// ═══════════ ROCKS ═══════════
for(let i=0;i<60;i++){
  const rx=(Math.random()-.5)*150,rz=-(Math.random()*.65+.1)*140;
  const s=.2+Math.random()*1.5;
  const rock=new THREE.Mesh(new THREE.IcosahedronGeometry(s,1),new THREE.MeshStandardMaterial({color:`rgb(${40+Math.random()*40},${35+Math.random()*35},${30+Math.random()*30})`,roughness:.75}));
  rock.position.set(rx,s*.3,rz);rock.rotation.set(Math.random()*Math.PI,Math.random()*Math.PI,Math.random()*Math.PI);rock.castShadow=true;rock.receiveShadow=true;scene.add(rock);
}

// ═══════════ MIST PARTICLES ═══════════
const mistG=new THREE.Group();
for(let i=0;i<30;i++){
  const mist=new THREE.Mesh(new THREE.PlaneGeometry(3+Math.random()*8,2+Math.random()*5),new THREE.MeshBasicMaterial({color:'#1a1520',transparent:true,opacity:.08+Math.random()*.08,depthWrite:false,side:THREE.DoubleSide}));
  mist.position.set((Math.random()-.5)*80,1+Math.random()*6,-(Math.random()*.7+.1)*100);
  mist.userData={vx:(Math.random()-.5)*.3,vy:.02+Math.random()*.05,vz:(Math.random()-.5)*.2};
  mistG.add(mist);
}
scene.add(mistG);

// ═══════════ PLAYER STATE ═══════════
const keys={};let mLocked=false,pX=0,pY=0;
const vel=new THREE.Vector3(),dir=new THREE.Vector3(),eul=new THREE.Euler(0,0,0,'YXZ');
let hp=100,mhp=100;let attCd=0;let grd=true;let gs='title';let dmFl=0,headBob=0;
let catVis=false,catHp=250,catMhp=250,catDef=false;
let sirVis=false,sirHp=400,sirMhp=400,sirDef=false,sirSSJ=false;
let catTimer=0,sirTimer=0,endTimer=0;let catStretch=false;

// Input
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')e.preventDefault()});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
document.addEventListener('mousemove',e=>{if(mLocked){pX-=e.movementX*.002;pY-=e.movementY*.002;pY=Math.max(-1.2,Math.min(1.2,pY))}});
document.addEventListener('click',()=>{
  if(gs==='title'){startGame();return}
  if(!mLocked&&gs!=='ending'&&gs!=='gameover'){r.domElement.requestPointerLock();return}
  if(mLocked&&attCd<=0&&gs==='playing'){attCd=35;sfx(45,'sawtooth',.06,.12);tryAttack()}
});
document.addEventListener('pointerlockchange',()=>{mLocked=document.pointerLockElement===r.domElement});
window.addEventListener('resize',()=>{cam.aspect=window.innerWidth/window.innerHeight;cam.updateProjectionMatrix();r.setSize(window.innerWidth,window.innerHeight)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mLocked)document.exitPointerLock()});

// UI helpers
function msg(t,d=2500){const m=document.getElementById('msg');m.textContent=t;m.classList.add('on');clearTimeout(m._t);m._t=setTimeout(()=>m.classList.remove('on'),d)}
function updHp(){const p=Math.max(0,hp/mhp*100);document.getElementById('hp-inner').style.width=p+'%';document.getElementById('hp-label').textContent=`HP ${Math.ceil(hp)} / ${mhp}`}
function bossUI(name,chp,mhp2,ssj=false){
  const b=document.getElementById('boss-ui');b.style.display='block';
  document.getElementById('boss-inner').style.width=(chp/mhp2*100)+'%';
  document.getElementById('boss-inner').style.background=ssj?'#ffd700':'#e74c3c';
  document.getElementById('boss-label').textContent=name+(ssj?' ⚡SUPER SAIYAN!':'');
  document.getElementById('boss-outer').style.borderColor=ssj?'#ffd700':'#600';
}

function takeDmg(amt){
  if(dmFl>0)return;hp-=amt;dmFl=12;updHp();sHit();
  if(hp<=0){hp=0;gs='gameover';document.exitPointerLock();msg('💀 YOU DIED — The forest claims another... Click to retry',4000)}
}
function spawnParts(pos,color,n=30,spd=5,life=50){
  const g=new THREE.Group();
  for(let i=0;i<n;i++){const geo=new THREE.SphereGeometry(.04+.08*Math.random(),4);const mat=new THREE.MeshBasicMaterial({color,transparent:true,opacity:1});const p=new THREE.Mesh(geo,mat);p.position.copy(pos);p.userData={vx:(Math.random()-.5)*spd,vy:Math.random()*spd*.7,vz:(Math.random()-.5)*spd,life};g.add(p)}
  scene.add(g);setTimeout(()=>{scene.remove(g);g.children.forEach(c=>c.material.dispose());g.children.forEach(c=>c.geometry.dispose())},life*16);
}

// ═══════════ 3D BOSSES ═══════════
function createCat(){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.SphereGeometry(2.5,2,1.6,16,8),new THREE.MeshStandardMaterial({color:'#1a1a1a',roughness:.55}));body.scale.set(1,1.2,1);body.position.y=1.5;body.castShadow=true;g.add(body);
  for(let s=-1;s<=1;s+=2){const ear=new THREE.Mesh(new THREE.ConeGeometry(.65,2,8),new THREE.MeshStandardMaterial({color:'#1a1a1a',roughness:.5}));ear.position.set(s*1.3,3.6,0);ear.rotation.z=s*.35;ear.castShadow=true;g.add(ear);const ie=new THREE.Mesh(new THREE.ConeGeometry(.35,1.3,8),new THREE.MeshStandardMaterial({color:'#2a1010',roughness:.5}));ie.position.set(s*1.3,3.3,0);ie.rotation.z=s*.35;g.add(ie)}
  for(let s=-1;s<=1;s+=2){const eye=new THREE.Mesh(new THREE.SphereGeometry(.45,16,8),new THREE.MeshBasicMaterial({color:'#ffff00'}));eye.position.set(s*.9,2.85,-1.9);eye.name='catEye';g.add(eye);const pup=new THREE.Mesh(new THREE.SphereGeometry(.16,8,8),new THREE.MeshBasicMaterial({color:'#000'}));pup.position.set(s*.9,2.85,-2.15);g.add(pup)}
  for(let i=-7;i<=7;i+=3){const tooth=new THREE.Mesh(new THREE.BoxGeometry(.14,.45,.14),new THREE.MeshStandardMaterial({color:'#fff',roughness:.2}));tooth.position.set(i*.35,1.45,-2.3);g.add(tooth)}
  for(let s=-1;s<=1;s+=2){const arm=new THREE.Mesh(new THREE.CylinderGeometry(.28,.32,3.5,8),new THREE.MeshStandardMaterial({color:'#1a1a1a',roughness:.5}));arm.position.set(s*2.7,1.7,0);arm.name=s>0?'rArm':'lArm';arm.castShadow=true;g.add(arm);const paw=new THREE.Mesh(new THREE.SphereGeometry(.45,8,8),new THREE.MeshStandardMaterial({color:'#222',roughness:.4}));paw.position.set(s*3.4,.2,0);paw.name=s>0?'rPaw':'lPaw';g.add(paw)}
  // Whiskers
  for(let s=-1;s<=1;s+=2){for(let j=-1;j<=1;j++){const w=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,1.5,4),new THREE.MeshBasicMaterial({color:'#333'}));w.position.set(s*1.1,2.2,j*.8-1.8);w.rotation.z=Math.PI/2;w.rotation.y=j*.3;g.add(w)}}
  g.visible=false;g.position.set(0,0,-50);
  scene.add(g);return g;
}
const catG=createCat();

function createSiren(){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(1.3,9,1.1),new THREE.MeshStandardMaterial({color:'#4a3520',roughness:.75}));body.position.y=4.5;body.castShadow=true;g.add(body);
  for(let s=-1;s<=1;s+=2){const leg=new THREE.Mesh(new THREE.BoxGeometry(.38,8,.38),new THREE.MeshStandardMaterial({color:'#3a2515',roughness:.8}));leg.position.set(s*.4,-.3,0);leg.castShadow=true;g.add(leg)}
  for(let i=0;i<7;i++){const rib=new THREE.Mesh(new THREE.BoxGeometry(1.1,.06,.06),new THREE.MeshStandardMaterial({color:'#2a180a',roughness:.7}));rib.position.set(0,1.2+i*1.1,.5);g.add(rib)}
  const neck=new THREE.Mesh(new THREE.CylinderGeometry(.28,.34,6,8),new THREE.MeshStandardMaterial({color:'#5a4530',roughness:.7}));neck.position.y=10.5;neck.castShadow=true;g.add(neck);
  for(let s=-1;s<=1;s+=2){const sp=new THREE.Mesh(new THREE.ConeGeometry(.9,3,6),new THREE.MeshStandardMaterial({color:'#6a5040',roughness:.5,metalness:.25}));sp.position.set(s*.8,13.5,0);sp.rotation.z=s*.25;sp.castShadow=true;sp.name='speaker';g.add(sp);const gr=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,.6,8),new THREE.MeshStandardMaterial({color:'#151515',roughness:.2,metalness:.4}));gr.position.set(s*.8,12.8,0);g.add(gr);const hl=new THREE.Mesh(new THREE.SphereGeometry(.1,6),new THREE.MeshBasicMaterial({color:'#ff0000'}));hl.position.set(s*.8,13.5,.9);hl.name='hornLight';g.add(hl)}
  for(let s=-1;s<=1;s+=2){const eye=new THREE.Mesh(new THREE.SphereGeometry(.22,8,8),new THREE.MeshBasicMaterial({color:'#ff0000'}));eye.position.set(s*.32,8,-.5);eye.name='sirEye';g.add(eye)}
  for(let s=-1;s<=1;s+=2){const arm=new THREE.Mesh(new THREE.CylinderGeometry(.2,.24,5,8),new THREE.MeshStandardMaterial({color:'#453020',roughness:.75}));arm.position.set(s*1.3,3.5,0);arm.rotation.z=s*.35;arm.castShadow=true;g.add(arm)}
  // SSJ aura
  const aura=new THREE.PointLight('#ffd700',0,18);aura.position.y=13;aura.name='ssjAura';g.add(aura);
  const glow=new THREE.Mesh(new THREE.SphereGeometry(3.5,16,16),new THREE.MeshBasicMaterial({color:'#ffd700',transparent:true,opacity:0,depthWrite:false}));glow.position.y=13;glow.name='ssjGlow';g.add(glow);
  // Energy ring
  const ring=new THREE.Mesh(new THREE.TorusGeometry(3,.15,8,32),new THREE.MeshBasicMaterial({color:'#ffd700',transparent:true,opacity:0,depthWrite:false}));ring.rotation.x=Math.PI/2;ring.position.y=13;ring.name='ssjRing';g.add(ring);
  g.visible=false;g.position.set(5,0,-80);
  scene.add(g);return g;
}
const sirenG=createSiren();

// ═══════════ ENDING PROPS ═══════════
// 3D Bendy figure at celebration spot
const bendyG=new THREE.Group();
bendyG.position.set(-5,0,-70);bendyG.visible=false;
const bBody=new THREE.Mesh(new THREE.CylinderGeometry(.8,1,2.5,12),new THREE.MeshStandardMaterial({color:'#0d0d0d',roughness:.4}));bBody.position.y=1.5;bBody.castShadow=true;bendyG.add(bBody);
const bHead=new THREE.Mesh(new THREE.SphereGeometry(.9,12,8),new THREE.MeshStandardMaterial({color:'#0d0d0d',roughness:.4}));bHead.position.y=3.2;bHead.castShadow=true;bendyG.add(bHead);
for(let s=-1;s<=1;s+=2){const horn=new THREE.Mesh(new THREE.ConeGeometry(.2,.7,6),new THREE.MeshStandardMaterial({color:'#1a1a1a',roughness:.4}));horn.position.set(s*.35,3.8,0);horn.rotation.z=s*.2;bendyG.add(horn)}
for(let s=-1;s<=1;s+=2){const eye=new THREE.Mesh(new THREE.SphereGeometry(.25,8,6),new THREE.MeshBasicMaterial({color:'#fff'}));eye.position.set(s*.3,3.3,-.7);bendyG.add(eye);const pup=new THREE.Mesh(new THREE.SphereGeometry(.1,6,6),new THREE.MeshBasicMaterial({color:'#111'}));pup.position.set(s*.3,3.3,-.9);bendyG.add(pup)}
const bTie=new THREE.Mesh(new THREE.BoxGeometry(.25,.25,.1),new THREE.MeshStandardMaterial({color:'#fff'}));bTie.position.set(0,2.2,-.8);bendyG.add(bTie);
scene.add(bendyG);

// Mr Krabs
const krabsG=new THREE.Group();
krabsG.position.set(5,0,-70);krabsG.visible=false;
const kBody=new THREE.Mesh(new THREE.SphereGeometry(1.2,1,.9,12,8),new THREE.MeshStandardMaterial({color:'#e82020',roughness:.3}));kBody.scale.set(1.2,1,1);kBody.position.y=1.2;kBody.castShadow=true;krabsG.add(kBody);
for(let s=-1;s<=1;s+=2){const claw=new THREE.Mesh(new THREE.SphereGeometry(.6,8,8),new THREE.MeshStandardMaterial({color:'#ff3030',roughness:.3}));claw.position.set(s*1.8,1,.5);krabsG.add(claw);const arm=new THREE.Mesh(new THREE.CylinderGeometry(.15,.2,1.2,6),new THREE.MeshStandardMaterial({color:'#d42020'}));arm.position.set(s*1.3,1,.5);arm.rotation.z=-Math.PI/2;arm.rotation.y=s*.3;krabsG.add(arm)}
for(let s=-1;s<=1;s+=2){const eyeStalk=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.5,6),new THREE.MeshStandardMaterial({color:'#d42020'}));eyeStalk.position.set(s*.5,2,.5);krabsG.add(eyeStalk);const eye=new THREE.Mesh(new THREE.SphereGeometry(.25,8,8),new THREE.MeshBasicMaterial({color:'#fff'}));eye.position.set(s*.5,2.4,.6);krabsG.add(eye);const pup=new THREE.Mesh(new THREE.SphereGeometry(.1,6,6),new THREE.MeshBasicMaterial({color:'#111'}));pup.position.set(s*.5,2.4,.75);krabsG.add(pup)}
const belly=new THREE.Mesh(new THREE.SphereGeometry(.7,.5,.6,12),new THREE.MeshStandardMaterial({color:'#ffe8c0',roughness:.5}));belly.position.y=.9;belly.position.z=-.5;krabsG.add(belly);
scene.add(krabsG);

// ═══════════ ATTACK RAYCAST ═══════════
const raycaster=new THREE.Raycaster();
raycaster.far=8;
function tryAttack(){
  raycaster.set(cam.position,cam.getWorldDirection(new THREE.Vector3()));
  const targets=[];
  if(catG.visible&&!catDef)catG.children.forEach(c=>targets.push(c));
  if(sirenG.visible&&!sirDef)sirenG.children.forEach(c=>targets.push(c));
  const hits=raycaster.intersectObjects(targets,true);
  if(hits.length>0){
    const hp= hits[0].point;
    spawnParts(hp,'#ff6644',20,4,40);
    // Determine which boss was hit
    let hitCat=false,hitSir=false;
    hits[0].object.traverseAncestors(a=>{if(a===catG)hitCat=true;if(a===sirenG)hitSir=true});
    if(hitCat&&!catDef){catHp-=18;if(catHp<=0){catHp=0;spawnParts(catG.position.clone().add(new THREE.Vector3(0,2,0)),'#ff4400',60,8,70);catG.visible=false;catDef=true;msg('💀 CARTOON CAT DEFEATED! Keep exploring...',4000);sPower();hp=Math.min(100,hp+50);updHp();document.getElementById('boss-ui').style.display='none'}}
    if(hitSir&&!sirDef){sirHp-=15;if(sirHp<=0){sirHp=0;spawnParts(sirenG.position.clone().add(new THREE.Vector3(0,8,0)),'#ffd700',80,10,90);sirenG.visible=false;sirDef=true;gs='ending';document.exitPointerLock();document.getElementById('boss-ui').style.display='none';msg('🏆 SIREN HEAD DEFEATED! THE FOREST IS SAVED!',5000);sPower();sWin()}}
    sHit();
  }
}

// ═══════════ GAME START ═══════════
function startGame(){
  actx.resume();
  gs='playing';hp=100;catHp=250;catDef=false;sirHp=400;sirDef=false;sirSSJ=false;
  catVis=false;sirVis=false;catTimer=0;sirTimer=0;endTimer=0;
  catG.visible=false;sirenG.visible=false;bendyG.visible=false;krabsG.visible=false;
  catG.position.set(0,0,-50);sirenG.position.set(5,0,-80);
  cam.position.set(0,1.65,8);pX=0;pY=0;
  document.getElementById('ol').style.display='none';
  document.getElementById('boss-ui').style.display='none';
  updHp();r.domElement.requestPointerLock();
  msg('🌲 Walk forward into the dark forest... Watch your step.',3500);
  sfx(100,'triangle',.04,1.5);
}

// ═══════════ GAME LOOP ═══════════
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.12);
  
  // Damage flash
  if(dmFl>0){dmFl--;r.domElement.style.filter=`brightness(${1+dmFl*.025})`}else r.domElement.style.filter='';
  if(attCd>0)attCd--;
  
  if(gs==='playing'){
    // Mouse look
    if(mLocked){eul.set(pY,pX,0);cam.quaternion.setFromEuler(eul)}
    
    // Movement
    vel.x=0;vel.z=0;
    if(keys['w'])vel.z-=1;if(keys['s'])vel.z+=1;
    if(keys['a'])vel.x-=1;if(keys['d'])vel.x+=1;
    dir.set(vel.x,0,vel.z).normalize();
    const spd=keys['shift']?7:3.5;
    if(vel.length()>0){
      headBob+=dt*10;
      cam.position.x+=dir.x*spd*dt;cam.position.z+=dir.z*spd*dt;
    }
    // Headbob
    const bob=vel.length()>0?Math.sin(headBob)*.04:0;
    cam.position.y+=bob;
    
    // Jump/gravity
    if(keys[' ']&&grd){vel.y=7.5;grd=false;sfx(130,'sine',.03,.06)}
    vel.y-=14*dt;cam.position.y+=vel.y*dt;
    if(cam.position.y<=1.65){cam.position.y=1.65;vel.y=0;grd=true}
    
    // Clamp
    cam.position.x=Math.max(-70,Math.min(70,cam.position.x));
    cam.position.z=Math.max(-110,Math.min(6,cam.position.z));
    
    // Flashlight follows camera
    flash.position.copy(cam.position);
    flash.target.position.copy(cam.position).add(cam.getWorldDirection(new THREE.Vector3()).multiplyScalar(12));
    
    const cz=cam.position.z;
    
    // Trigger Cat boss
    if(cz<-25&&!catVis&&!catDef){
      catVis=true;catG.visible=true;
      catG.position.set(cam.position.x+(Math.random()-.5)*4,0,cam.position.z-10);
      msg('🐱 CARTOON CAT emerges from the shadows... "Meow..."',3500);
      bossUI('🐱 CARTOON CAT',catHp,catMhp);sRoar();
    }
    // Trigger Siren boss
    if(cz<-55&&!sirVis&&!sirDef&&catDef){
      sirVis=true;sirenG.visible=true;
      sirenG.position.set(cam.position.x+(Math.random()-.5)*6,0,cam.position.z-8);
      msg('📢 SIREN HEAD: *DEAFENING SCREECH* ...can you handle... SUPER SAIYAN?!',4000);
      bossUI('📢 SIREN HEAD',sirHp,sirMhp);sRoar();
    }
    
    // Update Cat Boss
    if(catVis&&!catDef){
      catTimer++;
      catG.lookAt(cam.position);
      const d=cam.position.distanceTo(catG.position);
      // Stretch attack
      if(catTimer>90&&d<14&&!catStretch){
        catStretch=true;catTimer=0;
        const rArm=catG.getObjectByName('rArm');if(rArm){rArm.scale.y=3.5;rArm.position.z=-2;}
        const rPaw=catG.getObjectByName('rPaw');if(rPaw){rPaw.position.z=-10.5}
        sStretch();spawnParts(catG.position.clone().add(new THREE.Vector3(0,1.5,0)),'#ff0',15,3,30);
        setTimeout(()=>{
          const rArm2=catG.getObjectByName('rArm');if(rArm2){rArm2.scale.y=1;rArm2.position.z=0;}
          const rPaw2=catG.getObjectByName('rPaw');if(rPaw2){rPaw2.position.z=0}
          catStretch=false;if(d<7)takeDmg(18);
        },900);
      }
      // Lunge
      if(catTimer>130&&!catStretch){
        catTimer=0;const toP=cam.position.clone().sub(catG.position).normalize();
        catG.position.add(toP.multiplyScalar(.2));if(d<4){takeDmg(20);catG.position.z+=6}
      }
      // Eye glow
      const eyes=catG.children.filter(c=>c.name==='catEye');
      eyes.forEach(e=>{e.material.color.setHSL(.15,.8,.5+.3*Math.sin(Date.now()*.004))});
      bossUI('🐱 CARTOON CAT',catHp,catMhp);
    }
    
    // Update Siren Boss
    if(sirVis&&!sirDef){
      sirTimer++;
      sirenG.lookAt(cam.position);
      const d=cam.position.distanceTo(sirenG.position);
      // SSJ trigger
      if(sirHp<sirMhp*.35&&!sirSSJ){
        sirSSJ=true;
        const aura=sirenG.getObjectByName('ssjAura');if(aura)aura.intensity=3.5;
        const glow=sirenG.getObjectByName('ssjGlow');if(glow)glow.material.opacity=.45;
        const ring=sirenG.getObjectByName('ssjRing');if(ring)ring.material.opacity=.5;
        sSSJ();spawnParts(sirenG.position.clone().add(new THREE.Vector3(0,12,0)),'#ffd700',60,6,80);
        msg('⚡⚡ SIREN HEAD GOES SUPER SAIYAN!!! ⚡⚡',4500);
      }
      // Rush
      if(sirTimer>75){
        sirTimer=0;const toP=cam.position.clone().sub(sirenG.position).normalize().multiplyScalar(sirSSJ?2:1);
        sirenG.position.add(toP.multiplyScalar(.18));if(d<5)takeDmg(sirSSJ?28:16);
        if(Math.random()<.5){sfx(30,'sawtooth',.15,.5);spawnParts(sirenG.position.clone().add(new THREE.Vector3(0,6,0)),'#ff5500',15,4,35)}
      }
      // SSJ effects
      if(sirSSJ){
        const aura=sirenG.getObjectByName('ssjAura');if(aura)aura.intensity=3+.8*Math.sin(Date.now()*.006);
        const ring=sirenG.getObjectByName('ssjRing');if(ring){ring.rotation.z+=.03;ring.material.opacity=.4+.15*Math.sin(Date.now()*.008)}
        const hornLights=sirenG.children.filter(c=>c.name==='hornLight');hornLights.forEach(h=>h.material.color.setHSL(.15,.9,.5+.4*Math.sin(Date.now()*.01)))
      }
      bossUI((sirSSJ?'⚡':'📢')+' SIREN HEAD',sirHp,sirMhp,sirSSJ);
    }
    
    updHp();
  }
  
  // Ending sequence
  if(gs==='ending'){
    endTimer+=dt;
    const t=endTimer;
    // Camera orbits
    const orbR=18;
    cam.position.x=Math.sin(t*.25)*orbR;
    cam.position.z=-70+Math.cos(t*.25)*orbR;
    cam.position.y=3.5+Math.sin(t*.15)*2.5;
    cam.lookAt(0,2,-70);
    
    if(t>.5&&!bendyG.visible){bendyG.visible=true;krabsG.visible=true}
    // Bendy bounces (Griddy)
    if(bendyG.visible){bendyG.position.y=Math.abs(Math.sin(t*5))*.4;bendyG.rotation.y+=dt*.5}
    // Krabs bobs
    if(krabsG.visible){krabsG.position.y=Math.sin(t*3)*.3}
    // Cuphead: pizza & orange effects
    if(t>1.5){const g=new THREE.Group();for(let i=0;i<15;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.08,4),new THREE.MeshBasicMaterial({color:'#ff8c00',transparent:true,opacity:.7}));p.position.set(krabsG.position.x+(Math.random()-.5)*4,krabsG.position.y+2+Math.random()*3,krabsG.position.z+(Math.random()-.5)*3);g.add(p)}scene.add(g);setTimeout(()=>scene.remove(g),1500)}
    // Krabs fried effect
    if(t>2.5&&Math.floor(t*4)%2===0){spawnParts(krabsG.position.clone().add(new THREE.Vector3(0,1.5,0)),'#ff4400',8,3,40)}
    // Dance beats
    if(t>1&&Math.floor(t*3)%2===0)sDance();
    // Money text
    if(t>3)msg('💰 MR KRABS: "I LOVE MONEY!" ... 🔥 GETTING FRIED & COOKED! 🍕 CUPHEAD CENSORED PIZZA!',5000);
    
    // Restart
    if(t>10){
      document.getElementById('ol').style.display='flex';
      document.getElementById('ol').innerHTML='<h1>🏆 YOU SURVIVED!</h1><p>The Forest of Nightmares is safe... for now</p><p style="color:#f62;font-size:1.3em">Bendy Griddy ✅ Cuphead Pizza ✅ Mr. Krabs Fried ✅</p><p class="blink">CLICK TO PLAY AGAIN</p>';
      document.getElementById('ol').onclick=()=>location.reload();
    }
  }
  
  // Game Over
  if(gs==='gameover'){
    endTimer+=dt;
    if(endTimer>2){
      document.getElementById('ol').style.display='flex';
      document.getElementById('ol').innerHTML='<h1>💀 GAME OVER</h1><p style="color:#f66">The forest claims another soul...</p><p class="blink">CLICK TO RETRY</p>';
      document.getElementById('ol').onclick=()=>location.reload();
    }
  }
  
  // Mist animation
  mistG.children.forEach(m=>{m.position.x+=m.userData.vx*dt;m.position.y+=m.userData.vy*dt;m.position.z+=m.userData.vz*dt;if(m.position.x>40)m.position.x=-40;if(m.position.x<-40)m.position.x=40;if(m.position.y>8)m.position.y=1;if(m.position.z>0)m.position.z=-100});
  
  // Stars twinkle
  stars.rotation.y+=dt*.015;
  
  // Dynamic fog
  scene.fog.density=.000058+.000015*Math.sin(Date.now()*.0002);
  
  r.render(scene,cam);
}

loop();
console.log('🌲 FOREST OF NIGHTMARES 3D — READY');
console.log('🎮 Click to start · WASD move · Mouse look · Click attack · SPACE jump · ESC pause');
console.log('🐱 Cartoon Cat stretch · 📢 Siren Head SSJ · 🕺 Bendy Griddy · 🍕 Cuphead · 🦀 Mr Krabs');
</script>
